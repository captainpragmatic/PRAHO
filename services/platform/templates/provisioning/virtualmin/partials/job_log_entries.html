{% load i18n %}
{% for entry in logs %}
<div class="text-sm font-mono flex gap-3">
  <span class="text-slate-500 shrink-0">{{ entry.timestamp }}</span>
  <span class="shrink-0 {% if entry.level == 'ERROR' %}text-red-400{% elif entry.level == 'SUCCESS' %}text-green-400{% elif entry.level == 'DEBUG' %}text-slate-400{% else %}text-blue-400{% endif %}">{{ entry.level }}</span>
  <span class="text-slate-200 break-all">{{ entry.message }}</span>
</div>
{% empty %}
<div class="text-sm text-slate-400 italic">{% trans "No log entries yet." %}</div>
{% endfor %}
