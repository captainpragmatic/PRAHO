{% load ui_components %}
<button type="button" class="toggle-switch" hx-post="{{ toggle_url }}"
  hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' hx-target="this" hx-swap="outerHTML"
  aria-pressed="{{ enabled|yesno:'true,false' }}">
  {% if enabled %}{% badge label variant="success" %}{% else %}{% badge label variant="secondary" %}{% endif %}
</button>
