# PRAHO native mail capability. Customer enrollment owns its exact user roster separately.
protocols = imap pop3 submission
ssl = required
ssl_min_protocol = TLSv1.2
ssl_cert = </etc/praho-mail/node.pem
ssl_key = </etc/praho-mail/node.key
ssl_ca = </etc/ssl/certs/ca-certificates.crt
ssl_client_ca_file = /etc/ssl/certs/ca-certificates.crt
disable_plaintext_auth = yes
auth_mechanisms = plain login
auth_verbose_passwords = no
auth_cache_size = 0
login_trusted_networks =
mail_location = maildir:~/Maildir
service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
service pop3-login {
  inet_listener pop3 {
    port = 0
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}
service submission-login {
  inet_listener submission {
    port = 0
  }
  inet_listener submissions {
    port = 465
    ssl = yes
  }
}
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
