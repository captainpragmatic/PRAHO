# No native Unix/PAM fallback. Only explicitly enrolled hosted users may authenticate.
passdb {
  driver = passwd-file
  args = /etc/dovecot/praho-deny
  deny = yes
  result_internalfail = return-fail
}
passdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/praho-proxy-%s
  result_success = return-ok
  result_failure = return-fail
  result_internalfail = return-fail
}
userdb {
  driver = passwd
}
