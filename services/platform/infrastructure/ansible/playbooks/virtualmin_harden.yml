# Security Hardening Playbook for Virtualmin Servers
# Run after Virtualmin installation to apply security best practices
---
- name: Harden Virtualmin server security
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Read the installed Webmin version for policy qualification
      ansible.builtin.slurp:
        src: /usr/share/webmin/version
      register: policy_webmin_version

    - name: Read the installed Virtualmin version for policy qualification
      ansible.builtin.slurp:
        src: /usr/share/webmin/virtual-server/module.info
      register: policy_virtualmin_version

    - name: Require qualified native callbacks before conversion
      ansible.builtin.assert:
        that:
          - policy_webmin_version.content | b64decode | trim == '2.670'
          - (policy_virtualmin_version.content | b64decode | regex_search('(?m)^version=8\\.3\\.0$')) is not none
        fail_msg: "This native version needs policy qualification. Import and source acknowledgment remain available."
    - name: Require an approved conversion or a newly generated node
      ansible.builtin.assert:
        that:
          - praho_generated_node | default(false) | bool or security_hardening_approved | default(false) | bool
          - praho_api_user is defined
          - praho_api_user != 'root'
        fail_msg: "Review the node and approve its exact conversion before hardening."

    - name: Converge the reviewed host firewall
      ansible.builtin.include_role:
        name: virtualmin-web-only

    - name: Read installed packages and service units
      ansible.builtin.package_facts:
        manager: apt

    - name: Purge unused authentication and file transfer packages
      vars:
        # The unchanged base profile keeps its existing purge. An explicitly selected
        # extension leaves legacy protection until qualified CrowdSec retirement.
        praho_unused_auth_pattern: "{{ '^(usermin|proftpd.*)$' if security_policy_version | default('virtualmin-web-only-v2') == 'virtualmin-web-only-v2+crowdsec-v1' else '^(fail2ban|usermin|proftpd.*)$' }}"
      ansible.builtin.apt:
        name: "{{ ansible_facts.packages.keys() | select('match', praho_unused_auth_pattern) | list }}"
        state: absent
        purge: true
      when: ansible_facts.packages.keys() | select('match', praho_unused_auth_pattern) | list | length > 0

    - name: Install system update and password policy tools
      ansible.builtin.apt:
        name: [unattended-upgrades, apt-listchanges, logwatch, libpam-pwquality, nftables]
        state: present

    - name: Read service units before disabling public ancillary services
      ansible.builtin.service_facts:

    - name: Stop and prevent restarting ancillary public services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
      loop: [dovecot.service, dovecot.socket, bind9.service, named.service, exim4.service, rpcbind.service, rpcbind.socket, avahi-daemon.service, avahi-daemon.socket, cups.service, cups.socket]
      when: item in ansible_facts.services

    - name: Discover Postfix configuration tooling
      ansible.builtin.stat:
        path: /usr/sbin/postconf
      register: postfix_tool

    - name: Read Postfix listening policy
      ansible.builtin.command:
        argv: [postconf, -h, inet_interfaces]
      register: postfix_interfaces
      changed_when: false
      when: postfix_tool.stat.exists

    - name: Restrict the local application mailer to loopback
      ansible.builtin.command:
        argv: [postconf, -e, 'inet_interfaces = loopback-only']
      when: postfix_tool.stat.exists and postfix_interfaces.stdout | trim != 'loopback-only'
      notify: Restart postfix

    - name: Find MariaDB server configuration
      ansible.builtin.stat:
        path: /etc/mysql/mariadb.conf.d/50-server.cnf
      register: mariadb_configuration

    - name: Restrict MariaDB to loopback
      ansible.builtin.lineinfile:
        path: /etc/mysql/mariadb.conf.d/50-server.cnf
        regexp: '^\\s*bind-address\\s*='
        line: 'bind-address = 127.0.0.1'
        insertafter: '^\\[mysqld\\]'
      when: mariadb_configuration.stat.exists
      notify: Restart mariadb

    - name: Find existing customer Webmin logins
      ansible.builtin.command:
        argv: [virtualmin, list-domains, --with-feature, webmin, --name-only]
      register: customer_webmin_domains
      changed_when: false

    - name: Disable existing customer Webmin features before global removal
      ansible.builtin.command:
        argv: [virtualmin, disable-feature, --domain, "{{ item }}", --webmin]
      loop: "{{ customer_webmin_domains.stdout_lines }}"

    - name: Read enabled native features
      ansible.builtin.command:
        argv: [virtualmin, list-features, --json]
      register: web_only_features
      changed_when: false

    - name: Enable required web-only features that are currently off
      ansible.builtin.command:
        argv: [virtualmin, set-global-feature, --enable-feature, "{{ item }}", --default-on, "{{ item }}"]
      loop: "{{ ['unix', 'dir', 'web', 'ssl', 'logrotate', 'mysql'] | difference((web_only_features.stdout | from_json).data | selectattr('values.enabled.0', 'equalto', 'Yes') | map(attribute='name') | list) }}"

    - name: Disable customer Webmin globally and in default selections
      ansible.builtin.command:
        argv: [virtualmin, set-global-feature, --disable-feature, webmin]
      when: (web_only_features.stdout | from_json).data | selectattr('name', 'equalto', 'webmin') | selectattr('values.enabled.0', 'equalto', 'Yes') | list | length > 0

    - name: Remove ancillary features from new-domain defaults without deleting existing service data
      ansible.builtin.command:
        argv: [virtualmin, set-global-feature, --default-off, "{{ item.name }}"]
      loop: "{{ (web_only_features.stdout | from_json).data }}"
      when:
        - item.name not in ['unix', 'dir', 'web', 'ssl', 'logrotate', 'mysql', 'webmin']
        - item['values']['default'][0] == 'Yes'

    - name: Install native administrator policy helper
      ansible.builtin.copy:
        src: files/praho-webmin-web-only.pl
        dest: /usr/local/sbin/praho-webmin-web-only
        owner: root
        group: root
        mode: '0700'

    - name: Apply the approved principal and discovery policy
      ansible.builtin.command:
        argv: "{{ ['/usr/bin/perl', '/usr/local/sbin/praho-webmin-web-only', praho_api_user] + node_admin_allowed_cidrs }}"
      register: webmin_policy
      changed_when: "'PRAHO_WEBMIN_CHANGED=0' not in webmin_policy.stdout"

    - name: Inspect the live Webmin UDP discovery socket
      ansible.builtin.command:
        argv: [ss, -H, -uln, 'sport = :10000']
      register: webmin_discovery_socket
      changed_when: false

    - name: Apply Webmin principal and listener changes to the running daemon
      ansible.builtin.systemd_service:
        name: webmin.service
        state: restarted
      when: webmin_policy.changed or webmin_discovery_socket.stdout | length > 0

    - name: Require Webmin to answer after listener convergence
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 10000
        timeout: 30

    # Automatic security updates
    - name: Configure unattended-upgrades
      ansible.builtin.template:
        src: templates/50unattended-upgrades.j2
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        mode: '0644'

    - name: Enable automatic updates
      ansible.builtin.copy:
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: '0644'

    # System hardening
    - name: Configure sysctl security parameters
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_set: yes
        state: present
        reload: yes
      loop:
        - { name: 'net.ipv4.tcp_syncookies', value: '1' }
        - { name: 'net.ipv4.conf.all.rp_filter', value: '1' }
        - { name: 'net.ipv4.conf.default.rp_filter', value: '1' }
        - { name: 'net.ipv4.conf.all.accept_redirects', value: '0' }
        - { name: 'net.ipv4.conf.default.accept_redirects', value: '0' }
        - { name: 'net.ipv4.conf.all.send_redirects', value: '0' }
        - { name: 'net.ipv4.conf.default.send_redirects', value: '0' }
        - { name: 'net.ipv4.conf.all.accept_source_route', value: '0' }
        - { name: 'net.ipv4.conf.default.accept_source_route', value: '0' }
        - { name: 'net.ipv4.icmp_echo_ignore_broadcasts', value: '1' }
        - { name: 'net.ipv4.icmp_ignore_bogus_error_responses', value: '1' }

    # Disable unnecessary services
    - name: Check for unnecessary services
      ansible.builtin.service_facts:

    - name: Disable unnecessary services
      ansible.builtin.service:
        name: "{{ item }}"
        enabled: no
        state: stopped
      loop:
        - avahi-daemon
        - cups
        - rpcbind
      when: item in ansible_facts.services
      ignore_errors: yes

    # Password policies
    - name: Configure password quality
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^# minlen', line: 'minlen = 12' }
        - { regexp: '^# minclass', line: 'minclass = 3' }
        - { regexp: '^# maxrepeat', line: 'maxrepeat = 3' }

    # File permissions
    - name: Secure cron directories
      ansible.builtin.file:
        path: "{{ item }}"
        mode: '0700'
        owner: root
        group: root
      loop:
        - /etc/cron.d
        - /etc/cron.daily
        - /etc/cron.hourly
        - /etc/cron.monthly
        - /etc/cron.weekly
        - /var/spool/cron

    # Web roots: a customer could point their own public_html at another customer's home or /etc and be served
    # through it (Apache is in every customer's group). Why and how: files/praho-home-symlinks.conf.
    - name: Keep customer web roots from linking outside their owner
      ansible.builtin.copy:
        src: files/praho-home-symlinks.conf
        dest: /etc/apache2/conf-available/praho-home-symlinks.conf
        owner: root
        group: root
        mode: '0644'
      register: web_root_guard

    - name: Enable the web root link guard
      ansible.builtin.command: a2enconf praho-home-symlinks
      args:
        creates: /etc/apache2/conf-enabled/praho-home-symlinks.conf
      register: web_root_guard_enabled

    - name: Validate the Apache configuration
      ansible.builtin.command: apache2ctl configtest
      changed_when: false

    # The marker is written only after a reload succeeds, and dropped whenever the file or its enabling changes,
    # so a run that failed after either (or a guard someone disabled and this run re-enabled) still reloads,
    # on this run or the next, instead of leaving the guard on disk but not in force.
    - name: Forget which web root link guard Apache loaded, when this run changed it
      ansible.builtin.file:
        path: /etc/apache2/.praho-web-root-guard-loaded
        state: absent
      when: web_root_guard.changed or web_root_guard_enabled.changed

    - name: Read which web root link guard Apache last loaded
      ansible.builtin.slurp:
        src: /etc/apache2/.praho-web-root-guard-loaded
      register: web_root_guard_loaded
      failed_when: false

    - name: Load the web root link guard into Apache
      ansible.builtin.service:
        name: apache2
        state: reloaded
      when: >-
        web_root_guard_loaded.content is not defined or
        (web_root_guard_loaded.content | b64decode | trim) != web_root_guard.checksum

    - name: Record which web root link guard Apache loaded
      ansible.builtin.copy:
        content: "{{ web_root_guard.checksum }}\n"
        dest: /etc/apache2/.praho-web-root-guard-loaded
        owner: root
        group: root
        mode: '0644'

    - name: Apply all service changes before recording policy completion
      ansible.builtin.meta: flush_handlers

    - name: Create security hardening completion marker
      ansible.builtin.copy:
        content: |
          PRAHO_HARDENED=true
          POLICY=virtualmin-web-only-v1
        dest: /etc/praho-security-hardening
        mode: '0644'

  handlers:
    - name: Restart postfix
      ansible.builtin.service:
        name: postfix
        state: restarted

    - name: Restart mariadb
      ansible.builtin.service:
        name: mariadb
        state: restarted
