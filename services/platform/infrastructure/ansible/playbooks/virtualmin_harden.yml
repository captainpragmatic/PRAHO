# Security Hardening Playbook for Virtualmin Servers
# Run after Virtualmin installation to apply security best practices
---
- name: Harden Virtualmin server security
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Install security packages
      ansible.builtin.apt:
        name:
          - fail2ban
          - ufw
          - unattended-upgrades
          - apt-listchanges
          - logwatch
          - libpam-pwquality
        state: present
        update_cache: yes

    # Fail2ban configuration
    - name: Configure fail2ban jail.local
      ansible.builtin.template:
        src: templates/jail.local.j2
        dest: /etc/fail2ban/jail.local
        mode: '0644'
      notify: Restart fail2ban

    - name: Enable fail2ban
      ansible.builtin.service:
        name: fail2ban
        enabled: yes
        state: started

    # SSH hardening (already done in common_base but reinforcing)
    - name: Harden SSH configuration
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        validate: 'sshd -t -f %s'
      loop:
        - { regexp: '^#?PermitEmptyPasswords', line: 'PermitEmptyPasswords no' }
        - { regexp: '^#?X11Forwarding', line: 'X11Forwarding no' }
        - { regexp: '^#?AllowTcpForwarding', line: 'AllowTcpForwarding no' }
        - { regexp: '^#?AllowAgentForwarding', line: 'AllowAgentForwarding no' }
        - { regexp: '^#?ClientAliveInterval', line: 'ClientAliveInterval 300' }
        - { regexp: '^#?ClientAliveCountMax', line: 'ClientAliveCountMax 2' }
        - { regexp: '^#?Protocol', line: 'Protocol 2' }
        - { regexp: '^#?Ciphers', line: 'Ciphers aes256-gcm@openssh.com,chacha20-poly1305@openssh.com,aes256-ctr' }
        - { regexp: '^#?MACs', line: 'MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com' }
      notify: Restart sshd

    # UFW firewall (backup to cloud firewall)
    #
    # SSH and Webmin (firewall_admin_tcp_ports) open only to the node admin
    # allowlist (ADR-0060). The play fails closed: no allowlist, no firewall
    # change at all, rather than opening them to everyone. It also refuses when
    # the address this very connection comes from is not on the list, so a
    # deploy can never lock Platform out, and it adds the allow rules before it
    # removes the old any-source ones or sets the deny default.
    - name: Refuse an empty node admin allowlist
      ansible.builtin.assert:
        that:
          - node_admin_allowed_cidrs is defined
          - node_admin_allowed_cidrs | length > 0
        fail_msg: >-
          infrastructure.node_admin_allowed_cidrs is empty; set Platform's egress
          addresses and the admin networks before hardening a node.

    - name: Require this connection's source in the allowlist
      ansible.builtin.command:
        argv: >-
          {{ ['python3', '-c', allowlist_membership_check,
              (ansible_env.SSH_CLIENT | default('')).split(' ') | first] + node_admin_allowed_cidrs }}
      vars:
        allowlist_membership_check: |
          import ipaddress, sys
          source, networks = sys.argv[1], sys.argv[2:]
          address = ipaddress.ip_address(source)
          if not any(address in ipaddress.ip_network(net) for net in networks):
              sys.exit(f"this connection comes from {source}, outside {networks}; refusing to firewall it out")
      changed_when: false

    - name: Allow SSH and Webmin from the node admin allowlist
      community.general.ufw:
        rule: allow
        port: "{{ item.0 }}"
        proto: tcp
        from_ip: "{{ item.1 }}"
      loop: "{{ firewall_admin_tcp_ports | product(node_admin_allowed_cidrs) | list }}"
      notify: Enable ufw

    # Earlier deploys opened these ports to everyone.
    - name: Remove any-source SSH and Webmin rules
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
        delete: true
      loop: "{{ firewall_admin_tcp_ports }}"

    - name: Configure UFW defaults
      community.general.ufw:
        default: deny
        direction: incoming
      notify: Enable ufw

    - name: Allow UFW outgoing by default
      community.general.ufw:
        default: allow
        direction: outgoing
      notify: Enable ufw

    - name: Allow TCP ports through UFW
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ firewall_allowed_tcp_ports }}"
      notify: Enable ufw

    - name: Allow UDP ports through UFW
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: udp
      loop: "{{ firewall_allowed_udp_ports }}"
      notify: Enable ufw

    - name: Allow FTP passive range through UFW
      community.general.ufw:
        rule: allow
        port: "40000:40100"
        proto: tcp
      notify: Enable ufw

    # A task, not only the handler: a handler fires only when a rule changed,
    # so a firewall someone switched off with every rule already in place
    # would otherwise stay off.
    - name: Enable UFW
      community.general.ufw:
        state: enabled

    # Automatic security updates
    - name: Configure unattended-upgrades
      ansible.builtin.template:
        src: templates/50unattended-upgrades.j2
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        mode: '0644'

    - name: Enable automatic updates
      ansible.builtin.copy:
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: '0644'

    # System hardening
    - name: Configure sysctl security parameters
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_set: yes
        state: present
        reload: yes
      loop:
        - { name: 'net.ipv4.tcp_syncookies', value: '1' }
        - { name: 'net.ipv4.conf.all.rp_filter', value: '1' }
        - { name: 'net.ipv4.conf.default.rp_filter', value: '1' }
        - { name: 'net.ipv4.conf.all.accept_redirects', value: '0' }
        - { name: 'net.ipv4.conf.default.accept_redirects', value: '0' }
        - { name: 'net.ipv4.conf.all.send_redirects', value: '0' }
        - { name: 'net.ipv4.conf.default.send_redirects', value: '0' }
        - { name: 'net.ipv4.conf.all.accept_source_route', value: '0' }
        - { name: 'net.ipv4.conf.default.accept_source_route', value: '0' }
        - { name: 'net.ipv4.icmp_echo_ignore_broadcasts', value: '1' }
        - { name: 'net.ipv4.icmp_ignore_bogus_error_responses', value: '1' }

    # Disable unnecessary services
    - name: Check for unnecessary services
      ansible.builtin.service_facts:

    - name: Disable unnecessary services
      ansible.builtin.service:
        name: "{{ item }}"
        enabled: no
        state: stopped
      loop:
        - avahi-daemon
        - cups
        - rpcbind
      when: item in ansible_facts.services
      ignore_errors: yes

    # Password policies
    - name: Configure password quality
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^# minlen', line: 'minlen = 12' }
        - { regexp: '^# minclass', line: 'minclass = 3' }
        - { regexp: '^# maxrepeat', line: 'maxrepeat = 3' }

    # File permissions
    - name: Secure cron directories
      ansible.builtin.file:
        path: "{{ item }}"
        mode: '0700'
        owner: root
        group: root
      loop:
        - /etc/cron.d
        - /etc/cron.daily
        - /etc/cron.hourly
        - /etc/cron.monthly
        - /etc/cron.weekly
        - /var/spool/cron

    # Web roots: a customer could point their own public_html at another customer's home or /etc and be served
    # through it (Apache is in every customer's group). Why and how: files/praho-home-symlinks.conf.
    - name: Keep customer web roots from linking outside their owner
      ansible.builtin.copy:
        src: files/praho-home-symlinks.conf
        dest: /etc/apache2/conf-available/praho-home-symlinks.conf
        owner: root
        group: root
        mode: '0644'
      register: web_root_guard

    - name: Enable the web root link guard
      ansible.builtin.command: a2enconf praho-home-symlinks
      args:
        creates: /etc/apache2/conf-enabled/praho-home-symlinks.conf
      register: web_root_guard_enabled

    - name: Validate the Apache configuration
      ansible.builtin.command: apache2ctl configtest
      changed_when: false

    # The marker is written only after a reload succeeds, and dropped whenever the file or its enabling changes,
    # so a run that failed after either (or a guard someone disabled and this run re-enabled) still reloads,
    # on this run or the next, instead of leaving the guard on disk but not in force.
    - name: Forget which web root link guard Apache loaded, when this run changed it
      ansible.builtin.file:
        path: /etc/apache2/.praho-web-root-guard-loaded
        state: absent
      when: web_root_guard.changed or web_root_guard_enabled.changed

    - name: Read which web root link guard Apache last loaded
      ansible.builtin.slurp:
        src: /etc/apache2/.praho-web-root-guard-loaded
      register: web_root_guard_loaded
      failed_when: false

    - name: Load the web root link guard into Apache
      ansible.builtin.service:
        name: apache2
        state: reloaded
      when: >-
        web_root_guard_loaded.content is not defined or
        (web_root_guard_loaded.content | b64decode | trim) != web_root_guard.checksum

    - name: Record which web root link guard Apache loaded
      ansible.builtin.copy:
        content: "{{ web_root_guard.checksum }}\n"
        dest: /etc/apache2/.praho-web-root-guard-loaded
        owner: root
        group: root
        mode: '0644'

    - name: Create security hardening completion marker
      ansible.builtin.copy:
        content: |
          PRAHO_HARDENED=true
          HARDENING_DATE={{ ansible_date_time.iso8601 }}
        dest: /etc/praho-security-hardening
        mode: '0644'

  handlers:
    - name: Restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted

    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted

    - name: Enable ufw
      community.general.ufw:
        state: enabled
