# Backup Configuration Playbook for Virtualmin
# Creates the node's nightly full backup as a real Virtualmin scheduled backup
# (and, for S3 storage, syncs the local archives offsite).
#
# Virtualmin 8 reads scheduled backups from /etc/webmin/virtual-server/backups/
# and runs them from Webmin cron. It never reads the `sched` file earlier
# versions of this play wrote, and the legacy `backup_dest` config key only
# surfaced as a disabled schedule that produced an empty archive
# (docs/domain/virtualmin-incremental-contract.md, Q4). The schedule is now
# created with `virtualmin create-scheduled-backup`, which the lab proved.
---
- name: Configure Virtualmin backups
  hosts: all
  become: true
  gather_facts: true

  vars:
    backup_local_path: "/var/backups/virtualmin"
    backup_retention_days: 7
    backup_schedule: "0 2 * * *"  # 2 AM daily
    # One dated directory per run, one archive per server. The destination is
    # also how this play recognises its own schedule (create-scheduled-backup
    # has no description field).
    backup_schedule_dest: "{{ backup_local_path }}/%Y-%m-%d"

  tasks:
    - name: Create backup directory
      ansible.builtin.file:
        path: "{{ backup_local_path }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    # Upgrade path: remove what earlier versions of this play wrote. Virtualmin
    # ignores `sched`; `backup_dest` and its siblings define the disabled legacy
    # schedule 1.
    - name: Remove the unread schedule file
      ansible.builtin.file:
        path: /etc/webmin/virtual-server/sched
        state: absent

    - name: Remove the legacy single-schedule config keys
      ansible.builtin.lineinfile:
        path: /etc/webmin/virtual-server/config
        regexp: "{{ item }}"
        state: absent
      loop:
        - '^backup_dest='
        - '^backup_increment='
        - '^backup_onebyone='
        - '^backup_compression='
        - '^backup_strftime='
        - '^backup_virtualmin='

    - name: Read the scheduled backups
      ansible.builtin.command:
        argv: [virtualmin, list-scheduled-backups, --json]
      register: scheduled_backups_before
      changed_when: false

    - name: Find this play's schedules
      ansible.builtin.set_fact:
        praho_backup_schedule_ids: >-
          {{ (scheduled_backups_before.stdout | from_json).data
             | selectattr('values.destination.0', 'equalto', backup_schedule_dest)
             | map(attribute='name') | list }}

    # Replace rather than edit: create-scheduled-backup sets every field, so a
    # changed variable (schedule, retention) always reaches the node.
    - name: Delete this play's previous schedule
      ansible.builtin.command:
        argv: [virtualmin, delete-scheduled-backup, --id, "{{ item }}"]
      loop: "{{ praho_backup_schedule_ids }}"

    # Full backups of every server, never differential: --no-differential leaves
    # each domain's differential base untouched, so the nightly backup never
    # resets a base PRAHO relies on.
    - name: Create the nightly full backup schedule
      ansible.builtin.command:
        argv:
          - virtualmin
          - create-scheduled-backup
          - --all-domains
          - --all-features
          - --all-virtualmin
          - --dest
          - "{{ backup_schedule_dest }}"
          - --strftime
          - --newformat
          - --mkdir
          - --no-differential
          - --schedule
          - "{{ backup_schedule }}"
          - --purge
          - "{{ backup_retention_days }}"
          - --email
          - "{{ automatic_updates_mail_to | default('root') }}"
          - --email-errors
      when: backup_enabled

    - name: Read the scheduled backups again
      ansible.builtin.command:
        argv: [virtualmin, list-scheduled-backups, --json]
      register: scheduled_backups_after
      changed_when: false

    - name: Require exactly the configured schedule
      vars:
        praho_schedules: >-
          {{ (scheduled_backups_after.stdout | from_json).data
             | selectattr('values.destination.0', 'equalto', backup_schedule_dest) | list }}
      ansible.builtin.assert:
        that:
          - praho_schedules | length == (1 if backup_enabled else 0)
          - (not backup_enabled) or praho_schedules[0]['values']['enabled'][0] == 'Yes'
          - (not backup_enabled) or praho_schedules[0]['values']['differential'][0] == 'No'
        fail_msg: "Scheduled backups after configuration: {{ praho_schedules }}"

    # S3 offsite copy of the local archives
    - name: Install AWS CLI for S3 backups
      ansible.builtin.apt:
        name: awscli
        state: present
      when: backup_enabled and backup_storage == 's3'

    - name: Create AWS credentials directory
      ansible.builtin.file:
        path: /root/.aws
        state: directory
        owner: root
        group: root
        mode: '0700'
      when: backup_enabled and backup_storage == 's3'

    - name: Create S3 backup sync script
      ansible.builtin.template:
        src: templates/s3_backup_sync.sh.j2
        dest: /usr/local/bin/praho-s3-backup-sync.sh
        mode: '0755'
      when: backup_enabled and backup_storage == 's3'

    - name: Schedule S3 backup sync cron job
      ansible.builtin.cron:
        name: "PRAHO S3 backup sync"
        minute: "30"
        hour: "3"
        job: "/usr/local/bin/praho-s3-backup-sync.sh >> /var/log/praho-s3-backup.log 2>&1"
      when: backup_enabled and backup_storage == 's3'

    # Cleanup script for local backups
    - name: Create backup cleanup script
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          # PRAHO Backup Cleanup Script
          # Removes backups older than {{ backup_retention_days }} days, with their
          # .info/.dom sidecars (the .dom files hold database passwords).

          BACKUP_DIR="{{ backup_local_path }}"
          RETENTION_DAYS={{ backup_retention_days }}

          if [ -d "$BACKUP_DIR" ]; then
              find "$BACKUP_DIR" -type f \( -name "*.tar.gz" -o -name "*.tar.gz.info" -o -name "*.tar.gz.dom" \) \
                  -mtime +"$RETENTION_DAYS" -delete
              find "$BACKUP_DIR" -mindepth 1 -type d -empty -delete
              echo "Cleanup completed: $(date)"
          fi
        dest: /usr/local/bin/praho-backup-cleanup.sh
        mode: '0755'

    - name: Schedule backup cleanup cron job
      ansible.builtin.cron:
        name: "PRAHO backup cleanup"
        minute: "30"
        hour: "4"
        job: "/usr/local/bin/praho-backup-cleanup.sh >> /var/log/praho-backup-cleanup.log 2>&1"

    - name: Create backup configuration marker
      ansible.builtin.copy:
        content: |
          PRAHO_BACKUP_CONFIGURED=true
          BACKUP_STORAGE={{ backup_storage }}
          BACKUP_PATH={{ backup_schedule_dest }}
          BACKUP_RETENTION_DAYS={{ backup_retention_days }}
          BACKUP_SCHEDULE={{ backup_schedule }}
          CONFIG_DATE={{ ansible_date_time.iso8601 }}
        dest: /etc/praho-backup-config
        mode: '0644'
