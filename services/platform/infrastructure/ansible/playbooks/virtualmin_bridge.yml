---
# The source node's reverse proxy to the target during a cutover (ADR-0061 Phase 2, contract step 6).
#
#   bridge_action=install   write the vhost in conf-enabled (before sites-enabled), reload, verify
#   bridge_action=verify    answer the domain locally with a status below 400
#   bridge_action=remove    delete the vhost and reload; the disabled Virtualmin vhost answers again
#
# The source terminates TLS with the domain's existing certificate and proxies over HTTP inside the
# provider's network, preserving the Host header. Proxying HTTPS by address would select the target's
# default vhost on SNI, not the customer's site; HTTP plus Host is deterministic.
- name: Install, verify or remove a cutover bridge
  hosts: all
  gather_facts: false
  become: false
  vars:
    bridge_target_port: 80
    bridge_conf: "/etc/apache2/conf-enabled/praho-bridge-{{ bridge_domain }}.conf"
  tasks:
    - name: Validate bridge inputs
      ansible.builtin.assert:
        that:
          - bridge_action in ['install', 'verify', 'remove']
          - bridge_domain is match('^[A-Za-z0-9]([A-Za-z0-9.-]{0,251}[A-Za-z0-9])?$')
          - bridge_domain_id is match('^[0-9]{1,30}$')
          - bridge_target_ipv4 is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
          - bridge_target_port | string is match('^[0-9]{1,5}$')
          - bridge_certificate is match('^/[A-Za-z0-9._/-]+$')
          - bridge_certificate_key is match('^/[A-Za-z0-9._/-]+$')

    - name: Install the bridge vhost
      when: bridge_action == 'install'
      block:
        - name: Write the bridge vhost before the site vhosts
          ansible.builtin.template:
            src: templates/praho_bridge.conf.j2
            dest: "{{ bridge_conf }}"
            owner: root
            group: root
            mode: "0644"
          notify: Reload Apache

        - name: Apply the vhost change
          ansible.builtin.meta: flush_handlers

    - name: Verify Apache's configuration
      when: bridge_action in ['install', 'verify']
      ansible.builtin.command:
        argv: [apache2ctl, configtest]
      changed_when: false

    - name: Verify the bridge answers the domain
      when: bridge_action in ['install', 'verify']
      ansible.builtin.command:
        argv:
          - curl
          - -sS
          - -k
          - -o
          - /dev/null
          - -w
          - "%{http_code}"
          - --resolve
          - "{{ bridge_domain }}:443:127.0.0.1"
          - "https://{{ bridge_domain }}/"
      register: bridge_answer
      changed_when: false
      failed_when: bridge_answer.stdout | int >= 400

    - name: Remove the bridge vhost
      when: bridge_action == 'remove'
      block:
        - name: Delete the bridge vhost
          ansible.builtin.file:
            path: "{{ bridge_conf }}"
            state: absent
          notify: Reload Apache

        - name: Apply the vhost change
          ansible.builtin.meta: flush_handlers

        - name: Verify Apache's configuration
          ansible.builtin.command:
            argv: [apache2ctl, configtest]
          changed_when: false

  handlers:
    - name: Reload Apache
      ansible.builtin.command:
        argv: [apache2ctl, graceful]
      changed_when: true
