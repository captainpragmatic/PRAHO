---
# Install an account name's certificate into its Virtualmin sub-server (ADR-0061 P1.10).
#
# The key and the certificate arrive as variables in the 0600 extra-vars file the controller writes,
# never on a command line. They are written into a root-only directory on /run (a memory filesystem, so
# the files this play makes never reach the node's disk), handed to `virtualmin install-cert` by path,
# and removed in the same play, whether or not the install worked. Ansible itself stages each task's
# arguments, the key's content included, under the controller's and the connecting user's remote
# temporary directories for the length of that task, and removes them after it.
#
# The play ends by printing the SHA-256 fingerprint of the certificate Virtualmin now serves for the
# name (INSTALLED_FINGERPRINT=...). PRAHO records the install only when it is the certificate it sent.
- name: Install an account name's certificate on a Virtualmin node
  hosts: all
  gather_facts: false
  become: false
  tasks:
    - name: Validate single-host certificate inputs
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - account_name is match('^[a-z0-9]{8}\.[a-z0-9]([a-z0-9.-]*[a-z0-9])?$')
          - certificate_pem is search('-----BEGIN CERTIFICATE-----')
          - private_key_pem is search('-----BEGIN [A-Z ]*PRIVATE KEY-----')
          - chain_pem is defined
        fail_msg: "Invalid certificate install inputs (values withheld)"
      no_log: true

    - name: Install the certificate and always remove the key material
      block:
        - name: Create a root-only temporary directory
          ansible.builtin.tempfile:
            state: directory
            path: /run
            prefix: praho-cert-
          register: cert_dir

        - name: Read the temporary directory's ownership and mode
          ansible.builtin.stat:
            path: "{{ cert_dir.path }}"
          register: cert_dir_stat

        - name: Require a private temporary directory
          ansible.builtin.assert:
            that:
              - cert_dir_stat.stat.mode == '0700'
              - cert_dir_stat.stat.uid == 0

        - name: Write the private key
          ansible.builtin.copy:
            content: "{{ private_key_pem }}"
            dest: "{{ cert_dir.path }}/key.pem"
            owner: root
            group: root
            mode: '0600'
          no_log: true

        - name: Write the certificate
          ansible.builtin.copy:
            content: "{{ certificate_pem }}"
            dest: "{{ cert_dir.path }}/cert.pem"
            owner: root
            group: root
            mode: '0600'
          no_log: true

        - name: Write the intermediate chain
          ansible.builtin.copy:
            content: "{{ chain_pem }}"
            dest: "{{ cert_dir.path }}/chain.pem"
            owner: root
            group: root
            mode: '0600'
          when: chain_pem | length > 0
          no_log: true

        - name: Install the certificate into the account name's virtual server
          ansible.builtin.command:
            argv: >-
              {{ ['virtualmin', 'install-cert', '--domain', account_name,
                  '--cert', cert_dir.path ~ '/cert.pem', '--key', cert_dir.path ~ '/key.pem']
                 + (['--ca', cert_dir.path ~ '/chain.pem'] if chain_pem | length > 0 else []) }}
          changed_when: true

        - name: Read the fingerprint of the certificate the account name now serves
          ansible.builtin.shell: |
            set -euo pipefail
            cert_file=$(virtualmin list-domains --domain "$ACCOUNT_NAME" --multiline \
              | sed -n 's/^ *SSL cert file: //p' | head -n 1)
            test -n "$cert_file"
            openssl x509 -in "$cert_file" -noout -fingerprint -sha256
          args:
            executable: /bin/bash
          environment:
            ACCOUNT_NAME: "{{ account_name }}"
          register: served_certificate
          changed_when: false

        - name: Report the fingerprint PRAHO checks before recording the install
          ansible.builtin.debug:
            msg: "INSTALLED_FINGERPRINT={{ served_certificate.stdout | regex_replace('^.*=', '') }}"

      always:
        - name: Remove the temporary directory and everything in it
          ansible.builtin.file:
            path: "{{ cert_dir.path }}"
            state: absent
          when: cert_dir is defined and cert_dir.path is defined
