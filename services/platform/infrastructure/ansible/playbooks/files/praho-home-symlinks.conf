# Managed by PRAHO (virtualmin_harden.yml; the Virtualmin lab installs the same file).
# Debian's apache2.conf gives <Directory /> FollowSymLinks, and each vhost's +SymLinksIfOwnerMatch covers only
# what is inside public_html. Here, under the home base, a link must belong to the owner of what it points at:
# a customer's own link (an account name's sub-server) serves, a link into another home or the system does not.
<Directory /home>
    Options -FollowSymLinks +SymLinksIfOwnerMatch
    AllowOverride None
</Directory>
