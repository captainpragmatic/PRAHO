# PRAHO's default site (ADR-0061 P1.16). A request for a name no virtual server claims would get the
# first virtual host Apache loads, a customer's site or an account name's. This one is in conf-enabled,
# which Debian's apache2.conf includes before sites-enabled, so it is first for *:80 and *:443 whatever
# any domain is called, and it answers 404 with no content.
<VirtualHost *:80>
    ServerName praho-default.invalid
    DocumentRoot /var/www/praho-default
    RedirectMatch 404 ^
</VirtualHost>
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName praho-default.invalid
    DocumentRoot /var/www/praho-default
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key
    RedirectMatch 404 ^
</VirtualHost>
</IfModule>
