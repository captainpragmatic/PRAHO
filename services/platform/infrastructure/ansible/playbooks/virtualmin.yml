# Virtualmin GPL Installation Playbook
# Installs and configures Virtualmin on a prepared server
---
- name: Install Virtualmin GPL
  hosts: all
  become: true
  gather_facts: true

  vars:
    # Recorded in /etc/praho-virtualmin-install only: the installer takes the
    # current packages of its major line. These are the versions the lab
    # (deploy/virtualmin-lab) proves PRAHO against.
    virtualmin_version: "8.3.0"
    webmin_version: "2.670"
    # The Virtualmin 8 installer. The old software.virtualmin.com/gpl/scripts URL
    # serves installer 7.5.2, which sets up the Virtualmin 7 repository.
    virtualmin_install_script_url: "https://raw.githubusercontent.com/virtualmin/virtualmin-install/232a23d6aebf3ff9ad43d4d2823773ad14770509/virtualmin-install.sh"
    virtualmin_install_script_checksum: "sha256:996d32a9a2b7e64cc9dc4af7b6d001297fdee867ce34dffae31a7197f230d5ae"
    # This installer calls set_hosts_entry, absent from the rolling slib download.
    # Resolve its supported local-library path against an equally qualified revision.
    virtualmin_install_library_url: "https://raw.githubusercontent.com/virtualmin/slib/d225f66ee9df1f29865a8b117f968cdf44672380/slib.sh"
    virtualmin_install_library_checksum: "sha256:a6894f5b83d2d4776f0f7103dd984dbf34e823902d94574c65e52b59a9f77941"
    # Features every PRAHO-provisioned server gets; all exist on a --minimal node.
    virtualmin_required_features:
      - unix
      - dir
      - web
      - ssl
      - logrotate
      - mysql

  tasks:
    # The installer and Let's Encrypt need the node's fully qualified name, which the
    # short inventory_hostname is not. PRAHO passes it as node_fqdn (-e from a vars file).
    - name: Refuse a missing node FQDN
      ansible.builtin.assert:
        that:
          - node_fqdn is defined
          - node_fqdn | length > 0
        fail_msg: "node_fqdn is required: pass the node's fully qualified domain name"

    - name: Require the managed Ubuntu and PHP baseline
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version == '26.04'
          - php_default_version == '8.5'
          - deployment_id is defined
        fail_msg: Managed hosting installation requires Ubuntu 26.04 and distribution PHP 8.5.

    - name: Check if Virtualmin is already installed
      ansible.builtin.stat:
        path: /usr/share/webmin/virtual-server
      register: virtualmin_installed

    - name: Require owned generated-node admission before first installation
      ansible.builtin.assert:
        that:
          - praho_generated_node | default(false) | bool
          - deployment_id | string is match('^[1-9][0-9]{0,18}$')
      when: not virtualmin_installed.stat.exists

    - name: Refuse occupied or ambiguous first-install nodes
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import pwd
            import sys
            from pathlib import Path
            # The root argument is for tests; on the node it is /.
            root = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('/')
            def own_tunnel_home(entry):
                # The ssh-hardening role creates this system account before installation (ADR-0060).
                # Keep in step with tenant_homes() in praho_hosting_node.py.
                if entry.name != 'praho-webmin-tunnel' or entry.is_symlink() or not entry.is_dir():
                    return False
                try:
                    account = pwd.getpwnam('praho-webmin-tunnel')
                except KeyError:
                    return False
                return (
                    account.pw_dir == '/home/praho-webmin-tunnel'
                    and account.pw_shell == '/usr/sbin/nologin'
                    and entry.stat().st_uid == account.pw_uid
                )
            def present(path):
                if not path.is_dir():
                    return []
                return sorted(entry.name for entry in path.iterdir() if not own_tunnel_home(entry))[:10]
            assert not (root / 'etc/praho-virtualmin-install').exists(), 'Prior installation requires explicit preparation'
            for path, refusal in (
                (root / 'home', 'Tenant or unknown homes exist'),
                (root / 'etc/webmin/virtual-server/domains', 'Native domain inventory exists'),
                (root / 'var/lib/mysql', 'Database storage exists'),
            ):
                found = present(path)
                assert not found, refusal + ': ' + ', '.join(found)
      changed_when: false
      when: not virtualmin_installed.stat.exists

    - name: Download Virtualmin install script
      ansible.builtin.get_url:
        url: "{{ virtualmin_install_script_url }}"
        dest: /root/virtualmin-install.sh
        mode: '0755'
        checksum: "{{ virtualmin_install_script_checksum }}"
      when: not virtualmin_installed.stat.exists

    - name: Read the qualified installer before preserving the host firewall
      ansible.builtin.slurp:
        src: /root/virtualmin-install.sh
      register: qualified_installer
      when: not virtualmin_installed.stat.exists

    - name: Require the exact reviewed firewall purge before patching
      ansible.builtin.assert:
        that:
          - (qualified_installer.content | b64decode | regex_findall('(?m)^  /usr/bin/apt-get --quiet --assume-yes purge ufw firewalld.*$')) | length == 1
      when: not virtualmin_installed.stat.exists

    - name: Preserve the already verified host firewall during installation
      ansible.builtin.replace:
        path: /root/virtualmin-install.sh
        regexp: '(?m)^  /usr/bin/apt-get --quiet --assume-yes purge ufw firewalld.*$'
        replace: '  # PRAHO: retain the verified host firewall throughout installation.'
      when: not virtualmin_installed.stat.exists

    - name: Download the matching qualified installer utility library
      ansible.builtin.get_url:
        url: "{{ virtualmin_install_library_url }}"
        dest: /root/slib.sh
        mode: '0600'
        checksum: "{{ virtualmin_install_library_checksum }}"
      when: not virtualmin_installed.stat.exists

    - name: Run Virtualmin installation
      ansible.builtin.command: >
        /root/virtualmin-install.sh
        --hostname {{ node_fqdn }}
        --minimal
        --exclude Nftables,Firewalld,Fail2ban,Fail2banFirewalld
        --force
      args:
        creates: /usr/share/webmin/virtual-server
        chdir: /root
      register: virtualmin_install
      # Fire-and-forget (poll: 0): the virtualmin installer runs ~40 min and restarts
      # services/networking, dropping the SSH connection. With a non-zero poll ansible would
      # both block on (and auto-clean) the async job, making the async_status wait below fail
      # with "could not find job". poll: 0 + async_status (each poll a fresh connection) is the
      # robust pattern for a long, connection-disrupting install.
      async: 2400  # 40 minutes timeout
      poll: 0
      when: not virtualmin_installed.stat.exists

    - name: Wait for Virtualmin installation to complete
      ansible.builtin.async_status:
        jid: "{{ virtualmin_install.ansible_job_id }}"
      register: job_result
      until: job_result.finished
      retries: 80
      delay: 30
      # VERIFY the install actually succeeded. Without this the play marches on to
      # create-admin even when virtualmin-install.sh fast-fails, producing the opaque
      # "[Errno 2] No such file or directory: virtualmin" far from the real cause. On
      # failure, surface the installer's own stdout/stderr tail so the reason is visible.
      # The async_status result carries the installer's own rc/stdout/stderr, so this
      # failure surfaces the real reason (visible in the captured play output) instead of
      # the opaque "virtualmin: No such file or directory" three tasks later.
      failed_when:
        - job_result.finished
        - (job_result.rc | default(1)) != 0
      when: virtualmin_install is defined and virtualmin_install.ansible_job_id is defined

    - name: Confirm Virtualmin actually installed
      # The installer can exit 0 without installing (e.g. a soft precheck bail-out), so verify
      # the real artifact exists rather than trusting rc alone — otherwise create-admin fails
      # later with the opaque "virtualmin: No such file or directory".
      ansible.builtin.stat:
        path: /usr/share/webmin/virtual-server
      register: vmin_installed_check

    - name: Install distribution PHP and classic quota tools
      ansible.builtin.apt:
        name: [php8.5-fpm, php8.5-cli, php8.5-mysql, quota]
        state: present

    - name: Install protected hosting policy adapters
      ansible.builtin.import_tasks: virtualmin_hosting_tasks.yml

    - name: Create database quota capability override directory
      ansible.builtin.file:
        path: /etc/systemd/system/mariadb.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: not virtualmin_installed.stat.exists

    - name: Exclude the database writer quota bypass capability
      ansible.builtin.copy:
        content: "[Service]\nCapabilityBoundingSet=~CAP_SYS_RESOURCE\n"
        dest: /etc/systemd/system/mariadb.service.d/praho-quotas.conf
        owner: root
        group: root
        mode: '0644'
      when: not virtualmin_installed.stat.exists

    - name: Apply database quota capability restrictions on the empty new node
      ansible.builtin.systemd:
        name: mariadb
        daemon_reload: true
        state: restarted
      when: not virtualmin_installed.stat.exists

    - name: Record ownership of an empty first-install attempt
      ansible.builtin.copy:
        content: "{{ {'deployment': deployment_id | string, 'owned_empty_first_install': true} | to_json }}"
        dest: /var/lib/praho/hosting/new-install.json
        owner: root
        group: root
        mode: '0600'
        force: false
      when: not virtualmin_installed.stat.exists

    - name: Prepare classic quotas only for the owned empty first install
      ansible.builtin.command:
        argv: [/usr/bin/python3, /usr/local/lib/praho/praho_hosting_node.py, bootstrap]
        stdin: "{{ {'identity': '0' * 64, 'deployment': deployment_id | string} | to_json }}"
      when: not virtualmin_installed.stat.exists

    # Native warning ownership is preserved here. Explicit Platform handover
    # happens after registration and only when the real notifier is available.

    - name: Preserve hard UID and group quotas and tenant database group ownership
      ansible.builtin.lineinfile:
        path: /etc/webmin/virtual-server/config
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
      loop:
        - {key: hard_quotas, value: '1'}
        - {key: mysql_chgrp, value: '1'}
        - {key: bw_disable, value: '0'}
        - {key: bw_enable, value: '0'}
      when: not virtualmin_installed.stat.exists

    - name: Fail with installer output if Virtualmin did not install
      ansible.builtin.fail:
        msg: >-
          Virtualmin did NOT install (/usr/share/webmin/virtual-server missing after the installer
          returned rc={{ job_result.rc | default('n/a') }}).
          STDOUT_TAIL:: {{ (job_result.stdout | default(''))[-1800:] }}
          STDERR_TAIL:: {{ (job_result.stderr | default(''))[-1000:] }}
      when: not vmin_installed_check.stat.exists

    - name: Remove install script
      ansible.builtin.file:
        path: /root/virtualmin-install.sh
        state: absent

    # Only keys Virtualmin 8.3 reads from its module config are written here.
    # This play used to also write php_fpm=1, php_vers, web_port=10000, ssl=1 and
    # autoquota=1, and a key=value "domain-template". Checked in the lab:
    #   - web_port is the Apache port of NEW virtual servers; 10000 is Webmin's,
    #     so every create-domain failed ("port 10000 are being used by Webmin");
    #   - php_fpm holds FPM pool directives, not a switch, and ssl=3 is the
    #     shipped mode;
    #   - php_vers and autoquota are not read at all;
    #   - domain-template is the body of the new-server email, not domain defaults.
    - name: Configure the Virtualmin default addresses
      ansible.builtin.lineinfile:
        path: /etc/webmin/virtual-server/config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        create: false
      loop:
        - { regexp: '^defip=', line: 'defip={{ ansible_default_ipv4.address }}' }
        - { regexp: '^defip6=', line: 'defip6={{ ansible_default_ipv6.address | default("") }}' }
      notify: Restart webmin

    - name: Find the PHP-FPM configuration
      ansible.builtin.stat:
        path: "/etc/php/{{ php_default_version }}/fpm/php.ini"
      register: php_fpm_ini

    - name: Require the managed PHP-FPM configuration
      ansible.builtin.assert:
        that: php_fpm_ini.stat.exists
        fail_msg: The managed PHP-FPM baseline was not installed.

    - name: Set PHP defaults
      ansible.builtin.lineinfile:
        path: "/etc/php/{{ php_default_version }}/fpm/php.ini"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^memory_limit', line: 'memory_limit = {{ php_memory_limit }}' }
        - { regexp: '^upload_max_filesize', line: 'upload_max_filesize = {{ php_upload_max_filesize }}' }
        - { regexp: '^post_max_size', line: 'post_max_size = {{ php_post_max_size }}' }
        - { regexp: '^max_execution_time', line: 'max_execution_time = {{ php_max_execution_time }}' }
        - { regexp: '^max_input_time', line: 'max_input_time = {{ php_max_input_time }}' }
      when: php_fpm_ini.stat.exists
      notify: Restart php-fpm

    - name: Enable required Apache modules
      community.general.apache2_module:
        name: "{{ item }}"
        state: present
      loop: "{{ webserver_modules }}"
      notify: Restart apache

    # A request for a name no virtual server claims would get the first site Apache loads, a
    # customer's or an account name's (ADR-0061 P1.16). PRAHO's default site loads first and
    # answers 404 with no content on 80 and 443.
    - name: Install the self-signed certificate the default site answers 443 with
      ansible.builtin.apt:
        name: ssl-cert
        state: present

    - name: Create the default site's empty document root
      ansible.builtin.file:
        path: /var/www/praho-default
        state: directory
        owner: root
        group: root
        mode: '0755'

    # In conf-enabled, which apache2.conf includes before sites-enabled: a site file would sort after
    # a domain such as 0.example.com (lab-proven).
    - name: Install the PRAHO default site
      ansible.builtin.copy:
        src: files/praho-default-site.conf
        dest: /etc/apache2/conf-available/praho-default-site.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart apache

    - name: Enable the PRAHO default site
      ansible.builtin.command: a2enconf praho-default-site
      args:
        creates: /etc/apache2/conf-enabled/praho-default-site.conf
      notify: Restart apache

    - name: Validate the Apache configuration with the default site
      ansible.builtin.command: apache2ctl configtest
      changed_when: false

# Let's Encrypt issuance/install (#436). Failures stay non-fatal until the
    # staging drill proves the real CLI contract — but they are VISIBLE
    # (LETSENCRYPT_FAILED banners below), and the idempotency marker is only
    # written by US after BOTH steps succeeded, so a failed attempt retries on
    # the next run while a success stops re-requesting (LE rate-limit safety).
    - name: Check for the Webmin Let's Encrypt installer
      ansible.builtin.stat:
        path: /usr/share/webmin/webmin/letsencrypt.cgi
      register: letsencrypt_cgi

    - name: Generate Let's Encrypt certificate for Virtualmin
      ansible.builtin.command: >
        virtualmin generate-letsencrypt-cert
        --host {{ node_fqdn }}
        --web
        --renew
      args:
        creates: /etc/webmin/letsencrypt-cert-{{ node_fqdn }}
      register: letsencrypt_result
      # Fatal ONLY when letsencrypt_fatal is explicitly passed true (default false ==
      # today's non-fatal behavior, byte-for-byte). The #436 staging drill flips this on
      # a disposable node (`-e letsencrypt_fatal=true`) once the real CLI contract is proven;
      # until then a node must still reach `active` even if this step fails. Do NOT enable
      # by default and do NOT remove this until the drill validates the command flags.
      failed_when: letsencrypt_result.rc != 0 and (letsencrypt_fatal | default(false) | bool)
      changed_when: letsencrypt_result.rc == 0

    - name: Report Let's Encrypt issuance failure
      ansible.builtin.debug:
        msg: "LETSENCRYPT_FAILED step=generate rc={{ letsencrypt_result.rc }} stderr={{ (letsencrypt_result.stderr | default(''))[-400:] }}"
      when:
        - letsencrypt_result.rc is defined
        - letsencrypt_result.rc != 0

    - name: Report missing Let's Encrypt installer
      ansible.builtin.debug:
        msg: "LETSENCRYPT_FAILED step=install rc=127 stderr=letsencrypt.cgi not found at /usr/share/webmin/webmin/"
      when:
        - letsencrypt_result.changed | default(false)
        - not letsencrypt_cgi.stat.exists

    - name: Configure Webmin to use Let's Encrypt certificate
      ansible.builtin.command: >
        /usr/share/webmin/webmin/letsencrypt.cgi
        --host {{ node_fqdn }}
      when:
        - letsencrypt_result.changed | default(false)
        - letsencrypt_cgi.stat.exists
      register: letsencrypt_install
      # Same drill-gated fatality as the generate step above (default false == today).
      failed_when: letsencrypt_install.rc is defined and letsencrypt_install.rc != 0 and (letsencrypt_fatal | default(false) | bool)

    - name: Report Let's Encrypt install failure
      ansible.builtin.debug:
        msg: "LETSENCRYPT_FAILED step=install rc={{ letsencrypt_install.rc }} stderr={{ (letsencrypt_install.stderr | default(''))[-400:] }}"
      when:
        - letsencrypt_install.rc is defined
        - letsencrypt_install.rc != 0

    - name: Record successful certificate issuance and installation
      ansible.builtin.file:
        path: /etc/webmin/letsencrypt-cert-{{ node_fqdn }}
        state: touch
        mode: '0644'
      when:
        - letsencrypt_result.rc is defined
        - letsencrypt_result.rc == 0
        - letsencrypt_install.rc is defined
        - letsencrypt_install.rc == 0

    # `virtualmin modify-config` does not exist (the old task hid that behind
    # failed_when: false); set-global-feature is the 8.x command. Only features a
    # --minimal node can run are required: dns needs BIND and mail needs Postfix,
    # neither of which --minimal installs, and set-global-feature refuses both
    # there. The same set is what create-domain --default-features gives a new
    # server. Only features that are off are switched on, because enabling an
    # automatic feature (unix, dir, ssl, logrotate) turns it into an optional
    # one. A failure here fails the deploy.
    - name: Read the Virtualmin features
      ansible.builtin.command:
        argv: [virtualmin, list-features, --json]
      register: virtualmin_features_before
      changed_when: false

    - name: Work out which required features are off
      ansible.builtin.set_fact:
        virtualmin_features_off: >-
          {{ virtualmin_required_features | difference(
               (virtualmin_features_before.stdout | from_json).data
               | selectattr('values.enabled.0', 'equalto', 'Yes')
               | map(attribute='name') | list) }}

    - name: Enable the Virtualmin features PRAHO provisions with
      ansible.builtin.command:
        argv:
          - virtualmin
          - set-global-feature
          - --enable-feature
          - "{{ item }}"
          - --default-on
          - "{{ item }}"
      loop: "{{ virtualmin_features_off }}"

    - name: Read the Virtualmin features again
      ansible.builtin.command:
        argv: [virtualmin, list-features, --json]
      register: virtualmin_features_after
      changed_when: false

    - name: Require every PRAHO feature to be enabled
      ansible.builtin.assert:
        that:
          - virtualmin_required_features | difference(
              (virtualmin_features_after.stdout | from_json).data
              | selectattr('values.enabled.0', 'equalto', 'Yes')
              | map(attribute='name') | list) | length == 0
        fail_msg: "Virtualmin features still off: {{ virtualmin_features_off }}"

    # #347: PRAHO stores this same password in its vault at registration, so the
    # first API call and verify_and_activate authenticate. The password arrives
    # via a 0600 extra-vars file on the controller and on the node's stdin, never
    # on either command line, and the task is no_log.
    #
    # `virtualmin create-admin` makes a per-domain extra administrator: it needs
    # --domain and has no --can-create/--can-edit flags, so the old task failed
    # every deploy. Virtualmin's remote API runs most programs only for its
    # master administrator (a virtual-server ACL without `noconfig`). The helper
    # therefore creates a Webmin user whose ONLY Webmin module is virtual-server,
    # with Virtualmin master rights in it. On a re-deploy it resets the password
    # to the vault's, so node and vault converge.
    - name: Enroll the PRAHO API user through the shared installed-panel tasks
      ansible.builtin.import_tasks: virtualmin_api_user_tasks.yml

    - name: Create PRAHO tracking file
      ansible.builtin.copy:
        content: |
          PRAHO_MANAGED=true
          DEPLOYMENT_ID={{ deployment_id | default('unknown') }}
          INSTALL_DATE={{ ansible_date_time.iso8601 }}
          VIRTUALMIN_VERSION={{ virtualmin_version }}
          WEBMIN_VERSION={{ webmin_version }}
        dest: /etc/praho-virtualmin-install
        mode: '0644'

    - name: Install private hosting usage collection
      ansible.builtin.import_tasks: virtualmin_usage_tasks.yml

    - name: Apply panel service changes before API credential verification
      ansible.builtin.meta: flush_handlers

    - name: Require the local Webmin TLS endpoint to be ready
      ansible.builtin.uri:
        url: https://127.0.0.1:10000/
        validate_certs: false
        follow_redirects: none
        status_code: [200, 302, 401, 403]
        timeout: 5
      register: webmin_tls_ready
      until: webmin_tls_ready.status | default(-1) in [200, 302, 401, 403]
      retries: 15
      delay: 1
      changed_when: false

  handlers:
    - name: Restart webmin
      ansible.builtin.service:
        name: webmin
        state: restarted

    # Notified only when php.ini of this PHP version exists (Set PHP defaults),
    # so the service exists; a failed restart is a broken node, not noise.
    - name: Restart php-fpm
      ansible.builtin.service:
        name: "php{{ php_default_version }}-fpm"
        state: restarted

    - name: Restart apache
      ansible.builtin.service:
        name: apache2
        state: restarted
