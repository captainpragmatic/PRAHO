---
# Mail capability is separate from domain enrollment. This play has no enable-domain action.
- name: Inspect or prepare supported native mail capability
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Validate one node and a fixed mail operation
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - mail_action in ['inspect_node', 'inspect_domain', 'setup', 'reconcile_submitters', 'reconcile_node_certificate']
          - mail_operation_id is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
          - mail_expected_node_hostname is match('^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$')
        fail_msg: "Invalid native mail operation identity"

    - name: Stage and always remove the fixed native inspection bundle
      block:
        - name: Create a private memory-backed helper directory
          ansible.builtin.tempfile:
            state: directory
            path: /run
            prefix: praho-mail-
          register: mail_bundle

        - name: Require root-only helper permissions
          ansible.builtin.file:
            path: "{{ mail_bundle.path }}"
            owner: root
            group: root
            mode: '0700'

        - name: Copy the fixed native helpers
          ansible.builtin.copy:
            src: "files/{{ item }}"
            dest: "{{ mail_bundle.path }}/{{ item }}"
            owner: root
            group: root
            mode: '0600'
          loop:
            - praho-mail.py
            - praho-mail-native.pl
            - praho_mail_setup.py
            - praho_mail_submitters.py
            - praho-mail-boot.py

        - name: Copy the fixed profile templates
          ansible.builtin.copy:
            src: templates/mail/
            dest: "{{ mail_bundle.path }}/mail-templates/"
            owner: root
            group: root
            mode: '0600'
            directory_mode: '0700'

        - name: Run the bounded native mail operation
          ansible.builtin.command:
            argv:
              - python3
              - "{{ mail_bundle.path }}/praho-mail.py"
          environment:
            PRAHO_MAIL_ACTION: "{{ mail_action }}"
            PRAHO_MAIL_ID: "{{ mail_operation_id }}"
            PRAHO_MAIL_NODE: "{{ mail_expected_node_hostname }}"
            PRAHO_MAIL_DOMAIN: "{{ mail_domain | default('') }}"
            PRAHO_MAIL_OWNER: "{{ mail_expected_owner | default('') }}"
            PRAHO_MAIL_ACCOUNT_ZONE: "{{ mail_account_zone | default('') }}"
            PRAHO_MAIL_RESERVED_ZONES: "{{ mail_reserved_account_zones | default('[]') }}"
            PRAHO_MAIL_ACCOUNT_NAME: "{{ mail_account_hostname | default('') }}"
          register: native_mail
          changed_when: false
          no_log: true

        - name: Require a single bounded public receipt
          vars:
            mail_results: "{{ native_mail.stdout_lines | select('match', '^MAIL_RESULT=[A-Za-z0-9+/=]+$') | list }}"
          ansible.builtin.assert:
            that:
              - mail_results | length == 1
              - native_mail.stdout | length < 524288
            fail_msg: "Native mail operation did not return a bounded receipt"

        - name: Emit only the fixed public projection
          ansible.builtin.debug:
            msg: "{{ native_mail.stdout_lines | select('match', '^MAIL_RESULT=[A-Za-z0-9+/=]+$') | first }}"
      always:
        - name: Remove the temporary native helper bundle
          ansible.builtin.file:
            path: "{{ mail_bundle.path }}"
            state: absent
          when: mail_bundle is defined and mail_bundle.path is defined
