{% load i18n %}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{% trans "CSP violation positive control" %}</title>
  </head>
  <body>
    <h1>{% trans "CSP violation positive control" %}</h1>
    {# tmpl-allow TMPL002: CSP positive control - a deliberately raw inline-handler button the e2e test expects CSP to block #}
    <button
      id="csp-positive-control"
      type="button"
      onclick="window.__cspPositiveControlExecuted = true">
      {% trans "Trigger blocked inline handler" %}
    </button>
  </body>
</html>
