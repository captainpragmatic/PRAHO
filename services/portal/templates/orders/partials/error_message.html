{% load i18n ui_components %}

<!-- Error Message Component (HTMX Response) -->
<div class="fixed top-4 right-4 bg-red-600 text-white px-4 py-3 rounded-lg shadow-lg z-50 max-w-sm" {# tmpl-allow TMPL005: needs alert alpine_transition #}
     id="error-notification"
     x-data="autoDismiss(5000)"
     x-show="show"
     x-transition:enter="transform transition-transform duration-300"
     x-transition:enter-start="translate-x-full"
     x-transition:enter-end="translate-x-0"
     x-transition:leave="transform transition-transform duration-300"
     x-transition:leave-start="translate-x-0"
     x-transition:leave-end="translate-x-full">

  <div class="flex items-start">
    <span class="mr-2 flex-shrink-0" aria-hidden="true">{% icon "x" size="sm" %}</span>
    <div class="flex-1">
      <p class="font-medium">{% trans "Error" %}</p>
      <p class="text-sm opacity-90 mt-1">{{ error }}</p>
    </div>
    {# tmpl-allow TMPL002: icon-only dismiss button with translated aria-label #}
    <button data-action="dismiss" data-dismiss-target="#error-notification"
            class="ml-2 text-white hover:text-gray-300 transition-colors"
            aria-label="{% trans 'Close notification' %}">
      <span class="text-lg leading-none">×</span>
    </button>
  </div>

</div>
