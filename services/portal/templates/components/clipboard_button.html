{% load ui_components %}
<button type="button" @click="copy()" class="flex-shrink-0 px-2 py-2 text-amber-300 hover:text-amber-100 bg-slate-700/50 hover:bg-slate-600/50 rounded transition-colors" :title="title">
  <span x-show="notCopied">{% icon "clipboard" size="sm" %}</span>
  <span x-show="copied" class="text-green-400">{% icon "check" size="sm" %}</span>
</button>
