{% load i18n %}
{% load ui_components %}

<div class="bg-amber-900/30 border border-amber-500/50 rounded-lg p-6" role="alert" aria-live="polite">
  <div class="flex items-start gap-3">
    <div class="mt-0.5">
      {% icon "warning" size="sm" css_class="text-amber-300" %}
    </div>
    <div>
      <h3 class="text-amber-200 font-medium">{% trans "You do not have permission to perform this action." %}</h3>
      <p class="text-amber-100/90 mt-1">{{ message }}</p>
    </div>
  </div>
</div>
