# ===============================================================================
# INTEGRATION CI — Lint, Quality, Security, and Cross-Service Tests
# ===============================================================================
# Single source of truth for all linting (make lint) and cross-service validation.
# Service-specific tests and type checking live in platform.yml / portal.yml.
#
# Both jobs are required checks on master (.github/rulesets/master.json), so the pull_request trigger has
# no paths filter: a workflow skipped by a filter never reports, and its required check would block forever.

name: Integration CI

on:
  push:
    branches: [master]
    paths:
      - 'deploy/**'
      - '.env.example.*'
      - 'services/**'
      - 'shared/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Makefile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/integration.yml'
  pull_request:
    branches: [master]
  # The merge queue tests each pull request on top of master and whatever is queued ahead of it.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

env:
  DJANGO_SETTINGS_MODULE: config.settings.test
  DJANGO_SECRET_KEY: test-secret-key-for-ci
  PLATFORM_API_URL: http://localhost:8000
  PLATFORM_API_KEY: test-integration-key
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv-linux

# A new push to a PR supersedes the run on its previous head: cancel it so it stops holding job slots.
# Every other event gets a group of its own, so it is never cancelled or queued behind another run of this
# workflow (it can still wait for free runners).
concurrency:
  group: integration-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Lint & Quality — no database needed
  # ---------------------------------------------------------------------------
  lint-and-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history needed for ruff no-new-debt (Phase 0)

    - name: Install uv and sync dependencies
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python and install dependencies
      run: |
        uv python install
        uv sync --all-groups

    - name: Lint all services (every make lint phase)
      run: make lint

    # The PR's own validators could be weakened by the PR itself: the base revision's copies check its tree.
    # They are written under scripts/ so that their ROOT is this checkout. This raises the bar only (a PR can
    # also edit this workflow); code-owner review of these files is the gate.
    # The base resolved here is also the baseline for the migration-state and security checks below.
    - name: Check migrations with the base branch's validators
      id: migration-base
      env:
        BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      run: |
        set -euo pipefail
        base="${BASE_REF:-}"
        if [ -z "$base" ] || [ -z "${base//0/}" ]; then
          base="$(git merge-base HEAD origin/master)"  # A first push has no previous commit
        fi
        # A dispatch on master resolves to HEAD itself, and HEAD compared with HEAD checks nothing.
        if [ "$(git rev-parse "$base^{commit}")" = "$(git rev-parse HEAD)" ]; then
          base="$(git rev-parse HEAD^)"
        fi
        for validator in scripts/migration_checksums.py scripts/check_new_model_schema.py; do
          if ! git cat-file -e "$base:$validator" 2>/dev/null; then
            echo "The baseline $base has no $validator to check this tree with; refusing a weaker check" >&2
            exit 1
          fi
        done
        echo "ref=$base" >> "${GITHUB_OUTPUT:-/dev/null}"
        py="${PYTHON:-.venv-$(uname -s | tr '[:upper:]' '[:lower:]')/bin/python}"
        trap 'rm -f scripts/_trusted_migration_checksums.py scripts/_trusted_check_new_model_schema.py' EXIT
        git show "$base:scripts/migration_checksums.py" > scripts/_trusted_migration_checksums.py
        git show "$base:scripts/check_new_model_schema.py" \
          | sed 's/^from scripts\.migration_checksums import /from scripts._trusted_migration_checksums import /' \
          > scripts/_trusted_check_new_model_schema.py
        if grep -q 'scripts\.migration_checksums' scripts/_trusted_check_new_model_schema.py; then
          echo "The base schema check imports the PR's checksum module" >&2
          exit 1
        fi
        "$py" scripts/_trusted_migration_checksums.py --base-ref "$base"
        "$py" -m scripts._trusted_check_new_model_schema --base-ref "$base"

    - name: Check migration state
      env:
        MIGRATION_BASE_REF: ${{ steps.migration-base.outputs.ref }}
      run: make check-migrations

    - name: Component parity check (portal ↔ platform)
      run: make check-parity

    - name: Template design-system lint
      run: make lint-templates

    - name: Accessibility audit
      run: make audit-a11y

    - name: Dark-mode audit
      run: make audit-dark-mode

    # A uv environment has no pip, so semgrep is a pinned uv tool. A failed install fails the job: an absent
    # scanner must never read as a clean scan.
    - name: Install semgrep for security scanning
      run: |
        uv tool install "semgrep==${SEMGREP_VERSION}"
        uv tool dir --bin >> "$GITHUB_PATH"
      env:
        SEMGREP_VERSION: '1.157.0'

    # SEMGREP_STRICT makes an unreachable rule registry or a timeout a failure, not a warning. The baseline
    # limits findings to what this change introduces; code already on master was scanned when it merged.
    - name: Security lint (make lint-security)
      run: make lint-security
      env:
        SEMGREP_STRICT: '1'
        SEMGREP_BASELINE_REF: ${{ steps.migration-base.outputs.ref }}

  # ---------------------------------------------------------------------------
  # Integration Tests — requires PostgreSQL
  # ---------------------------------------------------------------------------
  integration-test:
    runs-on: ubuntu-24.04  # Playwright 1.58 does not support Ubuntu 26.04.

    # Override workflow-level settings: integration tests need PostgreSQL + DatabaseCache
    env:
      DJANGO_SETTINGS_MODULE: config.settings.base
      DB_NAME: test_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Start PostgreSQL (registry fallback)
      run: make ci-postgres-start CI_POSTGRES_IMAGE_TAG=16
      env:
        POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}

    - name: Install uv and sync dependencies
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python and install dependencies
      run: |
        uv python install
        uv sync --all-groups

    # A PR compares against its base branch, not against its own previous push: every file the PR changes
    # is checked, however many pushes it took.
    - name: Ruff no-new-debt gate (changed Python files)
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        PUSH_BEFORE: ${{ github.event.before }}
      run: |
        set -euo pipefail
        BASE_REF="${PR_BASE_SHA:-${PUSH_BEFORE:-}}"
        if [ -z "$BASE_REF" ] || [ -z "${BASE_REF//0/}" ]; then
          BASE_REF="HEAD~1"
        fi
        if ! git cat-file -e "${BASE_REF}^{commit}" 2>/dev/null; then
          echo "Baseline ref not present locally ($BASE_REF); fetching..."
          git fetch origin "${BASE_REF}" --depth=1
        fi
        echo "Checking for newly introduced Ruff violations vs: $BASE_REF"
        "$UV_PROJECT_ENVIRONMENT/bin/python" scripts/ruff_new_violations.py --baseline-ref "$BASE_REF"

    - name: Set up platform database
      run: |
        cd services/platform
        PYTHONPATH=$(pwd) ${{ env.UV_PROJECT_ENVIRONMENT }}/bin/python manage.py migrate --no-input
        PYTHONPATH=$(pwd) ${{ env.UV_PROJECT_ENVIRONMENT }}/bin/python manage.py createcachetable

    - name: API token and registrar intent tests (PostgreSQL)
      # The tests run in ~3s, but the runner builds a fresh test database
      # first (full migration stack), which alone can exceed 3 minutes on a
      # slow runner — that flake has struck twice (tests passed, then the
      # step timed out during teardown). 8 minutes gives setup headroom.
      timeout-minutes: 8
      env:
        DJANGO_SETTINGS_MODULE: config.settings.ci
      run: |
        cd services/platform
        PYTHONPATH="$PWD" "$UV_PROJECT_ENVIRONMENT/bin/python" manage.py test \
          tests.api.test_api_token_concurrency.APITokenPostgresConcurrencyTests \
          tests.domains.test_durable_operations \
          tests.customers.test_payment_method_encryption_trigger \
          tests.customers.test_tax_profile_cnp_encryption \
          tests.billing.test_cnp_encryption \
          tests.common.test_migration_db_objects \
          tests.users.test_lockout_counter_concurrency \
          tests.users.test_staff_login_second_factor_concurrency \
          tests.users.test_staff_login_enrollment_race \
          tests.users.test_login_audit_failure_keeps_the_login \
          tests.users.test_mfa_audit_isolation \
          tests.api.test_token_second_factor_concurrency \
          tests.billing.test_fiscal_correction_concurrency \
          tests.billing.test_builtin_storno_concurrency \
          tests.billing.test_invoice_signal_transaction_isolation \
          tests.billing.test_payment_settlement_postgres \
          tests.billing.test_efactura_enqueue_durability \
          tests.orders.test_order_payment_recovery_isolation.OrderAuditPostgresIsolationTests \
          tests.audit.test_membership_signal_postgres_isolation \
          tests.common.test_transactions \
          tests.provisioning.test_hosting_account_staff_actions_concurrency \
          --settings=config.settings.ci --verbosity=2

    - name: Service isolation security tests (make test-security)
      run: make test-security

    - name: Database cache tests (make test-cache)
      run: make test-cache

    - name: Install the browser the page-monitor self-tests drive
      run: '"$UV_PROJECT_ENVIRONMENT/bin/playwright" install --with-deps chromium'

    - name: Integration test suite (make test-integration)
      run: make test-integration

    - name: Upload integration test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-reports
        path: |
          tests/integration/reports/
          htmlcov/
        if-no-files-found: warn

    - name: Stop CI PostgreSQL
      if: always()
      run: make ci-postgres-stop
