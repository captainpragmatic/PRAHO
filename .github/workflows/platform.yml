# ===============================================================================
# PLATFORM SERVICE CI/CD
# ===============================================================================
# All events:  SQLite (fast, reliable — matches local dev + test.py settings)
# PRs:         the full suite with coverage floors (coverage-gate), plus affected-module detection
#              for a fast first signal (platform-test)
# Master push: Full suite + coverage
#
# PostgreSQL: every PR and push also runs the PostgreSQL-gated tests (platform-postgres), which
# skip themselves on SQLite. The whole suite on PostgreSQL runs nightly (nightly.yml) and for every
# release candidate (release-candidate.yml). Linting is consolidated in integration.yml (make lint).
#
# Every job is a required check on master (.github/rulesets/master.json), so pull_request has no
# paths filter. Staging is never pushed to: it is promoted from master (make promote-staging).

name: Platform Service CI/CD

on:
  push:
    branches: [master]
    paths:
      - 'services/platform/**'
      - 'shared/**'
      - 'scripts/affected_test_modules.py'
      # What platform-postgres runs: its Makefile target, the scan, and the database bootstrap.
      - 'Makefile'
      - 'scripts/pg_gated_test_modules.py'
      - 'scripts/plain_test_class_modules.py'
      - 'scripts/start_ci_postgres.sh'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/**'
      # Root files tests/common/test_ci_node_lockfile.py reads: a change to them alone must run it.
      - 'package.json'
      - 'package-lock.json'
      - '.gitignore'
  pull_request:
    branches: [master]
  # The merge queue tests each pull request on top of master and whatever is queued ahead of it.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

env:
  DJANGO_SETTINGS_MODULE: config.settings.test
  DJANGO_SECRET_KEY: test-secret-key-for-ci
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv-linux

# A new push to a PR supersedes the run on its previous head: cancel it so it stops holding job slots.
# Every other event gets a group of its own, so it is never cancelled or queued behind another run of this
# workflow (it can still wait for free runners).
concurrency:
  group: platform-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage-gate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv and sync dependencies
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python and install dependencies
      run: |
        uv python install
        uv sync --group platform --group dev

    - name: Platform global coverage floor
      run: make coverage-platform

    - name: Platform per-package coverage floors
      run: make coverage-platform-packages

  platform-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install uv and sync dependencies
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python and install dependencies
      run: |
        uv python install
        uv sync --group platform --group dev

    - name: Detect affected test modules
      id: affected
      if: github.event_name == 'pull_request'
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        git fetch origin "$PR_BASE_SHA" --depth=1 || true
        CHANGED=$(git diff --name-only "$PR_BASE_SHA"...HEAD)
        if [ -z "$CHANGED" ]; then
          echo "modules=FULL" >> "$GITHUB_OUTPUT"
          echo "No changed files detected — running full suite"
          exit 0
        fi
        MODULES=$(echo "$CHANGED" | "$UV_PROJECT_ENVIRONMENT/bin/python" scripts/affected_test_modules.py --verbose)
        echo "modules=$MODULES" >> "$GITHUB_OUTPUT"
        echo "Affected modules: $MODULES"

    - name: Run focused platform tests
      if: github.event_name == 'pull_request' && steps.affected.outputs.modules != 'FULL' && steps.affected.outputs.modules != ''
      env:
        MODULES: ${{ steps.affected.outputs.modules }}
      run: |
        cd services/platform
        # Convert dotted module paths to directory paths to avoid Python 3.13
        # unittest.discover() bug where __file__ is None for namespace packages.
        DIRS=$(echo "$MODULES" | tr ' ' '\n' | sed 's/\./\//g' | tr '\n' ' ')
        PYTHONPATH=$(pwd) "$UV_PROJECT_ENVIRONMENT/bin/python" manage.py test $DIRS --verbosity=2 --failfast --parallel

    - name: Run full platform tests with coverage
      if: github.event_name != 'pull_request' || steps.affected.outputs.modules == 'FULL' || steps.affected.outputs.modules == ''
      run: |
        cd services/platform
        # Coverage does not walk up for its config, so run from here it previously found
        # none: `source`, the omit of tests/migrations, and branch coverage were all
        # inactive and test files counted as covered source. And `--parallel` forks workers
        # whose data is discarded without `concurrency = multiprocessing`, leaving only the
        # parent - which imports everything and runs almost nothing. That pair reported 28%.
        export COVERAGE_RCFILE="$GITHUB_WORKSPACE/pyproject.toml"
        PYTHONPATH=$(pwd) "$UV_PROJECT_ENVIRONMENT/bin/coverage" run manage.py test tests --verbosity=2 --parallel
        # Required: with parallel data enabled, each process writes its own file.
        "$UV_PROJECT_ENVIRONMENT/bin/coverage" combine
        "$UV_PROJECT_ENVIRONMENT/bin/coverage" xml -o coverage-platform.xml
        "$UV_PROJECT_ENVIRONMENT/bin/coverage" report --show-missing

    # The Django runner above only collects unittest.TestCase subclasses. Plain pytest-style
    # Test* classes run here, from a scan of the tests so a new one needs no workflow edit.
    - name: Plain Test* classes (pytest-only, derived from the tests themselves)
      run: make test-platform-pytest-only

    - name: Platform type checking
      run: make check-types-platform

    - name: Upload platform artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: platform-reports
        path: |
          services/platform/htmlcov/
          services/platform/coverage-platform.xml
        if-no-files-found: warn

  # The tests that skip themselves on SQLite, found by scanning the tests. Without this job they
  # first ran after merge, in the nightly, so a PR could break one and still merge green.
  platform-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DJANGO_SETTINGS_MODULE: config.settings.ci
      DB_NAME: postgres
      DB_USER: test
      DB_PASSWORD: test
      DB_HOST: localhost

    steps:
    - uses: actions/checkout@v4

    - name: Start PostgreSQL (registry fallback)
      run: make ci-postgres-start CI_POSTGRES_IMAGE_TAG=16
      env:
        CI_POSTGRES_USER: ${{ env.DB_USER }}
        POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}

    - name: Install uv and sync dependencies
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python and install dependencies
      run: |
        uv python install
        uv sync --all-groups

    - name: PostgreSQL-gated tests (derived from the tests themselves)
      run: make test-platform-postgres-gated

  platform-security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv and sync dependencies
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python and install dependencies
      run: |
        uv python install
        uv sync --group platform --group dev

    # Blocking: any finding of medium-or-higher severity and confidence (-ll -ii) fails the job. A finding
    # that is safe by construction carries an inline `# nosec <id> - <reason>`.
    - name: Run Bandit SAST Security Scan
      run: |
        cd services/platform
        if ! "$UV_PROJECT_ENVIRONMENT/bin/bandit" -r apps/ -ll -ii --exclude '*/tests/*,*/test_*' -f json -o bandit-report.json; then
          "$UV_PROJECT_ENVIRONMENT/bin/bandit" -r apps/ -ll -ii --exclude '*/tests/*,*/test_*' -f txt || true
          exit 1
        fi

    - name: Upload Security Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: services/platform/bandit-report.json
        if-no-files-found: warn
