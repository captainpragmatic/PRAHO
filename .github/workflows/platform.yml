# ===============================================================================
# PLATFORM SERVICE CI/CD
# ===============================================================================
# All events:  SQLite (fast, reliable — matches local dev + test.py settings)
# PRs (fast tier, ADR-0036): the affected test modules, or the whole suite without coverage when the
#              detection says FULL (platform-test), and the PostgreSQL-gated tests under them
#              (platform-postgres); coverage-gate skips.
# Merge queue and master: the full suite with coverage floors (coverage-gate, the only full run)
#              and every PostgreSQL-gated test (platform-postgres), which skip themselves on SQLite.
#
# The whole suite on PostgreSQL runs nightly (nightly.yml) and for every release candidate
# (release-candidate.yml). Linting is consolidated in integration.yml (make lint).
#
# Every job is a required check on master (.github/rulesets/master.json), so pull_request has no
# paths filter; a job skipped on a pull request reports success, and the merge queue runs it.
# Staging is never pushed to: it is promoted from master (make promote-staging).

name: Platform Service CI/CD

on:
  push:
    branches: [master]
    paths:
      - 'services/platform/**'
      - 'shared/**'
      - 'scripts/affected_test_modules.py'
      # What platform-postgres runs: its Makefile target, the scan, and the database bootstrap.
      - 'Makefile'
      - 'scripts/pg_gated_test_modules.py'
      - 'scripts/plain_test_class_modules.py'
      - 'scripts/start_ci_postgres.sh'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/**'
      # Root files tests/common/test_ci_node_lockfile.py reads: a change to them alone must run it.
      - 'package.json'
      - 'package-lock.json'
      - '.gitignore'
  pull_request:
    branches: [master]
  # The merge queue tests each pull request on top of master and whatever is queued ahead of it.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

env:
  DJANGO_SETTINGS_MODULE: config.settings.test
  DJANGO_SECRET_KEY: test-secret-key-for-ci
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv-linux

# A new push to a PR supersedes the run on its previous head: cancel it so it stops holding job slots.
# Every other event gets a group of its own, so it is never cancelled or queued behind another run of this
# workflow (it can still wait for free runners).
concurrency:
  group: platform-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage-gate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv and sync dependencies
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python and install dependencies
      run: |
        uv python install
        # Platform tests exercise the real Portal response consumer in an isolated subprocess.
        uv sync --group platform --group portal --group dev

    - name: Platform global coverage floor
      run: make coverage-platform

    - name: Platform per-package coverage floors
      run: make coverage-platform-packages

  platform-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install uv and sync dependencies
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python and install dependencies
      run: |
        uv python install
        # Platform tests exercise the real Portal response consumer in an isolated subprocess.
        uv sync --group platform --group portal --group dev

    - name: Detect affected test modules
      id: affected
      if: github.event_name == 'pull_request'
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        git fetch origin "$PR_BASE_SHA" --depth=1 || true
        CHANGED=$(git diff --name-only "$PR_BASE_SHA"...HEAD)
        if [ -z "$CHANGED" ]; then
          echo "modules=FULL" >> "$GITHUB_OUTPUT"
          echo "No changed files detected — running full suite"
          exit 0
        fi
        MODULES=$(echo "$CHANGED" | "$UV_PROJECT_ENVIRONMENT/bin/python" scripts/affected_test_modules.py --verbose)
        echo "modules=$MODULES" >> "$GITHUB_OUTPUT"
        echo "Affected modules: $MODULES"

    - name: Run focused platform tests
      if: github.event_name == 'pull_request' && steps.affected.outputs.modules != 'FULL' && steps.affected.outputs.modules != ''
      env:
        MODULES: ${{ steps.affected.outputs.modules }}
      run: |
        cd services/platform
        # Convert dotted module paths to directory paths to avoid Python 3.13
        # unittest.discover() bug where __file__ is None for namespace packages.
        DIRS=$(echo "$MODULES" | tr ' ' '\n' | sed 's/\./\//g' | tr '\n' ' ')
        PYTHONPATH=$(pwd) "$UV_PROJECT_ENVIRONMENT/bin/python" manage.py test $DIRS --verbosity=2 --failfast --parallel

    # A pull request that touches billing, users, shared code, settings or dependencies gets the whole
    # suite, without coverage; the merge queue's coverage-gate is the full run with coverage.
    - name: Run the whole platform suite (detection says FULL)
      if: github.event_name == 'pull_request' && steps.affected.outputs.modules == 'FULL'
      run: |
        cd services/platform
        PYTHONPATH=$(pwd) "$UV_PROJECT_ENVIRONMENT/bin/python" manage.py test tests --verbosity=2 --failfast --parallel

    # The Django runner above only collects unittest.TestCase subclasses. Plain pytest-style
    # Test* classes run here, from a scan of the tests so a new one needs no workflow edit.
    - name: Plain Test* classes (pytest-only, derived from the tests themselves)
      run: make test-platform-pytest-only

    - name: Platform type checking
      run: make check-types-platform

  # The tests that skip themselves on SQLite, found by scanning the tests. Without this job they
  # first ran after merge, in the nightly, so a PR could break one and still merge green. A pull
  # request runs those under its affected modules (platform-test's detection); every other event,
  # the merge queue included, runs them all.
  platform-postgres:
    runs-on: ubuntu-latest
    # Include cold schema setup and database teardown in the serial suite's budget.
    timeout-minutes: 45

    env:
      DJANGO_SETTINGS_MODULE: config.settings.ci
      DB_NAME: postgres
      DB_USER: test
      DB_PASSWORD: test
      DB_HOST: localhost

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Start PostgreSQL (registry fallback)
      run: make ci-postgres-start CI_POSTGRES_IMAGE_TAG=16
      env:
        CI_POSTGRES_USER: ${{ env.DB_USER }}
        POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}

    - name: Install uv and sync dependencies
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python and install dependencies
      run: |
        uv python install
        uv sync --all-groups

    # Not a step condition: the step answers for every event, and anything but a pull request is FULL.
    - name: Detect affected test modules (a pull request runs the gated tests under them)
      id: affected
      env:
        EVENT: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        if [ "$EVENT" != pull_request ]; then
          echo "modules=FULL" >> "$GITHUB_OUTPUT"
          echo "$EVENT runs every PostgreSQL-gated test"
          exit 0
        fi
        git fetch origin "$PR_BASE_SHA" --depth=1 || true
        CHANGED=$(git diff --name-only "$PR_BASE_SHA"...HEAD)
        if [ -z "$CHANGED" ]; then
          echo "modules=FULL" >> "$GITHUB_OUTPUT"
          echo "No changed files detected — running full suite"
          exit 0
        fi
        MODULES=$(echo "$CHANGED" | "$UV_PROJECT_ENVIRONMENT/bin/python" scripts/affected_test_modules.py --verbose)
        echo "modules=$MODULES" >> "$GITHUB_OUTPUT"
        echo "Affected modules: $MODULES"

    - name: PostgreSQL-gated tests (derived from the tests themselves)
      env:
        AFFECTED: ${{ steps.affected.outputs.modules }}
      run: make test-platform-postgres-gated PG_GATED_AFFECTED="$AFFECTED"

    - name: Quota inventory SQL against the managed MariaDB schema
      run: make test-virtualmin-quota-sql

  platform-security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv and sync dependencies
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python and install dependencies
      run: |
        uv python install
        uv sync --group platform --group dev

    # Blocking: any finding of medium-or-higher severity and confidence (-ll -ii) fails the job. A finding
    # that is safe by construction carries an inline `# nosec <id> - <reason>`.
    - name: Run Bandit SAST Security Scan
      run: |
        cd services/platform
        if ! "$UV_PROJECT_ENVIRONMENT/bin/bandit" -r apps/ -ll -ii --exclude '*/tests/*,*/test_*' -f json -o bandit-report.json; then
          "$UV_PROJECT_ENVIRONMENT/bin/bandit" -r apps/ -ll -ii --exclude '*/tests/*,*/test_*' -f txt || true
          exit 1
        fi

    - name: Upload Security Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: services/platform/bandit-report.json
        if-no-files-found: warn
