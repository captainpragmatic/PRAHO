# ===============================================================================
# PORTAL SERVICE CI/CD - API-ONLY, NO DATABASE ACCESS
# ===============================================================================
# Tests and type checking for the portal service.
# Linting is consolidated in integration.yml (make lint).
#
# Both jobs are required checks on master (.github/rulesets/master.json), so pull_request has no
# paths filter. Staging is never pushed to: it is promoted from master (make promote-staging).

name: Portal Service CI/CD

on:
  push:
    branches: [master]
    paths:
      - 'services/portal/**'
      - 'shared/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/portal.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DJANGO_SECRET_KEY: test-secret-key-for-ci
  PLATFORM_API_URL: http://mock-platform:8000
  PLATFORM_API_KEY: test-api-key
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv-linux

# A new push to a PR supersedes the run on its previous head: cancel it so it stops holding job slots.
# Every other event gets a group of its own, so it is never cancelled or queued behind another run of this
# workflow (it can still wait for free runners).
concurrency:
  group: portal-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portal-test:
    runs-on: ubuntu-latest

    # NO DATABASE SERVICES - Portal should not access DB!

    steps:
    - uses: actions/checkout@v4

    - name: Install uv and sync dependencies
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python and install dependencies
      run: |
        uv python install
        uv sync --group portal --group dev

    - name: Validate portal has no external database dependencies
      run: |
        cd services/portal
        if grep -iP "psycopg|mysql-connector|mysqlclient|cx.oracle" pyproject.toml 2>/dev/null; then
          echo "SECURITY FAILURE: Portal has external database drivers in pyproject.toml!"
          exit 1
        fi
        if grep -r "psycopg\|mysql\|oracle" config/settings* 2>/dev/null; then
          echo "SECURITY FAILURE: Portal has external database configuration!"
          exit 1
        fi
        echo "Portal settings use only SQLite (Django internals only)"

    - name: Run portal unit tests with coverage
      run: make coverage-portal-unit

    - name: Portal type checking (make check-types-portal)
      run: make check-types-portal

    - name: Upload portal artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: portal-reports
        path: |
          services/portal/htmlcov/
          services/portal/coverage-portal.xml
        if-no-files-found: warn

  # Real gunicorn with the shipped config against a stub Platform (ADR-0056): threaded workers keep
  # serving others while some requests wait on Platform. Deselected from portal-test, run here.
  portal-server:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv and sync dependencies
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python and install dependencies
      run: |
        uv python install
        uv sync --group portal --group dev

    - name: Run portal server acceptance tests
      run: make test-portal-server
