# ===============================================================================
# NIGHTLY FULL SUITE — COMPREHENSIVE TESTING + COVERAGE
# ===============================================================================
# Runs the complete test suite WITHOUT failfast for a full picture.
# Includes security lint and coverage reporting.
#
# Schedule: 2:30 AM UTC daily (4:30 AM Bucharest time)
# Skips automatically if no commits in the last 24h (saves runner minutes).
# workflow_dispatch always runs, on the branch it was dispatched from, so a change can be proven
# before merge.
# Security: the only caller-chosen value is the dispatched ref. It reaches shell through `env`
# only, and check-activity refuses anything that is not a plain branch name.
# A failed SCHEDULED run opens (or comments on) the `nightly-failure` issue: seven red nights
# once went unseen because a failed scheduled job notifies nobody.

name: Nightly Full Suite

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  DJANGO_SETTINGS_MODULE: config.settings.test
  DJANGO_SECRET_KEY: test-secret-key-for-ci
  PLATFORM_API_URL: http://localhost:8000
  PLATFORM_API_KEY: test-integration-key
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv-linux

jobs:
  # ---------------------------------------------------------------------------
  # Check if there was any activity in the last 24 hours
  # ---------------------------------------------------------------------------
  check-activity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      branches: ${{ steps.check.outputs.branches }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for recent activity per branch
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # workflow_dispatch: test the branch it was dispatched on. The ref is the one
          # caller-chosen value, so it must be a plain branch name before it is used; the
          # character class excludes quotes and backslashes, which keeps the JSON below valid.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$REF_TYPE" != "branch" ] || [[ ! "$REF_NAME" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "::error::Refusing to test the dispatched ref: it is not a plain branch name (tags are refused)."
              exit 1
            fi
            printf 'branches=["%s"]\n' "$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: testing $REF_NAME"
            exit 0
          fi

          # Check commits in the last 24h per branch
          SINCE=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null \
            || date -u -v-24H '+%Y-%m-%dT%H:%M:%SZ')
          MASTER_COMMITS=$(git log origin/master --since="$SINCE" --oneline 2>/dev/null | wc -l)
          STAGING_COMMITS=$(git log origin/staging --since="$SINCE" --oneline 2>/dev/null | wc -l)

          # PR activity counts toward master (PRs target master)
          PR_COUNT=$(gh api "repos/$REPO/pulls?state=all&sort=updated&direction=desc&per_page=10" \
            --jq "[.[] | select(.updated_at > \"$SINCE\")] | length" 2>/dev/null || echo "0")

          echo "master commits: $MASTER_COMMITS, staging commits: $STAGING_COMMITS, active PRs: $PR_COUNT"

          # Build JSON array of branches that need testing
          BRANCHES="[]"
          if [ "$((MASTER_COMMITS + PR_COUNT))" -gt 0 ]; then
            BRANCHES=$(echo "$BRANCHES" | jq -c '. + ["master"]')
          fi
          if [ "$STAGING_COMMITS" -gt 0 ]; then
            BRANCHES=$(echo "$BRANCHES" | jq -c '. + ["staging"]')
          fi

          echo "branches=$BRANCHES" >> "$GITHUB_OUTPUT"
          if [ "$BRANCHES" = "[]" ]; then
            echo "No activity in last 24h — skipping nightly suite"
          else
            echo "Active branches: $BRANCHES"
          fi

  # ---------------------------------------------------------------------------
  # Full nightly suite (only if activity detected)
  # ---------------------------------------------------------------------------
  nightly:
    needs: check-activity
    if: needs.check-activity.outputs.branches != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.check-activity.outputs.branches) }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
          POSTGRES_USER: test
          POSTGRES_INITDB_ARGS: "--nosync"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
          --shm-size=256mb
          --tmpfs /var/lib/postgresql/data
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ matrix.branch }}
        fetch-depth: 0

    - name: Install uv and sync dependencies
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python and install dependencies
      run: |
        uv python install
        uv sync --all-groups

    - name: Full lint (every make lint phase)
      run: make lint

    - name: Concurrency tests (PostgreSQL)
      timeout-minutes: 5
      env:
        DJANGO_SETTINGS_MODULE: config.settings.ci
        DB_NAME: postgres
        DB_USER: test
        DB_PASSWORD: test
        DB_HOST: localhost
      run: |
        cd services/platform
        PYTHONPATH="$PWD" "$UV_PROJECT_ENVIRONMENT/bin/python" manage.py test \
          tests.billing.test_payment_intent_security.DirectPaymentIntentPostgresConcurrencyTests \
          tests.promotions.test_order_discount_concurrency.PromotionOrderPostgresConcurrencyTests \
          tests.billing.test_recurring_collection_concurrency.RecurringCollectionPostgresConcurrencyTests \
          tests.api.test_api_token_concurrency.APITokenPostgresConcurrencyTests \
          --settings=config.settings.ci --verbosity=2

    - name: Platform tests with coverage (no failfast — complete picture)
      run: |
        cd services/platform
        # Same config fix as platform.yml. The threshold moved from 80 to 70, and that is not a
        # relaxation: the old 80 was measured with no `omit` in effect, so ~1,900 test files -
        # each ~100% covered by construction - counted as covered source and inflated it
        # (153,126 statements against a true 70,261). The real app-only figure measured
        # 2026-09-26 is 72.39%, so 70 sits just under reality and actually catches regression,
        # where the nominal 80 never could. Raise it as the number climbs; never lower it to
        # make a run pass.
        export COVERAGE_RCFILE="$GITHUB_WORKSPACE/pyproject.toml"
        PYTHONPATH=$(pwd) "$UV_PROJECT_ENVIRONMENT/bin/coverage" run manage.py test tests --settings=config.settings.test --verbosity=2
        "$UV_PROJECT_ENVIRONMENT/bin/coverage" combine
        "$UV_PROJECT_ENVIRONMENT/bin/coverage" xml -o coverage-nightly.xml
        "$UV_PROJECT_ENVIRONMENT/bin/coverage" report --show-missing --fail-under=70

    - name: Per-package coverage floors (money and access paths)
      run: |
        # A healthy global average can hide a weak package, which is the whole reason this
        # exists alongside the global floor. Reads the combined data from the step above.
        make coverage-platform-packages

    - name: Portal tests
      env:
        DJANGO_SETTINGS_MODULE: config.settings.dev
      run: |
        cd services/portal
        PYTHONPATH= PYTHONNOUSERSITE=1 "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -v

    - name: Integration tests
      env:
        DJANGO_SETTINGS_MODULE: config.settings.ci
        DB_NAME: postgres
        DB_USER: test
        DB_PASSWORD: test
        DB_HOST: localhost
      run: make test-integration

    - name: Cache and security tests
      env:
        DJANGO_SETTINGS_MODULE: config.settings.ci
        DB_NAME: postgres
        DB_USER: test
        DB_PASSWORD: test
        DB_HOST: localhost
      run: |
        make test-cache
        make test-security

    - name: Type checking (all services)
      run: make check-types

    - name: Security lint
      run: make lint-security
      continue-on-error: true

    # Artifact names may not contain `/`, which a dispatched `fix/...` branch would bring.
    - name: Name the artifact after the branch
      id: artifact
      if: always()
      env:
        BRANCH: ${{ matrix.branch }}
      run: echo "suffix=${BRANCH//\//-}" >> "$GITHUB_OUTPUT"

    - name: Upload nightly reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: nightly-reports-${{ steps.artifact.outputs.suffix }}
        path: |
          services/platform/coverage-nightly.xml
        if-no-files-found: warn
        retention-days: 30

  # ---------------------------------------------------------------------------
  # Browser suite: both services live, real HMAC between them, server-side coverage.
  #
  # This job exists because the absence of it was the root cause of a whole class of
  # bug. The browser suite is the only place the portal is exercised against a real
  # platform - its 179 portal tests mock nothing - and it ran in no CI workflow at all,
  # reporting no coverage. Work invested there moved no number anyone watched, so the
  # QA walkthrough stayed manual, went stale, and a setting could be "verified" while
  # its customer-facing consequence was untested. Nightly rather than PR CI: the suite
  # takes minutes, not seconds, and browser tests are the flakiest thing here.
  #
  # Self-contained on purpose. Portal's honest coverage is the UNION of its unit and
  # browser suites, and computing that where both datasets already exist beats shipping
  # half of it between jobs as an artifact.
  #
  # No postgres service: the e2e settings use their own SQLite files.
  # ---------------------------------------------------------------------------
  nightly-e2e:
    needs: check-activity
    if: needs.check-activity.outputs.branches != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.check-activity.outputs.branches) }}

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ matrix.branch }}
        fetch-depth: 0

    - name: Install uv and sync dependencies
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python and install dependencies
      run: |
        uv python install
        uv sync --all-groups

    # `make build-css` shells out to `npx --no-install`, so node_modules must exist or the
    # CSS never builds and the fixtures' CSS checks have nothing to inspect.
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install node dependencies
      run: npm ci

    - name: Install the browser Playwright drives
      run: '"$UV_PROJECT_ENVIRONMENT/bin/playwright" install --with-deps chromium'

    # Boots both services, seeds fixtures, verifies a signed portal->platform read, runs the
    # suite, then stops the stack - which is when coverage is written and reported, because
    # the servers save on SIGTERM.
    - name: Browser suite with server-side coverage
      run: make test-e2e-coverage

    - name: Portal unit coverage (the other half of the union)
      run: make coverage-portal

    - name: Portal coverage floor, unit and browser suites combined
      run: make coverage-portal-union

    - name: Name the artifact after the branch
      id: artifact
      if: always()
      env:
        BRANCH: ${{ matrix.branch }}
      run: echo "suffix=${BRANCH//\//-}" >> "$GITHUB_OUTPUT"

    - name: Upload browser evidence and coverage
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: nightly-e2e-${{ steps.artifact.outputs.suffix }}
        # `coverage-portal-union.xml` is the gated figure itself. The coverage directory above holds
        # the two half-datasets that were MEASURED; this is the union the portal floor is actually
        # checked against, and without it the one number this job passes or fails on was destroyed
        # with the runner. `make coverage-portal-union` writes the xml before applying the floor, so
        # it is present on a failing run too - which is when it is worth having.
        #
        # The comment lives here and not inside `path:` below: that is a `|` literal block, where a
        # `#` line is not a comment but another glob pattern. The first version of this put it there
        # and `yaml.safe_load` accepted it happily - five bogus patterns in the path list.
        path: |
          output/playwright/runs/
          output/playwright/coverage/
          services/portal/coverage-portal-union.xml
          logs/
        if-no-files-found: warn
        retention-days: 30

  # ---------------------------------------------------------------------------
  # A red SCHEDULED run must reach a person. The browser job failed at Node setup on seven
  # consecutive nights and nobody saw it, because a failed scheduled job notifies nobody.
  # One tracking issue, opened on the first failure and commented on by every later one. A person
  # closes it: an automatic close on the next green run could fire on a night that tested nothing.
  # Dispatched runs are attended, so they never notify.
  # ---------------------------------------------------------------------------
  notify-scheduled-failure:
    needs: [check-activity, nightly, nightly-e2e]
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - name: Open or update the nightly-failure issue
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        gh label create nightly-failure --color B60205 \
          --description "A scheduled nightly run failed" --force
        existing=$(gh issue list --label nightly-failure --state open --json number --jq '.[0].number // empty')
        if [ -n "$existing" ]; then
          gh issue comment "$existing" --body "The scheduled nightly run failed again: $RUN_URL"
        else
          gh issue create --label nightly-failure --title "Nightly suite failing" \
            --body "The scheduled nightly run failed: $RUN_URL

        Read the failing job's own conclusion, not the run's. Close this issue once a scheduled run is green for every branch it tested."
        fi
