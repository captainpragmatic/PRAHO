# ===============================================================================
# RELEASE CANDIDATE — what pull requests cannot afford, pinned to one master commit
# ===============================================================================
# Dispatched by hand: Actions → Release candidate → Run workflow, or
# `gh workflow run release-candidate.yml [-f candidate_sha=<sha>]`. A blank candidate means the master
# commit at the moment of the dispatch; the run title names the commit either way.
#
# The merge queue ran every required check on this exact commit, the Virtualmin lab suites among them,
# before master moved to it. `resolve` proves that from the queue's own runs on the candidate (an owner
# bypass merges around the queue), and that the latest nightly full Virtualmin lab on master passed:
# node deploy, fault injection and its browser tests run there, every night master changed, so the
# candidate does not run them again (ADR-0036). Then only the whole platform suite on PostgreSQL runs
# here, on the candidate SHA (pull requests run it on SQLite plus the PostgreSQL-gated tests).
# When it passes, `record` posts the commit status `release-candidate` = success, which
# `make promote-staging SHA=<sha>` requires before it deploys anything.
#
# Security: anyone who can push could post a commit status named `release-candidate`, so
# promote-staging does not trust the status: it requires a successful run of this workflow, titled
# with the candidate, whose own commit is on master (an edited copy on a branch cannot qualify). The
# status is for people reading the commit. The candidate reaches shell through `env` only.

name: Release candidate

run-name: Release candidate ${{ inputs.candidate_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Master commit to test (blank = the current master commit)
        type: string
        default: ''

permissions:
  contents: read

env:
  DJANGO_SECRET_KEY: test-secret-key-for-ci
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv-linux

concurrency:
  group: release-candidate-${{ inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate the candidate
        id: resolve
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$DISPATCH_REF" != "refs/heads/master" ]; then
            echo "::error::Dispatch this workflow from master; a branch's copy of it may not vouch for a commit."
            exit 1
          fi
          sha="${CANDIDATE:-$DISPATCH_SHA}"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The candidate must be a full 40-character commit SHA."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" origin/master; then
            echo "::error::$sha is not on master."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "### Release candidate \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      # The merge queue must have passed every check master requires on the candidate itself, read per
      # workflow from its merge_group runs (scripts/verify_release_candidate.py says why each rule exists;
      # tests/integration/test_verify_release_candidate.py pins them).
      - name: The merge queue passed every required check on the candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: python3 scripts/verify_release_candidate.py "$SHA"

  # Not named after a PR check: a same-named job here could stand in for a required check.
  rc-platform-postgres:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DB_NAME: postgres
      DB_USER: test
      DB_PASSWORD: test
      DB_HOST: localhost
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Start PostgreSQL (registry fallback)
        run: make ci-postgres-start CI_POSTGRES_IMAGE_TAG=16
        env:
          CI_POSTGRES_USER: test
          POSTGRES_PASSWORD: test

      - name: Install uv and sync dependencies
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python and install dependencies
        run: |
          uv python install
          uv sync --group platform --group dev

      - name: Whole platform suite on PostgreSQL
        run: make test-platform-postgres-full

      - name: Stop CI PostgreSQL
        if: always()
        run: make ci-postgres-stop

  record:
    needs: [resolve, rc-platform-postgres]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Mark the commit as a release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.resolve.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/$REPO/statuses/$SHA" \
            -f state=success -f context=release-candidate \
            -f description="Release checks passed" -f target_url="$RUN_URL"
