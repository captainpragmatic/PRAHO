# ===============================================================================
# RELEASE CANDIDATE — what pull requests cannot afford, pinned to one master commit
# ===============================================================================
# Dispatched by hand: Actions → Release candidate → Run workflow, or
# `gh workflow run release-candidate.yml [-f candidate_sha=<sha>]`. A blank candidate means the master
# commit at the moment of the dispatch; the run title names the commit either way (promote-staging finds
# the run by that title). `python3 scripts/verify_release_candidate.py --pick` prints the newest master
# commit the nightly proved in every scope: dispatch with that SHA for the one-minute release.
#
# `resolve` proves from the merge queue's own runs that the candidate passed every required check (an
# owner bypass merges around the queue). Then, per release scope (scripts/verify_release_candidate.py
# RELEASE_SCOPES: the whole Platform suite on PostgreSQL, CrowdSec qualification, native deploy and the
# Virtualmin lab), it answers `reuse` when a nightly run on master proved that scope on exactly this commit,
# or `run`. Only the `run` scopes execute here, on the candidate SHA: a release cut from a nightly-proven
# commit costs about a minute (ADR-0036). Evidence from any other commit never counts.
# When every scope is proven, `record` posts the commit status `release-candidate` = success, which
# `make promote-staging SHA=<sha>` requires before it deploys anything.
#
# Security: anyone who can push could post a commit status named `release-candidate`, so
# promote-staging does not trust the status: it requires a successful run of this workflow, titled
# with the candidate, whose own commit is on master (an edited copy on a branch cannot qualify). The
# status is for people reading the commit. The candidate reaches shell through `env` only.

name: Release candidate

run-name: Release candidate ${{ inputs.candidate_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Master commit to qualify (blank = the current master commit)
        type: string
        default: ''

permissions:
  contents: read

env:
  DJANGO_SECRET_KEY: test-secret-key-for-ci
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv-linux

concurrency:
  group: release-candidate-${{ inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      postgres: ${{ steps.verify.outputs.postgres }}
      crowdsec: ${{ steps.verify.outputs.crowdsec }}
      native: ${{ steps.verify.outputs.native }}
      lab: ${{ steps.verify.outputs.lab }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate the candidate
        id: resolve
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$DISPATCH_REF" != "refs/heads/master" ]; then
            echo "::error::Dispatch this workflow from master; a branch's copy of it may not vouch for a commit."
            exit 1
          fi
          sha="${CANDIDATE:-$DISPATCH_SHA}"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The candidate must be a full 40-character commit SHA."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" origin/master; then
            echo "::error::$sha is not on master."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "### Release candidate \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      # The merge queue must have passed every check master requires on the candidate itself, read per
      # workflow from its merge_group runs; then each release scope is reused or run. The script says why
      # each rule exists; tests/integration/test_verify_release_candidate.py pins them.
      - name: The merge queue passed every required check on the candidate; reuse or run each scope
        id: verify
        shell: bash  # GitHub adds `-o pipefail` only for an explicit bash shell: a refusal must fail the step
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: python3 scripts/verify_release_candidate.py "$SHA" | tee -a "$GITHUB_STEP_SUMMARY"

  # Not named after a PR check: a same-named job here could stand in for a required check.
  rc-platform-postgres:
    needs: resolve
    if: needs.resolve.outputs.postgres == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DB_NAME: postgres
      DB_USER: test
      DB_PASSWORD: test
      DB_HOST: localhost
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Start PostgreSQL (registry fallback)
        run: make ci-postgres-start CI_POSTGRES_IMAGE_TAG=16
        env:
          CI_POSTGRES_USER: test
          POSTGRES_PASSWORD: test

      - name: Install uv and sync dependencies
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python and install dependencies
        run: |
          uv python install
          # The whole Platform suite includes the isolated real Portal response consumer.
          uv sync --group platform --group portal --group dev

      - name: Whole platform suite on PostgreSQL
        run: make test-platform-postgres-full

      - name: Stop CI PostgreSQL
        if: always()
        run: make ci-postgres-stop

  rc-crowdsec:
    needs: resolve
    if: needs.resolve.outputs.crowdsec == 'run'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the frozen qualification dependencies
        run: |
          uv python install
          uv sync --all-groups --frozen

      - name: CrowdSec native artifact qualification
        run: make test-crowdsec-docker

  # The split cases run as shards (scripts/run_native_acceptance.py), each on its own lab.
  rc-native:
    needs: resolve
    if: needs.resolve.outputs.native == 'run'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [split-prod-1, split-prod-2, split-prod-3, split-prod-4, combined-staging, combined-prod]
    env:
      PRAHO_NATIVE_ACCEPTANCE_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the frozen qualification dependencies
        run: |
          uv python install
          uv sync --all-groups --frozen

      - name: Native split and combined deployment acceptance
        run: make test-native-deploy

      # Not profile-specific: one matrix entry runs it.
      - uses: hashicorp/setup-terraform@v3
        if: matrix.profile == 'combined-prod'
        with:
          terraform_version: 1.13.5

      - name: Native infrastructure topology and adoption safety
        if: matrix.profile == 'combined-prod'
        run: make test-native-infra

  # The container lab, through the lab workflow's own reusable entry, on the candidate.
  rc-lab:
    needs: resolve
    if: needs.resolve.outputs.lab == 'run'
    permissions:
      contents: read
      issues: write  # the called workflow's scheduled-failure notifier; it never runs for a call
    uses: ./.github/workflows/virtualmin-lab.yml
    with:
      suite: containers
      ref: ${{ needs.resolve.outputs.sha }}

  record:
    needs: [resolve, rc-platform-postgres, rc-crowdsec, rc-native, rc-lab]
    # Reached even when reused scopes were skipped; the gate step decides, fail-closed.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    env:
      RESOLVE_RESULT: ${{ needs.resolve.result }}
      POSTGRES_DECISION: ${{ needs.resolve.outputs.postgres }}
      POSTGRES_RESULT: ${{ needs.rc-platform-postgres.result }}
      CROWDSEC_DECISION: ${{ needs.resolve.outputs.crowdsec }}
      CROWDSEC_RESULT: ${{ needs.rc-crowdsec.result }}
      NATIVE_DECISION: ${{ needs.resolve.outputs.native }}
      NATIVE_RESULT: ${{ needs.rc-native.result }}
      LAB_DECISION: ${{ needs.resolve.outputs.lab }}
      LAB_RESULT: ${{ needs.rc-lab.result }}
    steps:
      - name: Every release scope was proven on the candidate
        run: |
          test "$RESOLVE_RESULT" = success
          for scope in POSTGRES CROWDSEC NATIVE LAB; do
            decision_var="${scope}_DECISION"; result_var="${scope}_RESULT"
            decision="${!decision_var}"; result="${!result_var}"
            echo "$scope: $decision -> $result"
            if [ "$result" = success ]; then continue; fi
            # A skip proves nothing unless the verifier found nightly proof on this exact commit.
            # (Explicit exit: `set -e` ignores a failure inside an && list that is not its last command.)
            if [ "$result" = skipped ] && [ "$decision" = reuse ]; then continue; fi
            echo "::error::$scope was neither run successfully nor proven by a nightly run on this commit"
            exit 1
          done

      - name: Mark the commit as a release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.resolve.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/$REPO/statuses/$SHA" \
            -f state=success -f context=release-candidate \
            -f description="Release checks passed" -f target_url="$RUN_URL"
