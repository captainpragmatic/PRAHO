# ===============================================================================
# VIRTUALMIN LAB CHECK FOR PULL REQUESTS — the lab runs nightly, not per pull request
# ===============================================================================
# The Virtualmin lab no longer runs per pull request or in the merge queue (ADR-0036, amended). It runs
# every night master changed (virtualmin-lab.yml, nightly-containers); a failed night opens the
# `virtualmin-lab-failure` issue, and the release candidate reuses the nightly lab on its exact commit or
# runs the lab on the candidate (scripts/verify_release_candidate.py). To run it on a branch before merging, dispatch
# virtualmin-lab.yml with suite `containers`.
#
# `pull-request` is still a required check on master (.github/rulesets/master.json), and a required check
# that never reports blocks every merge. So this job stays, reporting success at once, until the ruleset
# stops requiring it. It runs on nothing but pull requests and merge groups, so that a job of the same name
# from a schedule or a dispatch can never stand in for it.

name: Virtualmin Lab (pull request)

on:
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  pull-request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The Virtualmin lab runs nightly
        run: |
          echo "The Virtualmin lab runs nightly on master and gates release candidates (ADR-0036)."
          echo "To run it on this branch, dispatch virtualmin-lab.yml with suite containers."
