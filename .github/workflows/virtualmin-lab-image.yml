# ===============================================================================
# VIRTUALMIN LAB IMAGES — BUILD AND PUBLISH TO GHCR
# ===============================================================================
# Builds the two vanilla lab images in deploy/virtualmin-lab/ for linux/amd64 and linux/arm64:
#   ghcr.io/<owner>/praho-virtualmin-lab:<virtual-server version>  (Virtualmin GPL, minimal LAMP)
#   ghcr.io/<owner>/praho-debian-node:12                            (bare Debian, for node deploys)
# Each carries an SBOM and build provenance. Nothing PRAHO-specific and no credential is in any
# layer: the Dockerfiles verify the Virtualmin signing keys by fingerprint and pin every package,
# and every secret is injected at boot (see deploy/virtualmin-lab/README.md).
#
# Pull requests build without pushing, so a broken Dockerfile fails before merge. Pushes to
# master, the weekly rebuild (fresh Debian security updates on the same pinned versions) and a
# manual dispatch publish. The arm64 half builds under QEMU, which is slow but needs no runner.

name: Virtualmin Lab Images

on:
  push:
    branches: [master]
    paths:
      - 'deploy/virtualmin-lab/**'
      - '.github/workflows/virtualmin-lab-image.yml'
  pull_request:
    paths:
      - 'deploy/virtualmin-lab/**'
      - '.github/workflows/virtualmin-lab-image.yml'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: virtualmin-lab-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: praho-virtualmin-lab
            dockerfile: virtualmin/Dockerfile
            version_arg: VIRTUAL_SERVER_VERSION
          - image: praho-debian-node
            dockerfile: debian-node/Dockerfile
            version_arg: ''
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name and tag
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          DOCKERFILE: deploy/virtualmin-lab/${{ matrix.dockerfile }}
          VERSION_ARG: ${{ matrix.version_arg }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          if [ -n "$VERSION_ARG" ]; then
            # The tag is the pinned Virtualmin version, e.g. 8.3.0 from "8.3.0-1-gpl".
            version="$(sed -n "s/^ARG ${VERSION_ARG}=\([0-9][0-9.]*\).*/\1/p" "$DOCKERFILE")"
          else
            version=12
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "Could not read a version from $DOCKERFILE (got '$version')" >&2
            exit 1
          fi
          {
            echo "name=ghcr.io/${owner}/${IMAGE}"
            echo "tag=${version}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and publish outside pull requests)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: deploy/virtualmin-lab
          file: deploy/virtualmin-lab/${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          build-args: VCS_REF=${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.meta.outputs.name }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.meta.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
