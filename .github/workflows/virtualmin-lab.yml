# ===============================================================================
# VIRTUALMIN LAB — PRAHO AGAINST REAL VIRTUALMIN (Docker, systemd, two nodes + MinIO)
# ===============================================================================
# Container coverage and separate native acceptance (deploy/virtualmin-lab, see its README):
#
#   pull request   virtualmin-lab-pr.yml: the round trip, the contract suite, the workflow suite and the lab checks
#                  (make test-virtualmin-lab) on the PINNED version, when the change can reach the lab. It is a
#                  workflow of its own so that its required check never shares a name with a job this workflow
#                  skips on a schedule or a dispatch.
#   release        release-candidate.yml reuses a nightly container lab on its exact commit, or calls this
#                  workflow (suite containers) on the candidate (scripts/verify_release_candidate.py).
#   containers     03:30 UTC, skipped when nothing changed in 24h: suites, fault injection, browsers and
#                  maintenance Portal on PINNED containers. No native kernel/deployment claim.
#   manual full    optional: explicit suite=full only, after an isolated native runner and private authority
#                  are configured. Not required for a release. No automatic credential/runner registration.
#   nightly drift  05:30 UTC, always (Virtualmin changes without our commits): the lab image built from the
#                  LATEST packages, then the contract suite, recording nothing, on amd64 and arm64.
#
# Every step is a make target, so each can be run locally. The lab needs privileged containers with systemd as PID 1
# on cgroup v2: the setup action checks that first and fails with the reason.
# A failed SCHEDULED run opens (or comments on) the `virtualmin-lab-failure` issue, as nightly.yml does.
# workflow_dispatch runs the suite named in the `suite` input on the branch it was dispatched from; the ref is
# never interpolated into shell.

name: Virtualmin Lab

on:
  # Reusable callers get container coverage; native acceptance requires this explicit manual dispatch.
  workflow_call:
    inputs:
      suite:
        type: string
        default: containers
      ref:
        type: string
        default: ''
  schedule:
    - cron: '30 3 * * *'
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Which run to start
        type: choice
        options: [containers, full, drift, components]
        default: containers

permissions:
  contents: read

concurrency:
  # A release candidate calls this with its commit in inputs.ref: each candidate gets its own group.
  group: virtualmin-lab-${{ github.event_name }}-${{ github.ref }}-${{ github.event.schedule }}-${{ inputs.ref }}
  cancel-in-progress: false

env:
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv-linux

jobs:
  # ---------------------------------------------------------------------------
  # Routine container run only: skip when master saw no activity in 24h.
  # ---------------------------------------------------------------------------
  check-activity:
    if: github.event_name == 'schedule' && github.event.schedule == '30 3 * * *'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for recent activity on master
        id: check
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          SINCE=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')
          COMMITS=$(git log origin/master --since="$SINCE" --oneline 2>/dev/null | wc -l)
          PRS=$(gh api "repos/$REPO/pulls?state=all&sort=updated&direction=desc&per_page=10" \
            --jq "[.[] | select(.updated_at > \"$SINCE\")] | length" 2>/dev/null || echo "0")
          echo "master commits: $COMMITS, active PRs: $PRS"
          if [ "$((COMMITS + PRS))" -gt 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No activity in the last 24h: skipping the nightly lab run"
          fi

  # ---------------------------------------------------------------------------
  # Routine container coverage, on the pinned Virtualmin. Never native proof.
  # ---------------------------------------------------------------------------
  nightly-containers:
    needs: check-activity
    if: >-
      always() && (
        (needs.check-activity.result == 'success' && needs.check-activity.outputs.run == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.suite == 'containers')
      )
    runs-on: ubuntu-24.04  # Its browser tests need Playwright, which does not support Ubuntu 26.04.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0  # Validate cached image inputs against its recorded revision.

      - uses: ./.github/actions/virtualmin-lab-setup
        with:
          browser: 'true'

      - name: Start the lab
        run: make virtualmin-lab-up

      - name: Container-only suites, faults, browsers and maintenance Portal
        run: make test-virtualmin-lab-containers

      - name: Lab diagnostics
        if: failure()
        run: |
          docker ps -a
          for node in vmlab-a vmlab-b vmlab-minio vmlab-component-source; do
            echo "::group::docker logs ${node}"
            docker logs --tail 200 "${node}" || true
            echo "::endgroup::"
          done

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtualmin-container-lab-evidence
          path: |
            output/playwright/virtualmin-lab/
            output/playwright/maintenance-lab/
            output/virtualmin-lab/faults/
            output/virtualmin-lab/components/
            logs/virtualmin_e2e_server.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop the lab
        if: always()
        run: |
          make virtualmin-lab-down
          deploy/virtualmin-lab/lab.sh node-down || true

  # Fail unconfigured full dispatches on hosted CI, before queueing a private runner.
  # This readiness declaration admits work only; it is never capability evidence.
  native-admission:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Require approved prepared native runner configuration
        env:
          NATIVE_ACCEPTANCE_RUNNER_READY: ${{ vars.NATIVE_ACCEPTANCE_RUNNER_READY }}
        run: |
          if [ "$NATIVE_ACCEPTANCE_RUNNER_READY" != 'true' ]; then
            echo '::error::Configure the approved isolated native-acceptance runner/environment and private authority first. Container success cannot qualify native acceptance.'
            exit 1
          fi

  native-full:
    needs: native-admission
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'full'
    runs-on: [self-hosted, linux, native-acceptance]
    environment: native-acceptance
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require existing private native authority and isolated database
        run: |
          set -euo pipefail
          : "${NATIVE_VM_MANIFEST:?Prepare the private fresh-intent authority outside the checkout}"
          : "${NATIVE_DNS_ZONE:?Configure the approved disposable DNS zone}"
          : "${NATIVE_S3_MANIFEST:?Prepare the exact owned native storage fixture}"
          : "${DB_NAME:?Configure the isolated native PostgreSQL database}"
          test -r "$NATIVE_VM_MANIFEST"
          test -r "$NATIVE_S3_MANIFEST"
          case "$DB_NAME" in praho_native_*) ;; *) echo '::error::An isolated praho_native_ database is required'; exit 1;; esac

      - uses: ./.github/actions/virtualmin-lab-setup
        with:
          browser: 'true'

      - name: Verify fresh Ubuntu native hosting capability
        run: make test-virtualmin-native-fresh-deployment

      - name: Start the container lab on the isolated acceptance runner
        run: make virtualmin-lab-up

      - name: Native-inclusive full Virtualmin lab
        run: make test-virtualmin-lab-full

      - name: Maintenance Portal acceptance
        run: make test-virtualmin-maintenance-portal

      - name: Lab diagnostics
        if: failure()
        run: |
          docker ps -a
          for node in vmlab-a vmlab-b vmlab-minio vmlab-component-source; do
            echo "::group::docker logs ${node}"
            docker logs --tail 200 "${node}" || true
            echo "::endgroup::"
          done

      - name: Upload container evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtualmin-native-full-container-evidence
          path: |
            output/playwright/virtualmin-lab/
            output/playwright/maintenance-lab/
            output/virtualmin-lab/faults/
            output/virtualmin-lab/components/
            logs/virtualmin_e2e_server.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop the owned container lab
        if: always()
        run: make virtualmin-lab-down

      # Native resources, their original private keys and uncertain outcomes are retained
      # for the existing exact-resource reconciliation/teardown commands. Never upload them.

  # ---------------------------------------------------------------------------
  # Explicit runner diagnostics only; this job never qualifies the full lab.
  # ---------------------------------------------------------------------------
  components-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'components'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Validate cached image inputs against its recorded revision.

      - uses: ./.github/actions/virtualmin-lab-setup

      - name: Start the lab
        run: make virtualmin-lab-up

      - name: Component diagnostics (not full lab qualification)
        run: make test-virtualmin-components

      - name: Lab diagnostics
        if: failure()
        run: |
          docker ps -a
          for node in vmlab-a vmlab-b vmlab-minio vmlab-component-source; do
            echo "::group::docker logs ${node}"
            docker logs --tail 200 "${node}" || true
            echo "::endgroup::"
          done

      - name: Upload component diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtualmin-components-diagnostics
          path: output/virtualmin-lab/components/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop the lab
        if: always()
        run: make virtualmin-lab-down

  # ---------------------------------------------------------------------------
  # Nightly drift: the contract suite against whatever Virtualmin ships today.
  # A failure means a program PRAHO calls answers differently (or the installer broke): read the assertion.
  # ---------------------------------------------------------------------------
  nightly-drift:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '30 5 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'drift')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # The lab images build for both architectures: a node that answers differently on one is also drift.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/virtualmin-lab-setup

      - name: Contract suite against the latest Virtualmin
        run: make test-virtualmin-drift

      - name: Report the versions that were tested
        if: always()
        run: |
          {
            echo "### Virtualmin drift on $(uname -m)"
            echo '```'
            docker exec vmlab-b dpkg-query -W webmin webmin-virtual-server virtualmin-core virtualmin-config 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lab diagnostics
        if: failure()
        run: |
          docker ps -a
          docker logs --tail 200 vmlab-b || true

      - name: Stop the lab
        if: always()
        run: make virtualmin-lab-down

  # ---------------------------------------------------------------------------
  # A red SCHEDULED run must reach a person (a failed scheduled job notifies nobody).
  # One issue, opened on the first failure and commented on by every later one; a person closes it.
  # ---------------------------------------------------------------------------
  notify-scheduled-failure:
    needs: [nightly-containers, nightly-drift]
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the virtualmin-lab-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create virtualmin-lab-failure --color B60205 \
            --description "A scheduled Virtualmin lab run failed" --force
          existing=$(gh issue list --label virtualmin-lab-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "The scheduled Virtualmin lab run failed again: $RUN_URL"
          else
            gh issue create --label virtualmin-lab-failure --title "Virtualmin lab run failing" \
              --body "A scheduled Virtualmin lab run failed: $RUN_URL

          Read the failing job: the container run (pinned Virtualmin) and drift run (latest Virtualmin, amd64 and arm64) have different scopes. Neither proves native acceptance. Close this issue once both scheduled scopes are green."
          fi
