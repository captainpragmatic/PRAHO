# =============================================================================
# PRAHO - PORTAL ONLY DEPLOYMENT
# =============================================================================
# Deploy Portal service separately (connects to remote Platform API)
# Use when Platform runs on a different server/container
#
# Run through deploy/scripts/deploy.sh, which passes the env file (.env.prod, or .env.staging with
# --env staging) to every Compose call. Directly:
#   PRAHO_ENV_FILE=$PWD/.env.prod docker compose --env-file .env.prod -f deploy/docker-compose.portal-only.yml up -d
#
# The env file on a portal host is the portal's own: deploy/scripts/portal-env.sh writes it from the full
# file, keeping only the variables this file uses, and deploy.sh refuses one that holds anything else.
#
# Required (deploy.sh sets PRAHO_ENV_FILE; the rest belong in the env file):
#   - PLATFORM_API_BASE_URL (e.g., https://platform.example.com/api)
#   - PORTAL_DJANGO_SECRET_KEY (the portal's own Django key; never the platform's DJANGO_SECRET_KEY)
#   - PLATFORM_API_SECRET (same value as HMAC_SECRET), PLATFORM_TO_PORTAL_WEBHOOK_SECRET
#   - PORTAL_TRUSTED_PROXY_CIDRS (the proxy in front of the portal)
#   - PORTAL_DOMAIN and PLATFORM_DOMAIN (distinct hostnames; DOMAIN is a Portal fallback)

services:
  portal:
    image: ${REGISTRY:-}praho-portal:${VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/portal/Dockerfile
    container_name: praho_portal
    ports:
      - "${PORTAL_PORT:-8701}:8701"
    environment:
      - DEBUG=0
      - PLATFORM_API_BASE_URL=${PLATFORM_API_BASE_URL:?PLATFORM_API_BASE_URL required}
      - PLATFORM_API_SECRET=${PLATFORM_API_SECRET:?PLATFORM_API_SECRET required}
      # Per-portal signing secret (#277). Unset/empty => sign with PLATFORM_API_SECRET.
      - PORTAL_HMAC_SECRET=${PORTAL_HMAC_SECRET:-}
      # Production refuses to start without it: the CIDRs your reverse proxy connects from.
      - PORTAL_TRUSTED_PROXY_CIDRS=${PORTAL_TRUSTED_PROXY_CIDRS:?set PORTAL_TRUSTED_PROXY_CIDRS to your reverse proxy's CIDRs}
      - PLATFORM_API_ALLOW_INSECURE_HTTP=${PLATFORM_API_ALLOW_INSECURE_HTTP:-false}
      - PLATFORM_TO_PORTAL_WEBHOOK_SECRET=${PLATFORM_TO_PORTAL_WEBHOOK_SECRET:?PLATFORM_TO_PORTAL_WEBHOOK_SECRET required}
      - PLATFORM_DOMAIN=${PLATFORM_DOMAIN:-platform.localhost}
      - PORTAL_DOMAIN=${PORTAL_DOMAIN:-${DOMAIN:-localhost}}
      # The portal's own key (never the platform's: on the platform it derives the MFA, audit and
      # unsubscribe keys). deploy/scripts/portal-env.sh refuses a file where the two are equal.
      - DJANGO_SECRET_KEY=${PORTAL_DJANGO_SECRET_KEY:?PORTAL_DJANGO_SECRET_KEY required (the portal's own key)}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings.prod}
      - ALLOWED_HOSTS=${PORTAL_DOMAIN:-${DOMAIN:-localhost}},localhost,portal
      - CSRF_TRUSTED_ORIGINS=https://${PORTAL_DOMAIN:-${DOMAIN:-localhost}}
      - DJANGO_SECURE_SSL_REDIRECT=false
      - SERVICE_NAME=portal
      - SESSION_DB_PATH=/app/data/portal.sqlite3
    volumes:
      - portal_static:/app/staticfiles
      - portal_logs:/app/logs
      - portal_sessions:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8701/status/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Optional: Caddy for standalone portal with HTTPS
  caddy:
    image: caddy:2-alpine
    container_name: praho_portal_caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PORTAL_DOMAIN=${PORTAL_DOMAIN:-${DOMAIN:-localhost}}
      - PLATFORM_DOMAIN=${PLATFORM_DOMAIN:-platform.localhost}
      # Space-separated CIDRs, never commas. Applies only to the Platform staff site.
      - PLATFORM_ALLOWED_CIDRS=${PLATFORM_ALLOWED_CIDRS:-127.0.0.1/32 ::1/128}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
      # Set but empty would make Caddy send an empty header (HSTS off), so the default is repeated here.
      - HSTS_POLICY=${HSTS_POLICY:-max-age=31536000; includeSubDomains}
    volumes:
      - ./caddy/Caddyfile.portal:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - portal_static:/srv/static:ro
    depends_on:
      - portal
    restart: unless-stopped
    profiles:
      - with-caddy

volumes:
  portal_static:
  portal_logs:
  portal_sessions:
  caddy_data:
  caddy_config:
