# =============================================================================
# PRAHO - SINGLE SERVER DEPLOYMENT (All Services)
# =============================================================================
# Deploy Platform + Portal + PostgreSQL + Caddy on a single server
# Run through deploy/scripts/deploy.sh, which passes the env file (.env.prod, or .env.staging with
# --env staging) to every Compose call. Directly:
#   PRAHO_ENV_FILE=$PWD/.env.prod docker compose --env-file .env.prod -f deploy/docker-compose.single-server.yml up -d
#
# Required (deploy.sh sets PRAHO_ENV_FILE; the rest belong in the env file):
#   - PRAHO_ENV_FILE: the env file's own path
#   - DB_PASSWORD, DJANGO_SECRET_KEY
#   - PLATFORM_API_SECRET (same value as HMAC_SECRET), PLATFORM_TO_PORTAL_WEBHOOK_SECRET
#   - DJANGO_ENCRYPTION_KEY, CREDENTIAL_VAULT_MASTER_KEY (production settings; deploy.sh checks them)
#   - PORTAL_DOMAIN and PLATFORM_DOMAIN (distinct hostnames), ACME_EMAIL (for Let's Encrypt)
#   - PLATFORM_ALLOWED_CIDRS (space-separated staff/VPN CIDRs; default: loopback only)

services:
  # ===========================================================================
  # DATABASE - PostgreSQL
  # ===========================================================================
  db:
    image: postgres:15-alpine
    container_name: praho_db
    environment:
      POSTGRES_DB: praho
      POSTGRES_USER: praho
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praho -d praho"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - internal

  # ===========================================================================
  # PLATFORM SERVICE - Full Django Application
  # ===========================================================================
  platform:
    image: ${REGISTRY:-}praho-platform:${VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/platform/Dockerfile
    container_name: praho_platform
    env_file:
      # The operator's whole env file (deploy.sh exports its path); `environment:` below still wins.
      - "${PRAHO_ENV_FILE:?run deploy/scripts/deploy.sh, or set PRAHO_ENV_FILE to the file passed with --env-file}"
    environment:
      - DEBUG=0
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=praho
      - DB_USER=praho
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD required}
      # Fixed, like DB_HOST: this stack's own Postgres has no TLS and is reachable only on `internal`.
      # The env file's DB_SSLMODE describes a native or external database.
      - DB_SSLMODE=disable
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY required}
      - HMAC_SECRET=${PLATFORM_API_SECRET:?PLATFORM_API_SECRET required}
      # Per-portal HMAC registry (#277). Unset => legacy shared-secret behavior (safe default).
      - PORTAL_HMAC_MODE=${PORTAL_HMAC_MODE:-legacy}
      - PORTAL_HMAC_CREDENTIALS=${PORTAL_HMAC_CREDENTIALS:-}
      - PLATFORM_TO_PORTAL_WEBHOOK_SECRET=${PLATFORM_TO_PORTAL_WEBHOOK_SECRET:?PLATFORM_TO_PORTAL_WEBHOOK_SECRET required}
      # Production settings refuse to start without these two and name the missing one; staging doesn't
      # need them, so Compose doesn't require them. The portal never gets them.
      - DJANGO_ENCRYPTION_KEY=${DJANGO_ENCRYPTION_KEY:-}
      - DJANGO_ENCRYPTION_KEY_PREVIOUS=${DJANGO_ENCRYPTION_KEY_PREVIOUS:-}
      - CREDENTIAL_VAULT_MASTER_KEY=${CREDENTIAL_VAULT_MASTER_KEY:-}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings.prod}
      - STATIC_ROOT=/app/staticfiles
      - PLATFORM_DOMAIN=${PLATFORM_DOMAIN:-platform.localhost}
      - PORTAL_DOMAIN=${PORTAL_DOMAIN:-${DOMAIN:-localhost}}
      - ALLOWED_HOSTS=${PLATFORM_DOMAIN:-platform.localhost},localhost,platform
      - CSRF_TRUSTED_ORIGINS=https://${PLATFORM_DOMAIN:-platform.localhost}
      - DJANGO_SECURE_SSL_REDIRECT=false
      - SERVICE_NAME=platform
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
      - logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8700/api/users/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      # A first boot runs every migration before Gunicorn listens (124 s measured on a fast machine);
      # failures during the start period don't count, and a passing check ends it early.
      start_period: 600s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - internal
      - web

  # ===========================================================================
  # PORTAL SERVICE - Lightweight Customer API
  # ===========================================================================
  portal:
    image: ${REGISTRY:-}praho-portal:${VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/portal/Dockerfile
    container_name: praho_portal
    stop_grace_period: 55s  # above gunicorn's graceful_timeout (50 s), so restarts drain
    environment:
      - DEBUG=0
      - PLATFORM_API_BASE_URL=http://platform:8700/api
      - PLATFORM_API_SECRET=${PLATFORM_API_SECRET:?PLATFORM_API_SECRET required}
      # Per-portal signing secret (#277). Unset/empty => sign with PLATFORM_API_SECRET.
      - PORTAL_HMAC_SECRET=${PORTAL_HMAC_SECRET:-}
      # Production refuses to start without it. This stack's Caddy reaches the portal over `web`, so
      # trust that subnet; the env file's PORTAL_TRUSTED_PROXY_CIDRS describes a native Caddy.
      - PORTAL_TRUSTED_PROXY_CIDRS=${PRAHO_WEB_SUBNET:-10.200.250.0/24}
      - PLATFORM_API_ALLOW_INSECURE_HTTP=${PLATFORM_API_ALLOW_INSECURE_HTTP:-true}
      - PLATFORM_TO_PORTAL_WEBHOOK_SECRET=${PLATFORM_TO_PORTAL_WEBHOOK_SECRET:?PLATFORM_TO_PORTAL_WEBHOOK_SECRET required}
      - PLATFORM_DOMAIN=${PLATFORM_DOMAIN:-platform.localhost}
      - PORTAL_DOMAIN=${PORTAL_DOMAIN:-${DOMAIN:-localhost}}
      # PORTAL_DJANGO_SECRET_KEY gives the portal its own key; without it, it shares the platform's.
      - DJANGO_SECRET_KEY=${PORTAL_DJANGO_SECRET_KEY:-${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY required}}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings.prod}
      - ALLOWED_HOSTS=${PORTAL_DOMAIN:-${DOMAIN:-localhost}},localhost,portal
      - CSRF_TRUSTED_ORIGINS=https://${PORTAL_DOMAIN:-${DOMAIN:-localhost}}
      - DJANGO_SECURE_SSL_REDIRECT=false
      - SERVICE_NAME=portal
      - SESSION_DB_PATH=/app/data/portal.sqlite3
      # Server settings (services/portal/gunicorn.conf.py); empty means its default.
      - PORTAL_GUNICORN_WORKER_CLASS=${PORTAL_GUNICORN_WORKER_CLASS:-}
      - PORTAL_GUNICORN_WORKERS=${PORTAL_GUNICORN_WORKERS:-}
      - PORTAL_GUNICORN_THREADS=${PORTAL_GUNICORN_THREADS:-}
    volumes:
      - portal_static:/app/staticfiles
      - portal_logs:/app/logs
      - portal_sessions:/app/data
    depends_on:
      platform:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8701/status/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - web

  # ===========================================================================
  # CADDY - Reverse Proxy with Automatic HTTPS
  # ===========================================================================
  caddy:
    image: caddy:2-alpine
    container_name: praho_caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - PORTAL_DOMAIN=${PORTAL_DOMAIN:-${DOMAIN:-localhost}}
      - PLATFORM_DOMAIN=${PLATFORM_DOMAIN:-platform.localhost}
      # Space-separated CIDRs, never commas. Applies only to the Platform staff site.
      - PLATFORM_ALLOWED_CIDRS=${PLATFORM_ALLOWED_CIDRS:-127.0.0.1/32 ::1/128}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
      # Set but empty would make Caddy send an empty header (HSTS off), so the default is repeated here.
      - HSTS_POLICY=${HSTS_POLICY:-max-age=31536000; includeSubDomains}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - static_files:/srv/static:ro
      - media_files:/srv/media:ro
      - portal_static:/srv/portal-static:ro
    depends_on:
      - platform
      - portal
    restart: unless-stopped
    networks:
      - web

networks:
  internal:
    driver: bridge
  web:
    driver: bridge
    # A known subnet, so the portal can trust its proxy (Caddy) by default. Override PRAHO_WEB_SUBNET
    # if it collides with a network on the host.
    ipam:
      config:
        - subnet: ${PRAHO_WEB_SUBNET:-10.200.250.0/24}

volumes:
  postgres_data:
  static_files:
  media_files:
  logs:
  portal_static:
  portal_logs:
  portal_sessions:
  caddy_data:
  caddy_config:
