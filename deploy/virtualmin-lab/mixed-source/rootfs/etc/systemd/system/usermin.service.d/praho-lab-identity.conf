[Unit]
Requires=lab-node-identity.service
After=lab-node-identity.service

[Service]
# The full vendor stack installs Usermin during image construction. Its frontend
# must use this container's fresh native TLS identity rather than a baked key.
ExecStartPre=/usr/bin/install -o root -g root -m 0600 /etc/webmin/miniserv.pem /etc/usermin/miniserv.pem
