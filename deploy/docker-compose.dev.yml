# ===============================================================================
# PRAHO SERVICES - DEVELOPMENT DOCKER COMPOSE 🛠️
# ===============================================================================
# Development environment with hot reload and debug settings (no Redis). `make docker-dev` runs it.
# The images are the Dockerfiles' `dev` targets: dependencies only, with the source mounted over /app.

services:
  # ===============================================================================
  # DATABASE - POSTGRESQL (DEVELOPMENT) 🗄️
  # ===============================================================================
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: praho_dev
      POSTGRES_USER: praho
      POSTGRES_PASSWORD: praho123
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      # -d: without it pg_isready probes a database named after the user, which does not exist here
      test: ["CMD-SHELL", "pg_isready -U praho -d praho_dev"]
      interval: 15s
      timeout: 3s
      retries: 3

  # ===============================================================================
  # PLATFORM SERVICE - DEVELOPMENT HOT RELOAD 🔥
  # ===============================================================================
  platform:
    build:
      context: ..
      dockerfile: deploy/platform/Dockerfile
      target: dev
    ports:
      - "8700:8700"
    volumes:
      # Hot reload - mount source code
      - ../services/platform:/app:delegated
      # Shared design-system templates and static files, where the settings look for them (ADR-0035)
      - ../shared/ui:/shared/ui:ro
      - dev_static_volume:/app/staticfiles
      - dev_media_volume:/app/media
    environment:
      # `true`, not 1: the settings read DEBUG as .lower() == "true"
      - DEBUG=true
      # config.settings.dev uses SQLite unless told otherwise
      - USE_POSTGRES=true
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=praho_dev
      - DB_USER=praho
      - DB_PASSWORD=praho123
      - DJANGO_SECRET_KEY=dev-secret-key-for-development-only
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - PYTHONPATH=/app
      # Debug-toolbar allowlist for non-loopback dev clients (empty = localhost only)
      - DEV_INTERNAL_IPS=${DEV_INTERNAL_IPS:-}
      - SERVICE_NAME=platform
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py setup_initial_data &&
             python manage.py runserver 0.0.0.0:8700"

  # ===============================================================================
  # PORTAL SERVICE - DEVELOPMENT HOT RELOAD 🌐
  # ===============================================================================
  portal:
    build:
      context: ..
      dockerfile: deploy/portal/Dockerfile
      target: dev
    ports:
      - "8701:8701"
    volumes:
      # Hot reload - mount source code
      - ../services/portal:/app:delegated
      - ../shared/ui:/shared/ui:ro
      - dev_portal_static_volume:/app/staticfiles
      # Session store, kept out of the mounted checkout
      - dev_portal_data:/data
    environment:
      # `true`, not 1: the settings read DEBUG as .lower() == "true"
      - DEBUG=true
      - SESSION_DB_PATH=/data/portal.sqlite3
      - PLATFORM_API_BASE_URL=http://platform:8700/api
      - PLATFORM_API_SECRET=dev-shared-secret-change-in-production
      # Debug-toolbar allowlist for non-loopback dev clients (empty = localhost only)
      - DEV_INTERNAL_IPS=${DEV_INTERNAL_IPS:-}
      # Per-portal signing secret (#277). Unset/empty => sign with PLATFORM_API_SECRET.
      - PORTAL_HMAC_SECRET=${PORTAL_HMAC_SECRET:-}
      # Behind a proxy, use its network subnet, e.g. 172.16.0.0/12 narrowed to the actual subnet.
      - PORTAL_TRUSTED_PROXY_CIDRS=${PORTAL_TRUSTED_PROXY_CIDRS:-}
      - PLATFORM_API_ALLOW_INSECURE_HTTP=true
      - DJANGO_SECRET_KEY=dev-secret-key-for-development-only
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - SERVICE_NAME=portal
    depends_on:
      - platform
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8701"

# ===============================================================================
# DEVELOPMENT VOLUMES 💾
# ===============================================================================
volumes:
  postgres_dev_data:
    name: praho_dev_postgres_data
  dev_static_volume:
    name: praho_dev_static_volume
  dev_media_volume:
    name: praho_dev_media_volume
  dev_portal_static_volume:
    name: praho_dev_portal_static_volume
  dev_portal_data:
    name: praho_dev_portal_data
