# =============================================================================
# PRAHO - CONTAINER SERVICE DEPLOYMENT (DigitalOcean App Platform, etc.)
# =============================================================================
# For managed container services with external database
# Database and SSL handled by the cloud provider
#
# Required environment variables:
#   - DB_HOST, DB_NAME, DB_USER, DB_PASSWORD (managed PostgreSQL)
#   - DJANGO_SECRET_KEY
#   - DOMAIN
#   - PLATFORM_API_BASE_URL (for portal -> platform communication)

services:
  # ===========================================================================
  # PLATFORM SERVICE
  # ===========================================================================
  platform:
    image: ${REGISTRY:-}praho-platform:${VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/platform/Dockerfile
    environment:
      - DEBUG=0
      - DB_HOST=${DB_HOST:?DB_HOST required}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:?DB_NAME required}
      - DB_USER=${DB_USER:?DB_USER required}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD required}
      # Production defaults to sslmode=require; a managed database: keep TLS.
      - DB_SSLMODE=${DB_SSLMODE:-require}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY required}
      - HMAC_SECRET=${PLATFORM_API_SECRET:?PLATFORM_API_SECRET required}
      # Per-portal HMAC registry (#277). Unset => legacy shared-secret behavior (safe default).
      - PORTAL_HMAC_MODE=${PORTAL_HMAC_MODE:-legacy}
      - PORTAL_HMAC_CREDENTIALS=${PORTAL_HMAC_CREDENTIALS:-}
      - PLATFORM_TO_PORTAL_WEBHOOK_SECRET=${PLATFORM_TO_PORTAL_WEBHOOK_SECRET:?PLATFORM_TO_PORTAL_WEBHOOK_SECRET required}
      # Production refuses to start without these two (config/settings/prod.py); the portal never gets them.
      - DJANGO_ENCRYPTION_KEY=${DJANGO_ENCRYPTION_KEY:?DJANGO_ENCRYPTION_KEY required}
      - DJANGO_ENCRYPTION_KEY_PREVIOUS=${DJANGO_ENCRYPTION_KEY_PREVIOUS:-}
      - CREDENTIAL_VAULT_MASTER_KEY=${CREDENTIAL_VAULT_MASTER_KEY:?CREDENTIAL_VAULT_MASTER_KEY required}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings.prod}
      - STATIC_ROOT=/app/staticfiles
      - PLATFORM_DOMAIN=${PLATFORM_DOMAIN:?PLATFORM_DOMAIN required}
      - PORTAL_DOMAIN=${PORTAL_DOMAIN:?PORTAL_DOMAIN required}
      - ALLOWED_HOSTS=${DOMAIN:-localhost},localhost,*.ondigitalocean.app
      - CSRF_TRUSTED_ORIGINS=https://${DOMAIN},https://*.ondigitalocean.app
      - DJANGO_SECURE_SSL_REDIRECT=false
      - SERVICE_NAME=platform
    expose:
      - "8700"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8700/api/users/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      # A first boot runs every migration before Gunicorn listens (124 s measured on a fast machine);
      # failures during the start period don't count, and a passing check ends it early.
      start_period: 600s

  # ===========================================================================
  # PORTAL SERVICE
  # ===========================================================================
  portal:
    image: ${REGISTRY:-}praho-portal:${VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/portal/Dockerfile
    environment:
      - DEBUG=0
      - PLATFORM_API_BASE_URL=${PLATFORM_API_BASE_URL:-http://platform:8700/api}
      - PLATFORM_API_SECRET=${PLATFORM_API_SECRET:?PLATFORM_API_SECRET required}
      # Per-portal signing secret (#277). Unset/empty => sign with PLATFORM_API_SECRET.
      - PORTAL_HMAC_SECRET=${PORTAL_HMAC_SECRET:-}
      # Use the ingress proxy CIDRs; for Compose, e.g. 172.16.0.0/12 narrowed to the actual subnet.
      - PORTAL_TRUSTED_PROXY_CIDRS=${PORTAL_TRUSTED_PROXY_CIDRS:?set PORTAL_TRUSTED_PROXY_CIDRS to your ingress proxy's CIDRs}
      - PLATFORM_API_ALLOW_INSECURE_HTTP=${PLATFORM_API_ALLOW_INSECURE_HTTP:-true}
      - PLATFORM_TO_PORTAL_WEBHOOK_SECRET=${PLATFORM_TO_PORTAL_WEBHOOK_SECRET:?PLATFORM_TO_PORTAL_WEBHOOK_SECRET required}
      - PORTAL_DOMAIN=${DOMAIN:-localhost}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY required}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings.prod}
      - ALLOWED_HOSTS=${DOMAIN:-localhost},localhost,*.ondigitalocean.app
      - CSRF_TRUSTED_ORIGINS=https://${DOMAIN},https://*.ondigitalocean.app
      - DJANGO_SECURE_SSL_REDIRECT=false
      - SERVICE_NAME=portal
      - SESSION_DB_PATH=/app/data/portal.sqlite3
    volumes:
      - portal_sessions:/app/data
    expose:
      - "8701"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8701/status/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  portal_sessions:
