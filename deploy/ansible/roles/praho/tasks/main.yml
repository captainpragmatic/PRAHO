# =============================================================================
# PRAHO - Application Deployment Role
# =============================================================================

# The templates need operator-supplied secrets and domains that nothing in the repo defines
# (praho_required_inputs in defaults/main.yml, by topology). Stop before rendering anything if one is
# missing, and name only the variables: their values are secrets.
- name: Find required role variables that are not set
  set_fact:
    praho_missing_inputs: "{{ (praho_missing_inputs | default([])) + [item] }}"
  loop: "{{ praho_required_inputs }}"
  when: (lookup('vars', item, default='') | string | trim | length) == 0
  no_log: true

- name: Stop if a required role variable is missing
  fail:
    msg: >-
      Set these role variables (inventory group_vars or -e @vars.yml, vault the secrets):
      {{ praho_missing_inputs | join(', ') }}
  when: praho_missing_inputs | default([]) | length > 0

- name: Copy environment file
  template:
    src: env.j2
    dest: "{{ project_root }}/.env"
    owner: "{{ project_user }}"
    group: "{{ project_group }}"
    mode: "0600"

- name: Copy docker-compose file
  template:
    src: docker-compose.yml.j2
    dest: "{{ project_root }}/docker-compose.yml"
    owner: "{{ project_user }}"
    group: "{{ project_group }}"
    mode: "0644"

- name: Copy Caddyfile
  template:
    src: Caddyfile.j2
    dest: "{{ project_root }}/Caddyfile"
    owner: "{{ project_user }}"
    group: "{{ project_group }}"
    mode: "0644"
  when: deploy_caddy

- name: Copy backup script
  template:
    src: backup.sh.j2
    dest: "{{ project_root }}/scripts/backup.sh"
    owner: "{{ project_user }}"
    group: "{{ project_group }}"
    mode: "0755"
  when: deploy_database and backup_enabled

- name: Copy restore script
  template:
    src: restore.sh.j2
    dest: "{{ project_root }}/scripts/restore.sh"
    owner: "{{ project_user }}"
    group: "{{ project_group }}"
    mode: "0755"
  when: deploy_database

- name: Copy rollback script
  template:
    src: rollback.sh.j2
    dest: "{{ project_root }}/scripts/rollback.sh"
    owner: "{{ project_user }}"
    group: "{{ project_group }}"
    mode: "0755"

- name: Pull Docker images
  docker_image:
    name: "{{ item }}"
    source: pull
    force_source: yes
  loop:
    - "postgres:15-alpine"
    - "caddy:2-alpine"
  when: deploy_database or deploy_caddy

- name: Build and start services
  community.docker.docker_compose_v2:
    project_src: "{{ project_root }}"
    state: present
    pull: always
    build: always
  register: compose_result

# The services publish no host ports (only Caddy does), so read each container's own healthcheck.
- name: Wait for the application containers to report healthy
  community.docker.docker_container_info:
    name: "{{ item }}"
  register: praho_container
  until: praho_container.exists and (praho_container.container.State.Health.Status | default('')) == 'healthy'
  retries: 60
  delay: 5
  loop: "{{ (['praho_platform'] if deploy_platform else []) + (['praho_portal'] if deploy_portal else []) }}"

- name: Setup backup cron job
  cron:
    name: "PRAHO database backup"
    minute: "0"
    hour: "2"
    job: "{{ project_root }}/scripts/backup.sh >> {{ project_root }}/logs/backup.log 2>&1"
    user: "{{ project_user }}"
  when: deploy_database and backup_enabled

- name: Display deployment info
  debug:
    msg: |
      ================================================
      PRAHO Deployment Complete!
      ================================================
      Portal:    https://{{ portal_domain }} {{ '(Deployed)' if deploy_portal else '(Not deployed)' }}
      Platform:  https://{{ platform_domain }} {{ '(Deployed)' if deploy_platform else '(Not deployed)' }}
      Database:  {{ 'Deployed' if deploy_database else 'External' }}
      ================================================
