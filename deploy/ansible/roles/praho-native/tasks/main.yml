---
# One native role; responsibilities are selected by inventory membership.
- name: Apply config responsibilities
  ansible.builtin.include_tasks: config.yml
  tags: [always]
- name: Apply Portal state preflight
  ansible.builtin.include_tasks: portal-preflight.yml
  when: native_portal
- name: Apply portal-identity responsibilities
  ansible.builtin.include_tasks: portal-identity.yml
  when: native_portal
- name: Apply shared-runtime responsibilities
  ansible.builtin.include_tasks: shared-runtime.yml
- name: Apply platform-database responsibilities
  ansible.builtin.include_tasks: platform-database.yml
  when: native_platform
- name: Apply shared responsibilities
  ansible.builtin.include_tasks: shared.yml
- name: Apply platform-operator responsibilities
  ansible.builtin.include_tasks: platform-operator.yml
  when: native_platform
- name: Apply platform responsibilities
  ansible.builtin.include_tasks: platform.yml
  when: native_platform
- name: Apply portal responsibilities
  ansible.builtin.include_tasks: portal.yml
  when: native_portal
- name: Apply platform-initial responsibilities
  ansible.builtin.include_tasks: platform-initial.yml
  when: native_platform
- name: Apply edge responsibilities
  ansible.builtin.include_tasks: edge.yml
  tags: [caddy]
- name: Apply services responsibilities
  ansible.builtin.include_tasks: services.yml
- name: Apply platform-backup responsibilities
  ansible.builtin.include_tasks: platform-backup.yml
  when: native_platform
- name: Apply portal-cleanup responsibilities
  ansible.builtin.include_tasks: portal-cleanup.yml
  when: native_portal
- name: Apply verify responsibilities
  ansible.builtin.include_tasks: verify.yml
- name: Apply logs responsibilities
  ansible.builtin.include_tasks: logs.yml
