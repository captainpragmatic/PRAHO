# =============================================================================
# PRAHO Native Deployment Role
# =============================================================================
# Deploys PRAHO directly on the host with PostgreSQL + uv + systemd + Caddy.
# No Docker required.
#
# The .env file is the single source of truth for all configuration.
# Ansible reads it locally, copies it to the server, then uses its values.

# ---------------------------------------------------------------------------
# 0. Parse .env file for use throughout this role
# ---------------------------------------------------------------------------

# Refuse a .env whose comments would become part of values (see env_preflight.yml).
- name: Reject inline comments in the .env file
  include_tasks: env_preflight.yml

- name: Read .env file locally for role variables
  set_fact:
    native_configuration: "{{ lookup('native_env', env_file_path) }}"
  no_log: true

- name: Parse .env vars for role use
  set_fact:
    deployed_env: "{{ native_configuration['env'] }}"
  no_log: true

# Existing hosts must move their session store while stopped before changing identities.
- name: Inspect legacy Portal session store
  stat:
    path: "{{ deployed_env.SESSION_DB_PATH | default(project_root + '/src/services/portal/portal.sqlite3') }}"
  register: legacy_portal_session

- name: Require explicit Portal state migration on existing hosts
  assert:
    that:
      - not legacy_portal_session.stat.exists or (deployed_env.SESSION_DB_PATH | default('')) == portal_state_directory + '/portal.sqlite3'
      - (deployed_env.SESSION_DB_PATH | default(portal_state_directory + '/portal.sqlite3')) == portal_state_directory + '/portal.sqlite3'
    fail_msg: "Move Portal state while stopped and set SESSION_DB_PATH as described in docs/deployment/DEPLOYMENT.md before changing its OS identity."

- name: Inspect existing Portal log ownership
  find:
    paths: /var/log/praho/portal
    recurse: false
    file_type: any
    hidden: true
  register: legacy_portal_logs

- name: Require explicit Portal log migration on existing hosts
  assert:
    that:
      - legacy_portal_logs.files | rejectattr('pw_name', 'equalto', portal_user) | list | length == 0
      - not legacy_portal_session.stat.exists or legacy_portal_session.stat.pw_name == portal_user
    fail_msg: "Stop Portal and migrate its session/log ownership according to docs/deployment/DEPLOYMENT.md before deploying the isolated identity."

- name: Create isolated Portal group
  group:
    name: "{{ portal_group }}"
    system: true

- name: Create isolated Portal user
  user:
    name: "{{ portal_user }}"
    group: "{{ portal_group }}"
    system: true
    create_home: false
    home: "{{ portal_state_directory }}"
    shell: /usr/sbin/nologin

- name: Create private Portal writable directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ portal_user }}"
    group: "{{ portal_group }}"
    mode: "0700"
  loop:
    - "{{ portal_state_directory }}"
    - /var/log/praho/portal

# ---------------------------------------------------------------------------
# 1. PostgreSQL 16
# ---------------------------------------------------------------------------

# Inspect registered clusters before installing a new major or changing any database settings.
- name: Detect existing PostgreSQL cluster tool
  stat:
    path: /usr/bin/pg_lsclusters
  register: postgres_cluster_tool

- name: Inspect registered PostgreSQL clusters
  command: /usr/bin/pg_lsclusters --no-header
  register: postgres_clusters
  changed_when: false
  when: postgres_cluster_tool.stat.exists

- name: Record existing PostgreSQL major versions
  set_fact:
    postgres_major_versions: "{{ postgres_clusters.stdout_lines | default([]) | map('split') | map('first') | map('int') | list }}"

- name: Refuse implicit native PostgreSQL major upgrades
  assert:
    that:
      - postgres_major_versions | reject('equalto', 16) | list | length == 0
      - (deployed_env.DB_PORT | default('5432') | string) == '5432'
    fail_msg: "Native deployment targets PostgreSQL 16 on port 5432. Migrate and retire legacy clusters explicitly first; see docs/deployment/POSTGRESQL_16_UPGRADE.md."

- name: Create keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download PostgreSQL GPG key
  get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /etc/apt/keyrings/postgresql.asc
    mode: "0644"

- name: Add PostgreSQL APT repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/postgresql.asc] http://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
    state: present

- name: Install PostgreSQL 16
  apt:
    name:
      - postgresql-16
      - postgresql-client-16
      - libpq-dev
    state: present
    update_cache: yes

- name: Ensure PostgreSQL is started and enabled
  service:
    name: postgresql
    state: started
    enabled: yes

- name: Install psycopg for Ansible PostgreSQL modules
  apt:
    name: python3-psycopg
    state: present

- name: Create PostgreSQL user
  no_log: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ deployed_env.DB_USER | default('praho') }}"
    password: "{{ deployed_env.DB_PASSWORD }}"
    role_attr_flags: CREATEDB
    state: present

- name: Create PostgreSQL database
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ deployed_env.DB_NAME | default('praho') }}"
    owner: "{{ deployed_env.DB_USER | default('praho') }}"
    encoding: UTF-8
    lc_collate: en_US.UTF-8
    lc_ctype: en_US.UTF-8
    state: present

# ---------------------------------------------------------------------------
# 2. Python 3.13 + build dependencies
# ---------------------------------------------------------------------------

- name: Install prerequisites for deadsnakes PPA
  apt:
    name:
      - software-properties-common
      - acl
    state: present

- name: Add deadsnakes PPA
  apt_repository:
    repo: "ppa:deadsnakes/ppa"
    state: present

- name: Install Python {{ python_version }} and build dependencies
  apt:
    name:
      - "python{{ python_version }}"
      - "python{{ python_version }}-dev"
      - "python{{ python_version }}-venv"
      - build-essential
      - gettext
    state: present
    update_cache: yes

# ---------------------------------------------------------------------------
# 3. uv package manager
# ---------------------------------------------------------------------------

- name: Install uv
  shell: curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh
  args:
    creates: /usr/local/bin/uv

- name: Verify uv is available
  command: /usr/local/bin/uv --version
  changed_when: false

# ---------------------------------------------------------------------------
# 4. Code deployment
# ---------------------------------------------------------------------------

- name: Create source directory
  file:
    path: "{{ project_root }}/src"
    state: directory
    owner: "{{ project_user }}"
    group: "{{ project_group }}"
    mode: "0755"

- name: Create static, media, and log directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ project_user }}"
    group: "{{ project_group }}"
    mode: "0755"
  loop:
    - "{{ project_root }}/static"
    - "{{ project_root }}/portal-static"
    - "{{ project_root }}/media"
    - "{{ project_root }}/logs"
    - /var/log/praho

- name: Install logrotate
  apt:
    name: logrotate
    state: present

- name: Deploy code via rsync
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../../../"
    dest: "{{ project_root }}/src/"
    delete: yes
    rsync_opts:
      - "--exclude=.git"
      # Controller/lab state and saved plans can contain credentials; never ship them as code.
      - "--exclude=.terraform"
      - "--exclude=.state"
      - "--exclude=*.tfstate"
      - "--exclude=*.tfstate.*"
      - "--exclude=*.tfplan"
      - "--exclude=*.tfvars"
      - "--exclude=*.tfvars.json"
      - "--exclude=.venv"
      - "--exclude=.venv-darwin"
      - "--exclude=.venv-linux"
      - "--exclude=__pycache__"
      - "--exclude=node_modules"
      - "--exclude=*.pyc"
      - "--exclude=.env"
      - "--exclude=.env.*"
      - "--exclude=.envrc"
      - "--exclude=db.sqlite3"
      # Database dumps: the checkout's backups/ (deploy/scripts/backup.sh) and any stray one.
      - "--exclude=/backups/"
      - "--exclude=praho_backup_*"
      - "--exclude=.mypy_cache"
      - "--exclude=.pytest_cache"
      - "--exclude=htmlcov"
      - "--exclude=.ruff_cache"
      - "--exclude=.vscode"
      - "--exclude=.idea"
  when: deploy_method == 'rsync'
  notify:
    - restart praho-platform
    - restart praho-portal
    - restart praho-qcluster

- name: Deploy code via git
  git:
    repo: "{{ praho_git_repo }}"
    dest: "{{ project_root }}/src"
    version: "{{ deploy_git_version }}"
    force: yes
  become_user: "{{ project_user }}"
  when: deploy_method == 'git'
  notify:
    - restart praho-platform
    - restart praho-portal
    - restart praho-qcluster

- name: Get deployed git SHA
  command: git rev-parse --short HEAD
  args:
    chdir: "{{ project_root }}/src"
  register: deployed_sha
  changed_when: false
  when: deploy_method == 'git'
  become_user: "{{ project_user }}"

- name: Set source ownership
  file:
    path: "{{ project_root }}/src"
    owner: "{{ project_user }}"
    group: "{{ project_group }}"
    recurse: yes

# ---------------------------------------------------------------------------
# 5. Virtual environment + dependencies
# ---------------------------------------------------------------------------

- name: Create virtualenv with uv
  command: >
    /usr/local/bin/uv venv
    --python python{{ python_version }}
    {{ project_root }}/.venv-linux
  args:
    creates: "{{ project_root }}/.venv-linux/bin/python"
  become_user: "{{ project_user }}"

- name: Install dependencies with uv
  command: >
    /usr/local/bin/uv sync
    --group platform
    --group prod
    --frozen
  args:
    chdir: "{{ project_root }}/src"
  become_user: "{{ project_user }}"
  environment:
    UV_PROJECT_ENVIRONMENT: "{{ project_root }}/.venv-linux"

# ---------------------------------------------------------------------------
# 6. Environment file (.env as single source of truth)
# ---------------------------------------------------------------------------

- name: Create read-only runtime Ansible collection directory
  file:
    path: /opt/praho-ansible/collections
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install pinned runtime Ansible collections
  command: >-
    {{ project_root }}/.venv-linux/bin/ansible-galaxy collection install
    -r {{ project_root }}/src/services/platform/infrastructure/ansible/requirements.yml
    -p /opt/praho-ansible/collections
  environment:
    ANSIBLE_LOCAL_TEMP: /tmp
  register: runtime_collections
  changed_when: "'Installing' in runtime_collections.stdout"

- name: Install runtime OpenSSH client tools
  apt:
    name: openssh-client
    state: present

- name: Validate .env file exists locally
  stat:
    path: "{{ env_file_path }}"
  delegate_to: localhost
  become: false
  register: env_file_check

- name: Fail if .env file not found
  fail:
    msg: >
      Environment file not found at {{ env_file_path }}.
      Copy .env.example.{{ praho_env }} to .env.{{ praho_env }} and fill in values.
      See docs/deployment/DEPLOYMENT.md for details.
  when: not env_file_check.stat.exists

- name: Copy environment file to server
  copy:
    content: "{{ native_configuration['systemd'] }}"
    dest: "{{ project_root }}/.env"
    owner: "{{ project_user }}"
    group: "{{ project_group }}"
    mode: "0600"
  no_log: true
  diff: false
  notify:
    - restart praho-platform
    - restart praho-portal
    - restart praho-qcluster

- name: Create private credential directory
  file:
    path: "{{ project_root }}/credentials"
    state: directory
    owner: "{{ project_user }}"
    group: "{{ project_group }}"
    mode: "0700"

- name: Install private PostgreSQL passfile for unattended backups
  copy:
    content: "{{ native_configuration['pgpass'] }}"
    dest: "{{ project_root }}/credentials/postgresql.pgpass"
    owner: "{{ project_user }}"
    group: "{{ project_group }}"
    mode: "0600"
  no_log: true
  diff: false

# deployed_env is already set from step 0 (parsed from local .env file)

# ---------------------------------------------------------------------------
# 7. Django setup
# ---------------------------------------------------------------------------

# migrate and collectstatic run with this environment, not the services' EnvironmentFile, and production
# settings don't load the .env, so pass the keys production refuses to import without. Only those the
# .env defines are passed, so a staging environment is unchanged.
- name: Set Django environment variables from .env file
  no_log: true
  set_fact:
    django_env: "{{ praho_django_env_base | combine(deployed_env | dict2items | selectattr('key', 'in', praho_passthrough) | items2dict) }}"
  vars:
    praho_passthrough:
      - PLATFORM_TO_PORTAL_WEBHOOK_SECRET
      - DJANGO_ENCRYPTION_KEY
      - DJANGO_ENCRYPTION_KEY_PREVIOUS
      - CREDENTIAL_VAULT_MASTER_KEY
      - COMPANY_NAME
      - COMPANY_CUI
      - COMPANY_COUNTRY_CODE
      - TIME_ZONE
      - BRAND_DIR
      # The services already read it through EnvironmentFile; this keeps the deploy-time
      # commands from running with its default of true on a host that switched ANAF off.
      - ANAF_TRANSPORT_ENABLED
      # Deploy-time commands write audit rows too; their session digests must use the same key.
      - AUDIT_SESSION_DIGEST_SECRET
    praho_django_env_base:
      PYTHONPATH: "{{ project_root }}/src/services/platform"
      DJANGO_SETTINGS_MODULE: "{{ django_settings_module }}"
      # Read all vars from the deployed .env file
      DB_NAME: "{{ deployed_env.DB_NAME | default('praho') }}"
      DB_USER: "{{ deployed_env.DB_USER | default('praho') }}"
      DB_PASSWORD: "{{ deployed_env.DB_PASSWORD }}"
      DB_HOST: "{{ deployed_env.DB_HOST | default('localhost') }}"
      DB_PORT: "{{ deployed_env.DB_PORT | default('5432') }}"
      DB_SSLMODE: "{{ deployed_env.DB_SSLMODE | default('disable') }}"
      DJANGO_SECRET_KEY: "{{ deployed_env.DJANGO_SECRET_KEY }}"
      HMAC_SECRET: "{{ deployed_env.HMAC_SECRET | default('') }}"
      PLATFORM_API_SECRET: "{{ deployed_env.PLATFORM_API_SECRET | default(deployed_env.HMAC_SECRET | default('')) }}"
      STATIC_ROOT: "{{ project_root }}/static"
      MEDIA_ROOT: "{{ project_root }}/media"
      ALLOWED_HOSTS: "{{ deployed_env.PORTAL_DOMAIN }},{{ deployed_env.PLATFORM_DOMAIN }},localhost,127.0.0.1"
      PORTAL_DOMAIN: "{{ deployed_env.PORTAL_DOMAIN }}"
      PLATFORM_DOMAIN: "{{ deployed_env.PLATFORM_DOMAIN }}"
      DJANGO_SECURE_SSL_REDIRECT: "{{ deployed_env.DJANGO_SECURE_SSL_REDIRECT | default('false') }}"

- name: Run database migrations
  no_log: true
  command: >
    {{ project_root }}/.venv-linux/bin/python manage.py migrate --noinput
  args:
    chdir: "{{ project_root }}/src/services/platform"
  become_user: "{{ project_user }}"
  environment: "{{ django_env }}"

- name: Create database cache table
  no_log: true
  command: >
    {{ project_root }}/.venv-linux/bin/python manage.py createcachetable
  args:
    chdir: "{{ project_root }}/src/services/platform"
  become_user: "{{ project_user }}"
  environment: "{{ django_env }}"
  failed_when: false

- name: Collect Platform static files
  no_log: true
  command: >
    {{ project_root }}/.venv-linux/bin/python manage.py collectstatic --noinput
  args:
    chdir: "{{ project_root }}/src/services/platform"
  become_user: "{{ project_user }}"
  environment: "{{ django_env }}"

- name: Set Portal Django environment
  no_log: true
  set_fact:
    portal_django_env: "{{ praho_portal_env_base | combine(deployed_env | dict2items | selectattr('key', 'in', praho_passthrough) | items2dict) }}"
  vars:
    # Production portal settings refuse to import without it (see the platform task above).
    praho_passthrough:
      - PLATFORM_TO_PORTAL_WEBHOOK_SECRET
      - PORTAL_GUNICORN_WORKER_CLASS
      - PORTAL_GUNICORN_WORKERS
      - PORTAL_GUNICORN_THREADS
      - PORTAL_ID
      - PORTAL_HMAC_SECRET
      - PLATFORM_API_TIMEOUT
      - PLATFORM_API_TOTAL_BUDGET_SECONDS
      - PLATFORM_API_AUTH_MIN_DURATION_SECONDS
      - CSP_PROFILE
      - CSP_REPORT_ONLY
      - DJANGO_LOG_LEVEL
      - TIME_ZONE
      - BRAND_DIR
    praho_portal_env_base:
      PYTHONPATH: "{{ project_root }}/src/services/portal"
      DJANGO_SETTINGS_MODULE: "{{ django_settings_module }}"
      DJANGO_SECRET_KEY: "{{ deployed_env.PORTAL_DJANGO_SECRET_KEY }}"
      ALLOWED_HOSTS: "{{ deployed_env.PORTAL_DOMAIN }},localhost,127.0.0.1"
      PORTAL_DOMAIN: "{{ deployed_env.PORTAL_DOMAIN }}"
      PLATFORM_API_BASE_URL: "http://localhost:{{ platform_port }}/api"
      PLATFORM_API_ALLOW_INSECURE_HTTP: "true"
      DJANGO_SECURE_SSL_REDIRECT: "false"
      PLATFORM_API_SECRET: "{{ deployed_env.PLATFORM_API_SECRET | default(deployed_env.HMAC_SECRET | default('')) }}"
      STATIC_ROOT: "{{ project_root }}/portal-static"
      PORTAL_LOG_DIR: /var/log/praho/portal
      SESSION_DB_PATH: "{{ portal_state_directory + '/portal.sqlite3' }}"
      PORTAL_TRUSTED_PROXY_CIDRS: "{{ deployed_env.PORTAL_TRUSTED_PROXY_CIDRS | default('127.0.0.1/32,::1/128') }}"

- name: Install filtered Portal runtime environment
  copy:
    content: "{{ portal_django_env | native_systemd_env }}"
    dest: "{{ project_root }}/.portal.env"
    owner: root
    group: "{{ portal_group }}"
    mode: "0640"
  no_log: true
  diff: false
  notify: restart praho-portal

- name: Create Portal database directory
  file:
    path: "{{ portal_django_env.SESSION_DB_PATH | dirname }}"
    state: directory
    owner: "{{ portal_user }}"
    group: "{{ portal_group }}"
    mode: "0700"

- name: Run Portal migrations
  no_log: true
  command:
    argv:
      - "{{ project_root }}/.venv-linux/bin/python"
      - manage.py
      - migrate
      - "{{ item }}"
      - --noinput
  loop:
    - sessions
    - common
  args:
    chdir: "{{ project_root }}/src/services/portal"
  become_user: "{{ portal_user }}"
  environment: "{{ portal_django_env }}"

- name: Check Portal deployment
  no_log: true
  command: "{{ project_root }}/.venv-linux/bin/python manage.py check --deploy --fail-level ERROR"
  args:
    chdir: "{{ project_root }}/src/services/portal"
  become_user: "{{ portal_user }}"
  environment: "{{ portal_django_env }}"
  changed_when: false

- name: Collect Portal static files
  no_log: true
  command: "{{ project_root }}/.venv-linux/bin/python manage.py collectstatic --noinput"
  args:
    chdir: "{{ project_root }}/src/services/portal"
  become_user: "{{ project_user }}"
  environment: "{{ portal_django_env }}"

- name: Set up initial data (categories, settings, tasks, templates, superuser)
  no_log: true
  command: >
    {{ project_root }}/.venv-linux/bin/python manage.py setup_initial_data
  args:
    chdir: "{{ project_root }}/src/services/platform"
  become_user: "{{ project_user }}"
  environment: "{{ django_env }}"

# ---------------------------------------------------------------------------
# 8. Caddy reverse proxy
# ---------------------------------------------------------------------------

- name: Install Caddy APT prerequisites
  apt:
    name:
      - debian-keyring
      - debian-archive-keyring
      - apt-transport-https
    state: present

- name: Add Caddy GPG key
  shell: curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  args:
    creates: /usr/share/keyrings/caddy-stable-archive-keyring.gpg

- name: Add Caddy APT repository
  shell: curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list
  args:
    creates: /etc/apt/sources.list.d/caddy-stable.list

- name: Install Caddy
  apt:
    name: caddy
    state: present
    update_cache: yes

- name: Create Caddy log directory
  file:
    path: /var/log/caddy
    state: directory
    owner: caddy
    group: caddy
    mode: "0755"

- name: Create Caddy log files with correct ownership
  file:
    path: "/var/log/caddy/{{ item }}"
    state: touch
    owner: caddy
    group: caddy
    mode: "0644"
    modification_time: preserve
    access_time: preserve
  loop:
    - portal-access.log
    - platform-access.log

- name: Template Caddyfile
  template:
    src: Caddyfile.native.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: "0644"
    validate: "caddy validate --config %s --adapter caddyfile"
  notify: restart caddy

# ---------------------------------------------------------------------------
# 9. Systemd services
# ---------------------------------------------------------------------------

- name: Template praho-platform systemd unit
  template:
    src: praho-platform.service.j2
    dest: /etc/systemd/system/praho-platform.service
    mode: "0644"
  notify:
    - systemd daemon-reload
    - restart praho-platform

- name: Template praho-portal systemd unit
  template:
    src: praho-portal.service.j2
    dest: /etc/systemd/system/praho-portal.service
    mode: "0644"
  notify:
    - systemd daemon-reload
    - restart praho-portal

- name: Template praho-qcluster systemd unit
  template:
    src: praho-qcluster.service.j2
    dest: /etc/systemd/system/praho-qcluster.service
    mode: "0644"
  notify:
    - systemd daemon-reload
    - restart praho-qcluster

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes

- name: Enable and start PRAHO services
  systemd:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - praho-platform
    - praho-portal
    - praho-qcluster

- name: Enable and start Caddy
  systemd:
    name: caddy
    state: started
    enabled: yes

# ---------------------------------------------------------------------------
# 10. Backup and utility scripts
# ---------------------------------------------------------------------------

- name: Template backup script
  template:
    src: backup-native.sh.j2
    dest: "{{ project_root }}/scripts/backup.sh"
    owner: "{{ project_user }}"
    group: "{{ project_group }}"
    mode: "0700"
  diff: false
  when: backup_enabled

- name: Template restore script
  template:
    src: restore-native.sh.j2
    dest: "{{ project_root }}/scripts/restore.sh"
    owner: "{{ project_user }}"
    group: "{{ project_group }}"
    mode: "0700"
  diff: false

- name: Template health check script
  template:
    src: health-check.sh.j2
    dest: "{{ project_root }}/scripts/health-check.sh"
    owner: "{{ project_user }}"
    group: "{{ project_group }}"
    mode: "0755"

- name: Setup backup cron job
  cron:
    name: "PRAHO database backup"
    minute: "0"
    hour: "2"
    job: "{{ project_root }}/scripts/backup.sh >> {{ project_root }}/logs/backup.log 2>&1"
    user: "{{ project_user }}"
  when: backup_enabled

- name: Setup Portal counter cull cron job
  cron:
    name: "PRAHO Portal counter cull"
    minute: "30"
    hour: "2"
    job: >-
      cd {{ project_root }}/src/services/portal &&
      set -a && . {{ project_root }}/.portal.env && set +a &&
      SESSION_DB_PATH={{ portal_django_env.SESSION_DB_PATH }}
      PYTHONPATH={{ project_root }}/src/services/portal
      DJANGO_SETTINGS_MODULE={{ django_settings_module }}
      {{ project_root }}/.venv-linux/bin/python manage.py cull_counters
      >> /var/log/praho/portal/cull.log 2>&1
    user: "{{ portal_user }}"

# ---------------------------------------------------------------------------
# 11. Health check
# ---------------------------------------------------------------------------

- name: Wait for platform to be healthy
  uri:
    url: "http://localhost:{{ platform_port }}/api/users/health/"
    status_code: 200
    follow_redirects: none
  register: platform_health
  until: platform_health.status == 200
  retries: 30
  delay: 5

- name: Wait for portal to respond
  uri:
    url: "http://localhost:{{ portal_port }}/billing/"
    status_code:
      - 200
      - 302
    follow_redirects: none
  register: portal_health
  until: portal_health.status in [200, 302]
  retries: 15
  delay: 5

- name: Display deployment info
  debug:
    msg: |
      ================================================
      PRAHO Native Deployment Complete!
      ================================================
      Portal:    https://{{ deployed_env.PORTAL_DOMAIN }}
      Platform:  https://{{ deployed_env.PLATFORM_DOMAIN }}
      Local:     http://localhost:{{ platform_port }} / http://localhost:{{ portal_port }}
      Q-Cluster: service enabled (verify actual queued work separately)
      Database:  PostgreSQL 16 (localhost:{{ deployed_env.DB_PORT | default('5432') }})
      Method:    {{ deploy_method }}
      Version:   {{ deploy_git_version + ' (' + deployed_sha.stdout + ')' if deploy_method == 'git' else 'rsync (local)' }}
      Env file:  {{ env_file_path }}
      ================================================
      Useful commands:
        systemctl status praho-platform praho-portal praho-qcluster
        journalctl -u praho-platform -f
        {{ project_root }}/scripts/health-check.sh
        {{ project_root }}/scripts/backup.sh
      ================================================

# ---------------------------------------------------------------------------
# 12. Log rotation: policies, old backups and the hourly timer (after every writer has restarted)
# ---------------------------------------------------------------------------

# Restart anything the deploy notified now: a process still running the old in-process rotation
# could be writing to a backup that the next task compresses and unlinks.
- name: Restart the services on the new code before touching their log backups
  meta: flush_handlers

# The rotation policies, the handover of old backups and the hourly timer come only now, once
# every writer runs the new handlers: logrotate moving a file under a process that still rotates
# in process would recreate the race, and restarting the timer triggers a run immediately.
- name: Keep logrotate idle while the policies and the backup handover change
  systemd:
    name: logrotate.timer
    state: stopped
  failed_when: false  # a host without the timer yet has nothing to stop

- name: Rotate the portal's log files (the portal never rotates them itself)
  template:
    src: praho-portal.logrotate.j2
    dest: /etc/logrotate.d/praho-portal
    owner: root
    group: root
    mode: "0644"

- name: Rotate Platform's log files (Platform never rotates them itself)
  template:
    src: praho-platform.logrotate.j2
    dest: /etc/logrotate.d/praho-platform
    owner: root
    group: root
    mode: "0644"

# Upgrading from in-process rotation leaves plain app.log.2 .. app.log.N (Platform's and the
# portal's). logrotate's compress + delaycompress manages .1 plain and .2 onwards as .gz, so plain
# leftovers would never expire. Compress them once so logrotate takes them over; .1 stays plain.
# If a .gz of the same name already exists (logrotate rotated before this ran), the old backup is
# appended to it as a second gzip member: zcat reads both, and no history is overwritten.
# logrotate only removes the one backup just past its count, so the portal's older backups beyond
# its 14 (its error.log used to keep 30) are removed here, as its policy says; Platform's policy
# keeps the counts the in-process rotation had.
# As the service user, not root: the directory is the service's, so root following a link planted
# there (an app.log.2.gz pointing at a system file) would write through it.
- name: Hand log backups left by in-process rotation over to logrotate
  become: yes
  become_user: "{{ item.user }}"
  shell: |
    set -eu
    find "{{ item.path }}" -maxdepth 1 -type f -regextype posix-extended \
      -regex '.*/[a-z]+\.log\.([2-9]|[1-9][0-9]+)' |
      while IFS= read -r backup; do
        if [ -e "$backup.gz" ]; then
          gzip -c -- "$backup" >> "$backup.gz"
          rm -- "$backup"
        else
          gzip -- "$backup"
        fi
        echo "$backup"
      done
    if [ "{{ item.portal }}" = "yes" ]; then
      find "{{ item.path }}" -maxdepth 1 -type f -regextype posix-extended \
      -regex '.*/[a-z]+\.log\.(1[5-9]|[2-9][0-9]|[1-9][0-9][0-9]+)\.gz' -print -delete
    fi
  loop:
    - {path: /var/log/praho, user: "{{ project_user }}", portal: "no"}
    - {path: /var/log/praho/portal, user: "{{ portal_user }}", portal: "yes"}
  register: legacy_log_backups
  changed_when: legacy_log_backups.stdout | length > 0

# logrotate checks the policy's maxsize only when it runs, which is daily by default: run it hourly
# so a busy portal's logs are rotated soon after they pass 50M. Daily and weekly policies elsewhere
# still rotate on their own schedule; only size checks happen more often.
- name: Create the logrotate timer drop-in directory
  file:
    path: /etc/systemd/system/logrotate.timer.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Run logrotate hourly
  copy:
    dest: /etc/systemd/system/logrotate.timer.d/praho-hourly.conf
    content: |
      # Generated by Ansible - DO NOT EDIT
      [Timer]
      OnCalendar=
      OnCalendar=hourly
    owner: root
    group: root
    mode: "0644"
  register: logrotate_hourly

- name: Apply the hourly logrotate schedule
  systemd:
    name: logrotate.timer
    daemon_reload: yes
    enabled: yes
    state: restarted
  when: logrotate_hourly.changed

- name: Start logrotate again
  systemd:
    name: logrotate.timer
    enabled: yes
    state: started
