---
- name: Set Portal Django environment
  no_log: true
  set_fact:
    portal_django_env: "{{ praho_portal_env_base | combine(deployed_env | dict2items | selectattr('key', 'in', praho_passthrough) | items2dict) }}"
  vars:
    # Production portal settings refuse to import without it (see the platform task above).
    praho_passthrough:
      - PLATFORM_TO_PORTAL_WEBHOOK_SECRET
      - PORTAL_GUNICORN_WORKER_CLASS
      - PORTAL_GUNICORN_WORKERS
      - PORTAL_GUNICORN_THREADS
      - PORTAL_ID
      - PORTAL_HMAC_SECRET
      - CUSTOMER_VIEW_ENABLED
      - PLATFORM_PUBLIC_ORIGIN
      - PLATFORM_DOMAIN
      - PLATFORM_API_TIMEOUT
      - PLATFORM_API_TOTAL_BUDGET_SECONDS
      - PLATFORM_API_AUTH_MIN_DURATION_SECONDS
      - CSP_PROFILE
      - CSP_REPORT_ONLY
      - DJANGO_LOG_LEVEL
      - TIME_ZONE
      - BRAND_DIR
      - CROWDSEC_AUTH_EVENTS_ENABLED
      - CROWDSEC_AUTH_PSEUDONYM_KEY
      - CROWDSEC_AUTH_LOG_PATH
    praho_portal_env_base:
      PYTHONPATH: "{{ project_root }}/src/services/portal"
      DJANGO_SETTINGS_MODULE: "{{ django_settings_module }}"
      DJANGO_SECRET_KEY: "{{ deployed_env.PORTAL_DJANGO_SECRET_KEY }}"
      ALLOWED_HOSTS: "{{ deployed_env.PORTAL_DOMAIN }},localhost,127.0.0.1"
      PORTAL_DOMAIN: "{{ deployed_env.PORTAL_DOMAIN }}"
      PLATFORM_API_BASE_URL: "{{ deployed_env.PLATFORM_API_BASE_URL if native_topology == 'split' else 'http://127.0.0.1:' + platform_port | string + '/api' }}"
      PLATFORM_API_ALLOW_INSECURE_HTTP: "{{ 'false' if native_topology == 'split' else 'true' }}"
      DJANGO_SECURE_SSL_REDIRECT: "false"
      PLATFORM_API_SECRET: "{{ deployed_env.PLATFORM_API_SECRET | default(deployed_env.HMAC_SECRET | default('')) }}"
      STATIC_ROOT: "{{ project_root }}/portal-static"
      PORTAL_LOG_DIR: /var/log/praho/portal
      CROWDSEC_AUTH_LOG_PATH: /var/log/praho/portal/portal-auth.jsonl
      SESSION_DB_PATH: "{{ portal_state_directory + '/portal.sqlite3' }}"
      PORTAL_TRUSTED_PROXY_CIDRS: "{{ deployed_env.PORTAL_TRUSTED_PROXY_CIDRS | default('127.0.0.1/32,::1/128') }}"

- name: Require the qualified Portal authentication log path
  assert:
    that:
      - >-
        (portal_django_env.CROWDSEC_AUTH_EVENTS_ENABLED | default('false') | lower != 'true')
        or portal_django_env.CROWDSEC_AUTH_LOG_PATH == '/var/log/praho/portal/portal-auth.jsonl'
    fail_msg: Enabled native detection requires the qualified Portal authentication log path /var/log/praho/portal/portal-auth.jsonl
    quiet: true

- name: Install filtered Portal runtime environment
  copy:
    content: "{{ portal_django_env | native_systemd_env }}"
    dest: "{{ project_root }}/.portal.env"
    owner: root
    group: "{{ portal_group }}"
    mode: "0640"
  no_log: true
  diff: false
  notify: restart praho-portal

- name: Create Portal database directory
  file:
    path: "{{ portal_django_env.SESSION_DB_PATH | dirname }}"
    state: directory
    owner: "{{ portal_user }}"
    group: "{{ portal_group }}"
    mode: "0700"

- name: Run Portal migrations
  no_log: true
  command:
    argv:
      - /usr/local/lib/praho/native_exec.sh
      - "{{ project_root }}/.portal.env"
      - --
      - "{{ project_root }}/.venv-linux/bin/python"
      - manage.py
      - migrate
      - "{{ item }}"
      - --noinput
  loop:
    - sessions
    - common
  args:
    chdir: "{{ project_root }}/src/services/portal"
  become_user: "{{ portal_user }}"

- name: Check Portal deployment
  no_log: true
  command: "/usr/local/lib/praho/native_exec.sh {{ project_root }}/.portal.env -- {{ project_root }}/.venv-linux/bin/python manage.py check --deploy --fail-level ERROR"
  args:
    chdir: "{{ project_root }}/src/services/portal"
  become_user: "{{ portal_user }}"
  changed_when: false

- name: Install private filtered Portal build environment
  copy:
    content: "{{ portal_django_env | combine({'PORTAL_LOG_DIR': ''}) | native_systemd_env }}"
    dest: "{{ project_root }}/.portal-static.env"
    owner: "{{ project_user }}"
    group: "{{ project_group }}"
    mode: '0600'
  no_log: true
  diff: false

- name: Collect Portal static files
  no_log: true
  command: "/usr/local/lib/praho/native_exec.sh {{ project_root }}/.portal-static.env -- {{ project_root }}/.venv-linux/bin/python manage.py collectstatic --noinput"
  args:
    chdir: "{{ project_root }}/src/services/portal"
  become_user: "{{ project_user }}"
  # Static assets belong to the project user, who cannot write Portal's private
  # log directory. Keep this build command on the console; runtime stays private.

- name: Remove the temporary Portal build environment
  file:
    path: "{{ project_root }}/.portal-static.env"
    state: absent
