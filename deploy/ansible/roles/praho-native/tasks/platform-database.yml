---
- name: Detect existing PostgreSQL cluster tool
  stat:
    path: /usr/bin/pg_lsclusters
  register: postgres_cluster_tool

- name: Inspect registered PostgreSQL clusters
  command: /usr/bin/pg_lsclusters --no-header
  register: postgres_clusters
  changed_when: false
  when: postgres_cluster_tool.stat.exists

- name: Record existing PostgreSQL major versions
  set_fact:
    postgres_major_versions: "{{ postgres_clusters.stdout_lines | default([]) | map('split') | map('first') | map('int') | list }}"

- name: Refuse implicit native PostgreSQL major upgrades
  assert:
    that:
      - postgres_major_versions | reject('equalto', 16) | list | length == 0
      - (deployed_env.DB_PORT | default('5432') | string) == '5432'
    fail_msg: "Native deployment targets PostgreSQL 16 on port 5432. Migrate and retire legacy clusters explicitly first; see docs/deployment/POSTGRESQL_16_UPGRADE.md."

- name: Create keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download PostgreSQL GPG key
  get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /etc/apt/keyrings/postgresql.asc
    mode: "0644"

- name: Add PostgreSQL APT repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/postgresql.asc] https://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
    state: present

- name: Install PostgreSQL 16
  apt:
    name:
      - postgresql-16
      - postgresql-client-16
      - libpq-dev
    state: present
    update_cache: yes

- name: Ensure PostgreSQL is started and enabled
  service:
    name: postgresql
    state: started
    enabled: yes

- name: Install psycopg for Ansible PostgreSQL modules
  apt:
    name: python3-psycopg
    state: present

- name: Create PostgreSQL user
  no_log: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ deployed_env.DB_USER | default('praho') }}"
    password: "{{ deployed_env.DB_PASSWORD }}"
    role_attr_flags: CREATEDB
    state: present

- name: Create PostgreSQL database
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ deployed_env.DB_NAME | default('praho') }}"
    template: template0
    owner: "{{ deployed_env.DB_USER | default('praho') }}"
    encoding: UTF-8
    lc_collate: en_US.UTF-8
    lc_ctype: en_US.UTF-8
    state: present

