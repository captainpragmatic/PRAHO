# =============================================================================
# PRAHO Native Deployment - Default Variables
# =============================================================================
# Override in group_vars/<env>.yml or inventory host_vars

# Deployment method: rsync (dev) or git (prod/staging)
deploy_method: rsync

# Git settings (used when deploy_method: git)
praho_git_repo: "https://github.com/captainpragmatic/PRAHO.git"

# Python
python_version: "3.13"
python_install_directory: /opt/praho-python

# Gunicorn
gunicorn_workers_platform: "{{ 1 if praho_env | default('prod') == 'staging' else 2 }}"
gunicorn_workers_portal: "{{ 1 if praho_env | default('prod') == 'staging' else 2 }}"
gunicorn_worker_class_portal: gthread  # gthread, or sync to roll back (services/portal/gunicorn.conf.py, ADR-0056)
gunicorn_threads_portal: 4  # threads per worker under gthread; sync always has one
gunicorn_timeout_platform: 120

# Systemd memory limits
platform_memory_max: 1G
portal_memory_max: 512M
qcluster_memory_max: 512M

# Django — django_settings_module is derived from `praho_env` in group_vars/all.yml

# Staff access uses the immediate peer IP; override with staff/VPN CIDRs at upgrade.
# An empty list also falls back to loopback; it never enables unrestricted access.
platform_allowed_ips: "{{ (deployed_env.PLATFORM_ALLOWED_CIDRS | default('') | trim).split() or ['127.0.0.1/32', '::1/128'] }}"

# Portal has no access to Platform credentials or writable business data.
portal_user: praho-portal
portal_group: praho-portal
portal_state_directory: /var/lib/praho-portal
