# =============================================================================
# PRAHO - Common Role Tasks
# =============================================================================

# Fix cffi/cryptography on fresh Ubuntu 24.04 — required by Ansible's apt module
- name: Ensure Python cffi backend is available
  raw: apt-get install -y python3-cffi-backend python3-apt
  changed_when: false

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install common packages
  apt:
    name:
      - curl
      - git
      - htop
      - vim
      - ufw
      - unzip
      - ca-certificates
      - gnupg
      - lsb-release
      - cron
      - util-linux-extra
    state: present

- name: Configure the staging and production swap buffer
  ansible.builtin.include_tasks: swap.yml
  when: native_manage_swap | default(true) | bool

- name: Create project group
  group:
    name: "{{ project_group }}"
    state: present

- name: Create project user
  user:
    name: "{{ project_user }}"
    group: "{{ project_group }}"
    shell: /bin/bash
    create_home: yes
    state: present
  register: created_user

- name: Create project directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ project_user }}"
    group: "{{ project_group }}"
    mode: "0755"
  loop:
    "{{ [project_root, project_root + '/deploy', project_root + '/logs', project_root + '/scripts'] +
        ([project_root + '/backups'] if inventory_hostname in groups.get('praho_platform', groups.get('praho', [])) else []) }}"

- name: Configure firewall (UFW)
  when: firewall_enabled | default(true) | bool
  block:
    # The ssh-hardening role owns SSH rules and verifies the listener first.
    # Resetting UFW here would erase the working access path on every deploy.
    - name: Allow HTTP
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Allow HTTPS
      community.general.ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Enable UFW
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

- name: Converge legacy protection without reviving a retired installation
  ansible.builtin.import_tasks: fail2ban.yml
  tags: [fail2ban]

- name: Set timezone
  community.general.timezone:
    name: Etc/UTC
