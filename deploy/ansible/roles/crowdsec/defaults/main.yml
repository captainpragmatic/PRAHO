---
crowdsec_enabled: false
crowdsec_retire_fail2ban: false
crowdsec_simulation: true
crowdsec_policy_preview: false
crowdsec_host_kind: node
crowdsec_enforcement_qualified: false
crowdsec_protected_cidrs: "{{ node_admin_allowed_cidrs | default([]) }}"
crowdsec_gateway_public_key: ""
crowdsec_expected_configuration_digest: ""
crowdsec_local_reader_user: ""
crowdsec_staging_local_source: false
crowdsec_portal_user: "{{ portal_user | default('praho-portal') }}"
crowdsec_ssh_acquisition: journalctl
crowdsec_artifact_lock_path: "{{ role_path }}/../../../crowdsec/artifacts.lock.json"
crowdsec_repository_root: "{{ role_path }}/../../../.."
crowdsec_package_cache: ""
