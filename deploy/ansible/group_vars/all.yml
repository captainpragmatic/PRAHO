# =============================================================================
# PRAHO - Ansible Global Variables
# =============================================================================
# Variables needed by Ansible itself (infrastructure, not Django config).
# Django configuration lives in .env.{prod,staging} — see .env.example.prod.

# Ansible remote Python — pin to system Python to avoid deadsnakes/venv conflicts
ansible_python_interpreter: /usr/bin/python3

# Project settings
project_name: praho
project_user: praho
project_group: praho
project_root: /opt/praho

# Path to the .env file for this deployment (relative to project root)
# Operator workflow: cp .env.example.prod .env.prod → make deploy-prod
env_file_path: "{{ playbook_dir }}/../../../.env.{{ praho_env | default('prod') }}"

# Auto-derive Django settings from praho_env
# Pass -e praho_env=staging|prod on the command line
# Note: "environment" is an Ansible reserved keyword — we use "praho_env" instead
django_settings_module: "config.settings.{{ praho_env | default('prod') }}"

# The native role restricts staff access to loopback by default.
# At upgrade, set platform_allowed_ips in inventory host_vars/group_vars to your
# staff/VPN CIDRs, e.g. ["198.51.100.10/32", "2001:db8:1234::/64"].
# Each list item is one CIDR; templates join with spaces for Caddy remote_ip.
# Empty lists remain restricted. Public API, webhook and health routes stay reachable.
# PLATFORM_ALLOWED_CIDRS is the standalone Compose setting, not an Ansible variable.

# Ports (needed by Caddyfile template and health checks)
platform_port: 8700
portal_port: 8701

# Backup settings
backup_enabled: true
backup_retention_days: 30
backup_directory: /opt/praho/backups

# Git repository (needed in pre_tasks for tag validation — role defaults aren't loaded yet)
praho_git_repo: "https://github.com/captainpragmatic/PRAHO.git"

# Firewall
firewall_enabled: true
allowed_ports:
  - 22
  - 80
  - 443
