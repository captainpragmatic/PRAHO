# =============================================================================
# PRAHO - Two Server Deployment Playbook
# =============================================================================
# Deploys Platform + DB on primary server, Portal on secondary server
#
# Usage:
#   ansible-playbook -i inventory/two-servers.yml playbooks/two-servers.yml -e @$HOME/praho-vars.yml --ask-vault-pass
#
# The inventory reads the hosts from the environment: PRAHO_PLATFORM_IP and PRAHO_PORTAL_IP, and
# optionally PRAHO_SSH_USER and PRAHO_SSH_KEY.
# The role's inputs (domains, secrets) are Ansible variables, not environment variables: pass them
# with -e @<file>, kept in Ansible Vault outside the repository. The role stops first and names any that are missing; the
# list per host is praho_required_inputs in roles/praho/defaults/main.yml, and docs/deployment/DEPLOYMENT.md
# ("Docker Deployment (Ansible role)") describes each.

---
- name: Deploy PRAHO - Primary Server (Platform + DB)
  hosts: primary
  become: yes
  gather_facts: yes

  vars:
    deploy_platform: true
    deploy_portal: false
    deploy_database: true
    deploy_caddy: true

  pre_tasks:
    - name: Validate required variables
      assert:
        that:
          - portal_domain is defined and portal_domain != 'portal.pragmatichost.com'
          - platform_domain is defined and platform_domain != 'platform.pragmatichost.com'
          - db_password is defined and db_password != 'changeme'
          - secret_key is defined and secret_key != 'generate-a-strong-key'
        fail_msg: "Required variables not set. Check environment variables."

  roles:
    - common
    - docker
    - praho

  post_tasks:
    - name: Run database migrations
      command: docker exec praho_platform python manage.py migrate --noinput

    - name: Collect static files
      command: docker exec praho_platform python manage.py collectstatic --noinput

    - name: Set up initial data
      command: docker exec praho_platform python manage.py setup_initial_data

    - name: Get platform API URL for portal
      set_fact:
        platform_api_url: "https://{{ platform_domain }}/api"
      delegate_to: localhost
      delegate_facts: true


- name: Deploy PRAHO - Secondary Server (Portal)
  hosts: secondary
  become: yes
  gather_facts: yes

  vars:
    deploy_platform: false
    deploy_portal: true
    deploy_database: false
    deploy_caddy: true
    platform_api_url: "https://{{ hostvars['platform-server']['platform_domain'] }}/api"

  pre_tasks:
    - name: Validate required variables
      assert:
        that:
          - portal_domain is defined
          - secret_key is defined
          - platform_api_url is defined
        fail_msg: "Required variables not set."

  roles:
    - common
    - docker
    - praho

  post_tasks:
    - name: Verify portal can reach platform
      uri:
        url: "{{ platform_api_url }}"
        status_code: [200, 301, 302, 404]
      register: api_check
      retries: 3
      delay: 5
