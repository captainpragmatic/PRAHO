# =============================================================================
# PRAHO - Backup Playbook
# =============================================================================
# Runs the native backup script on the server and, if asked, downloads the dump it just made.
#
# Usage:
#   ansible-playbook -i inventory/native-single-server.yml playbooks/backup.yml
#   ansible-playbook -i inventory/native-single-server.yml playbooks/backup.yml \
#     -e fetch_backup=true [-e backup_fetch_dir=PATH]    # default: ~/praho-backups on this machine
# The inventory reads the connection settings (PRAHO_SERVER_IP, ...) from the environment. From the
# repository root, `make ansible-backup ENV=staging|prod [FETCH=true]` loads them from .env.<env>.
#
# The download runs as the SSH user (root by default), which must be able to read backup_directory:
# with become, fetch would read the whole dump into memory on both machines.

---
- name: Backup PRAHO Database
  hosts: praho
  become: yes
  gather_facts: no

  tasks:
    - name: Run backup script
      command: "{{ project_root }}/scripts/backup.sh"
      register: backup_result

    - name: Show backup result
      debug:
        var: backup_result.stdout_lines

    - name: Download the dump this run created
      when: fetch_backup | default(false) | bool
      vars:
        # The script prints this line only after a complete, non-empty dump. Fetching that exact path,
        # never the newest file, cannot pick up a cron run's dump while it is still being written.
        backup_file: >-
          {{ backup_result.stdout_lines | select('search', 'Backup created: ') | first | default('')
             | regex_replace('^.*Backup created: ', '') }}
        fetch_dir: "{{ backup_fetch_dir | default(lookup('env', 'HOME') ~ '/praho-backups') }}"
      block:
        - name: Check the dump's path and the download directory
          assert:
            that:
              - backup_file | length > 0
              - fetch_dir | length > 0
            fail_msg: >-
              Nothing to download: the backup script did not report a dump ("Backup created: <path>"),
              or backup_fetch_dir is empty.

        - name: Create the download directory, readable only by you
          file:
            path: "{{ fetch_dir }}"
            state: directory
            mode: "0700"
          delegate_to: localhost
          become: false

        - name: Download the dump
          fetch:
            src: "{{ backup_file }}"
            dest: "{{ fetch_dir }}/"
            flat: yes
          become: false

        - name: Make the downloaded dump readable only by you
          file:
            path: "{{ fetch_dir }}/{{ backup_file | basename }}"
            mode: "0600"
          delegate_to: localhost
          become: false
