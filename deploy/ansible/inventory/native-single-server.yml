# =============================================================================
# PRAHO - Native Single Server Inventory (Unified)
# =============================================================================
# All-in-one server: Platform + Portal + DB + Caddy
# Works for ALL environments — pass -e praho_env=staging|prod
#
# Connection vars (PRAHO_SERVER_IP, PRAHO_SSH_USER, PRAHO_SSH_KEY) are read
# from .env.{env} as data by the native launcher before Ansible runs.
#
# Deploy:
#   make deploy-staging   # reads .env.staging
#   make deploy-prod      # reads .env.prod

all:
  hosts:
    praho-server:
      ansible_host: "{{ lookup('env', 'PRAHO_SERVER_IP') }}"
      ansible_user: "{{ lookup('env', 'PRAHO_SSH_USER') | default('root', true) }}"
      ansible_port: "{{ lookup('env', 'PRAHO_SSH_PORT') | default('9876', true) | int }}"
      ansible_ssh_private_key_file: "{{ lookup('env', 'PRAHO_SSH_KEY') | default(None, true) }}"
      ansible_ssh_common_args: >-
        -o StrictHostKeyChecking=yes -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no
        -o HostKeyAlias={{ ansible_host | quote }}
        -o UserKnownHostsFile={{ lookup('env', 'PRAHO_DEPLOY_KNOWN_HOSTS_FILE') | quote }}

  children:
    praho:
      hosts:
        praho-server:
