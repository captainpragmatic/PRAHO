# =============================================================================
# PRAHO - PLATFORM ONLY DEPLOYMENT
# =============================================================================
# Deploy Platform service only (with or without database)
# Portal runs separately or not at all
#
# Profiles:
#   - default: Platform only (external database)
#   - with-db: Platform + PostgreSQL
#   - with-caddy: Platform + Caddy reverse proxy
#   - full: Platform + PostgreSQL + Caddy
#
# deploy.sh platform-only [--with-db] [--with-caddy] [--full] selects the profiles and, for the
# bundled database, DB_HOST=db and DB_SSLMODE=disable. Directly, add --profile NAME before `up`
# (and those two variables for the bundled database):
#   PRAHO_ENV_FILE=$PWD/.env.prod docker compose --env-file .env.prod -f deploy/docker-compose.platform-only.yml --profile with-db up -d
#
# Required (deploy.sh sets PRAHO_ENV_FILE; the rest belong in the env file):
#   - PRAHO_ENV_FILE: the env file's own path
#   - DB_PASSWORD, DJANGO_SECRET_KEY
#   - PLATFORM_API_SECRET (same value as HMAC_SECRET), PLATFORM_TO_PORTAL_WEBHOOK_SECRET
#   - DJANGO_ENCRYPTION_KEY, CREDENTIAL_VAULT_MASTER_KEY (production settings; deploy.sh checks them)
#   - DB_HOST without the with-db/full profiles

services:
  # ===========================================================================
  # DATABASE (optional - use profile: with-db or full)
  # ===========================================================================
  db:
    image: postgres:15-alpine
    container_name: praho_db
    environment:
      POSTGRES_DB: praho
      POSTGRES_USER: praho
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praho -d praho"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - internal
    profiles:
      - with-db
      - full

  # ===========================================================================
  # PLATFORM SERVICE
  # ===========================================================================
  platform:
    image: ${REGISTRY:-}praho-platform:${VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/platform/Dockerfile
    container_name: praho_platform
    # Loopback only: Caddy (--with-caddy/--full) reaches the platform over the Docker network, and a
    # proxy on this host can use 127.0.0.1. Publishing it wider would bypass Caddy's TLS and the
    # PLATFORM_ALLOWED_CIDRS staff allowlist; set PLATFORM_BIND only for an external load balancer.
    ports:
      - "${PLATFORM_BIND:-127.0.0.1}:${PLATFORM_PORT:-8700}:8700"
    env_file: &platform-env-file
      # The operator's whole env file (deploy.sh exports its path); `environment:` below still wins.
      - "${PRAHO_ENV_FILE:?run deploy/scripts/deploy.sh, or set PRAHO_ENV_FILE to the file passed with --env-file}"
    environment: &platform-environment
      - DEBUG=0
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-praho}
      - DB_USER=${DB_USER:-praho}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD required}
      # Production defaults to sslmode=require, right for an external database. The bundled database
      # (with-db/full profiles) has no TLS: set DB_SSLMODE=disable, which deploy.sh does for those profiles.
      - DB_SSLMODE=${DB_SSLMODE:-require}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY required}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings.prod}
      - STATIC_ROOT=/app/staticfiles
      - HMAC_SECRET=${PLATFORM_API_SECRET:?PLATFORM_API_SECRET required}
      # Per-portal HMAC registry (#277). Unset => legacy shared-secret behavior (safe default).
      - PORTAL_HMAC_MODE=${PORTAL_HMAC_MODE:-legacy}
      - PORTAL_HMAC_CREDENTIALS=${PORTAL_HMAC_CREDENTIALS:-}
      - PLATFORM_TO_PORTAL_WEBHOOK_SECRET=${PLATFORM_TO_PORTAL_WEBHOOK_SECRET:?PLATFORM_TO_PORTAL_WEBHOOK_SECRET required}
      # Production settings refuse to start without these two and name the missing one; staging doesn't
      # need them, so Compose doesn't require them. The portal never gets them.
      - DJANGO_ENCRYPTION_KEY=${DJANGO_ENCRYPTION_KEY:-}
      - DJANGO_ENCRYPTION_KEY_PREVIOUS=${DJANGO_ENCRYPTION_KEY_PREVIOUS:-}
      - CREDENTIAL_VAULT_MASTER_KEY=${CREDENTIAL_VAULT_MASTER_KEY:-}
      - PLATFORM_DOMAIN=${PLATFORM_DOMAIN:-${DOMAIN:-platform.localhost}}
      - PORTAL_DOMAIN=${PORTAL_DOMAIN:-${DOMAIN:-localhost}}
      - ALLOWED_HOSTS=${PLATFORM_DOMAIN:-${DOMAIN:-platform.localhost}},localhost,platform
      - CSRF_TRUSTED_ORIGINS=https://${PLATFORM_DOMAIN:-${DOMAIN:-platform.localhost}}
      - DJANGO_SECURE_SSL_REDIRECT=false
      - SERVICE_NAME=platform
    volumes: &platform-volumes
      - static_files:/app/staticfiles
      - media_files:/app/media
      - logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8700/api/users/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      # A first boot runs every migration before Gunicorn listens (124 s measured on a fast machine);
      # failures during the start period don't count, and a passing check ends it early.
      start_period: 600s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - internal
      - web

  # ===========================================================================
  # TASK WORKER - Django-Q: queued mails, invoices, provisioning, scheduled jobs
  # ===========================================================================
  qcluster:
    image: ${REGISTRY:-}praho-platform:${VERSION:-latest}
    container_name: praho_qcluster
    command: ["python", "manage.py", "qcluster"]
    env_file: *platform-env-file
    environment: *platform-environment
    volumes: *platform-volumes
    # The platform container runs the migrations; the worker starts once that one is healthy.
    depends_on:
      platform:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
      - web

  # ===========================================================================
  # CADDY (optional - use profile: with-caddy or full)
  # ===========================================================================
  caddy:
    image: caddy:2-alpine
    container_name: praho_caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PORTAL_DOMAIN=${PORTAL_DOMAIN:-${DOMAIN:-localhost}}
      - PLATFORM_DOMAIN=${PLATFORM_DOMAIN:-${DOMAIN:-platform.localhost}}
      # Space-separated CIDRs, never commas. Applies only to the Platform staff site.
      - PLATFORM_ALLOWED_CIDRS=${PLATFORM_ALLOWED_CIDRS:-127.0.0.1/32 ::1/128}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
      # Set but empty would make Caddy send an empty header (HSTS off), so the default is repeated here.
      - HSTS_POLICY=${HSTS_POLICY:-max-age=31536000; includeSubDomains}
    volumes:
      - ./caddy/Caddyfile.platform:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - static_files:/srv/static:ro
      - media_files:/srv/media:ro
    depends_on:
      - platform
    restart: unless-stopped
    networks:
      - web
    profiles:
      - with-caddy
      - full

networks:
  internal:
    driver: bridge
  web:
    driver: bridge

volumes:
  postgres_data:
  static_files:
  media_files:
  logs:
  caddy_data:
  caddy_config:
