[pytest]
# The Virtualmin contract suite (make test-virtualmin-contract). It talks to the real lab nodes through
# PRAHO's own gateway and uses the lab database directly, so pytest-django (which would build a test
# database) stays off, and the platform's ini and coverage options do not apply.
addopts = -p no:django -p no:cacheprovider -p no:cov --tb=short -ra
python_files = test_*.py
testpaths = tests/virtualmin_lab/contract
markers =
    virtualmin_lab: a browser smoke test against the Docker Virtualmin lab (make test-virtualmin-e2e); never part of make test-e2e
    smoke: the node-agnostic subset the nightly node deploy runs against a freshly installed node (make test-virtualmin-node-deploy)
